server {
    server_name calc.h-r-h.ru;	
    # Статика из папки public
    location / {
        root /opt/calc_wardrobe/public;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на Express
    location /api/ {
	proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/calc.h-r-h.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/calc.h-r-h.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = calc.h-r-h.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name calc.h-r-h.ru;
    return 404; # managed by Certbot


}