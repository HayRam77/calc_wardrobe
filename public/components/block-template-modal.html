<script>
// Модальное окно "Добавить компонент шкафа"
window.BlockTemplateModal = {
    _cb: null,
    _modal: null,
    
    open: function(callback, preselectedId) {
        this._cb = callback;
        var cb = callback;
        var self = this;
        
        // Создаём модальное окно если его нет
        if (!this._modal) {
            var m = document.createElement('div'); m.className = 'modal'; m.style.cssText = 'z-index:3000;';
            m.innerHTML = '<div class="modal-content" style="max-width:700px;max-height:90vh;overflow-y:auto;"><span class="modal-close">&times;</span><h3>Добавить компонент шкафа</h3><form id="blockTemplateForm"><input type="hidden" id="blockTemplateId"></form></div>';
            document.body.appendChild(m);
            m.querySelector('.modal-close').addEventListener('click', function(){ m.style.display = 'none'; });
            m.addEventListener('click', function(e){ if(e.target === m) m.style.display = 'none'; });
            this._modal = m;
        }
        
        this._modal.style.display = 'block';
        var f = document.getElementById('blockTemplateForm');
        
        fetch('/api/manufacturers').then(function(r){return r.json();}).then(function(manufacturers){
            var h = '<div class="form-group"><label>Существующий компонент</label><select id="existingBlockSelect" style="width:100%;"><option value="">-- выберите или создайте новый --</option></select></div>';
            h += '<div class="form-row"><div class="form-group"><label>Тип</label><div id="blockTypeContainer"></div></div>';
            h += '<div class="form-group"><label>Производитель</label><select id="blockManufacturer"><option value="">-- Производитель --</option>'+manufacturers.map(function(m){return'<option value="'+m.id+'">'+m.name+'</option>';}).join('')+'</select></div></div>';
            h += '<div class="form-row"><div class="form-group"><label>Название *</label><input type="text" id="blockName" required></div><div class="form-group"><label>Артикул</label><input type="text" id="blockArticle"></div></div>';
            h += '<div class="form-row"><div class="form-group"><label>Цена, руб.</label><input type="number" id="blockPrice" step="0.01"></div><div class="form-group"><label>Вес, гр.</label><input type="number" id="blockWeight" step="0.01"></div></div>';
            h += '<div class="form-row"><div class="form-group"><label>Мощность, Вт</label><input type="number" id="blockPower" step="0.01"></div><div class="form-group"><label>LN</label><input type="text" id="blockLn"></div></div>';
            h += '<div class="form-group"><label>Ссылка</label><input type="url" id="blockUrl"></div>';
            h += '<div class="form-group"><label>Описание</label><textarea id="blockDescription" rows="2"></textarea></div>';
            h += '<h4>Параметры</h4><div id="blockParamsContainer"></div><button type="button" id="addBlockParamBtn" class="btn btn-sm btn-secondary">+ Добавить параметр</button>';
            h += '<div class="form-actions"><button type="button" class="btn btn-secondary cancel-block-btn">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';
            f.innerHTML = h;
            
            // Загружаем существующие компоненты
            fetch('/api/block-templates').then(function(r){return r.json();}).then(function(blocks){
                var sel = document.getElementById('existingBlockSelect');
                blocks.forEach(function(b){
                    sel.innerHTML += '<option value="'+b.id+'">'+(b.type_name||'')+' '+b.name+' ('+(b.article||'')+')</option>';
                });
                if (preselectedId) { sel.value = preselectedId; sel.dispatchEvent(new Event('change')); }
                sel.addEventListener('change', function(){
                    if (sel.value) {
                        var b = blocks.find(function(x){return x.id===parseInt(sel.value);});
                        if (b) {
                            document.getElementById('blockName').value = b.name||'';
                            document.getElementById('blockArticle').value = b.article||'';
                            document.getElementById('blockPrice').value = b.price||'';
                            document.getElementById('blockWeight').value = b.weight_grams||'';
                            document.getElementById('blockPower').value = b.power_watts||'';
                            document.getElementById('blockLn').value = b.ln||'';
                            document.getElementById('blockUrl').value = b.url||'';
                            document.getElementById('blockDescription').value = b.description||'';
                            // Устанавливаем тип
                            if (b.type_id) {
                                var typeSel = bt.querySelector('.cabinet-type-select');
                                if (typeSel) typeSel.value = b.type_id;
                            }
                            // Устанавливаем производителя
                            if (b.manufacturer_id) {
                                document.getElementById('blockManufacturer').value = b.manufacturer_id;
                            }
                        }
                    }
                });
            });
            
            document.querySelector('.cancel-block-btn').addEventListener('click', function(){ self._modal.style.display = 'none'; });
            
            // Типы
            var bt = document.getElementById('blockTypeContainer');
            fetch('/api/component-types').then(function(r){return r.json();}).then(function(types){
                var s = '<select class="cabinet-type-select" style="width:100%;"><option value="">-- тип --</option>';
                if (types.length) { s += '<optgroup label="Существующие">'; types.forEach(function(t){ s += '<option value="'+t.id+'">'+t.name+'</option>'; }); s += '</optgroup>'; }
                s += '<optgroup label="Добавить"><option value="__new__">+ новый тип</option></optgroup></select>';
                s += '<div class="new-type-row" style="display:none;margin-top:5px;display:flex;gap:5px;"><input type="text" class="new-type-name" placeholder="Название нового типа" style="flex:1;"><button type="button" class="btn btn-sm btn-primary save-type-btn">✓</button></div>';
                bt.innerHTML = s;
                var sel = bt.querySelector('.cabinet-type-select'), nr = bt.querySelector('.new-type-row');
                sel.addEventListener('change', function(){ nr.style.display = sel.value === '__new__' ? 'flex' : 'none'; });
                bt.querySelector('.save-type-btn').addEventListener('click', function(){
                    var n = bt.querySelector('.new-type-name').value.trim(); if (!n) { alert('Введите название'); return; }
                    fetch('/api/component-types', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
                    .then(function(r){return r.json();}).then(function(nt){ sel.innerHTML += '<option value="'+nt.id+'">'+nt.name+'</option>'; sel.value = nt.id; nr.style.display = 'none'; });
                });
            });
            
            // Параметры
            var pc = document.getElementById('blockParamsContainer'); pc.innerHTML = '';
            function ap(p, v) {
                var r = document.createElement('div'); r.className = 'block-param-row'; r.style.cssText = 'display:flex;gap:8px;margin-bottom:5px;';
                fetch('/api/parameters').then(function(rr){return rr.json();}).then(function(params){
                    var s2 = '<select class="cabinet-param-select" style="flex:1;"><option value="">-- параметр --</option>';
                    if (params.length) { s2 += '<optgroup label="Существующие">'; params.forEach(function(x){ s2 += '<option value="'+x.id+'"'+(p==x.id?' selected':'')+'>'+x.name+'</option>'; }); s2 += '</optgroup>'; }
                    s2 += '<optgroup label="Добавить"><option value="__new__">+ новый параметр</option></optgroup></select>';
                    r.innerHTML = s2 + '<input type="text" class="cabinet-param-value" placeholder="Значение" style="flex:1;" value="'+(v||'')+'"><input type="text" class="cabinet-param-new-name" placeholder="Название" style="flex:2;display:none;"><button type="button" class="btn btn-sm btn-primary cabinet-param-save-btn" style="display:none;">✓</button>';
                    var dl = document.createElement('button'); dl.type = 'button'; dl.textContent = '✕'; dl.className = 'btn btn-sm btn-delete';
                    dl.addEventListener('click', function(){ r.remove(); }); r.appendChild(dl); pc.appendChild(r);
                    var s3 = r.querySelector('.cabinet-param-select'), ni = r.querySelector('.cabinet-param-new-name'), sv = r.querySelector('.cabinet-param-save-btn');
                    s3.addEventListener('change', function(){ ni.style.display = sv.style.display = s3.value === '__new__' ? '' : 'none'; });
                    sv.addEventListener('click', function(){
                        var n = ni.value.trim(); if (!n) { alert('Введите название'); return; }
                        fetch('/api/parameters', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
                        .then(function(rr){return rr.json();}).then(function(np){ s3.innerHTML += '<option value="'+np.id+'">'+np.name+'</option>'; s3.value = np.id; ni.style.display = 'none'; sv.style.display = 'none'; });
                    });
                });
            }
            ap(null, null);
            document.getElementById('addBlockParamBtn').addEventListener('click', function(){ ap(null, null); });
            
            f.onsubmit = function(e) {
                e.preventDefault();
                var name = document.getElementById('blockName').value.trim();
                var existingId = document.getElementById('existingBlockSelect').value;
                if (existingId) { self._modal.style.display = 'none'; if (cb) cb(parseInt(existingId)); return; }
                if (!name) { alert('Введите название'); return; }
                var typeSel = bt.querySelector('.cabinet-type-select');
                var params = [];
                pc.querySelectorAll('.block-param-row').forEach(function(r){
                    var s4 = r.querySelector('.cabinet-param-select'), v = r.querySelector('.cabinet-param-value');
                    if (s4.value && s4.value !== '__new__') params.push({parameter_id: parseInt(s4.value), param_value: v.value});
                });
                fetch('/api/block-templates', {method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({name:name, type_id:typeSel&&typeSel.value!=='__new__'?typeSel.value:null,
                        manufacturer_id: document.getElementById('blockManufacturer').value || null,
                        article: document.getElementById('blockArticle').value.trim() || null,
                        price: document.getElementById('blockPrice').value || null,
                        weight_grams: document.getElementById('blockWeight').value || null,
                        power_watts: document.getElementById('blockPower').value || null,
                        ln: document.getElementById('blockLn').value.trim() || null,
                        url: document.getElementById('blockUrl').value.trim() || null,
                        description: document.getElementById('blockDescription').value.trim() || null,
                        parameters: params})
                }).then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});return r.json();})
                .then(function(nb){ self._modal.style.display = 'none'; if (cb) cb(nb.id); })
                .catch(function(err){ alert(err.message); });
            };
        });
    }
};
</script>
