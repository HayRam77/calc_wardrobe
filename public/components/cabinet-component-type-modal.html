<script>
window.CabinetComponentTypeModal = {
    _cb: null,

    open: function(typeId, callback) {
        this._cb = callback;
        var self = this;
        var isEdit = !!typeId;

        var m = document.createElement('div');
        m.className = 'modal';
        m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000;';
        m.innerHTML = '<div class="modal-content" style="max-width:850px;width:95vw;max-height:90vh;overflow-y:auto;padding:20px;background:#fff;border-radius:8px;"><span class="modal-close" style="cursor:pointer;float:right;font-size:24px;font-weight:bold;">&times;</span><h3 style="margin-top:0;">'+(isEdit ? 'Редактировать тип компонента шкафа' : 'Добавить тип компонента шкафа')+'</h3><form id="cabTypeForm"></form></div>';
        document.body.appendChild(m);

        var closeModal = function() {
            m.remove();
            if (self._cb) self._cb();
        };
        m.querySelector('.modal-close').addEventListener('click', closeModal);
        m.addEventListener('click', function(e){ if(e.target === m) closeModal(); });

        if (isEdit) {
            fetch('/api/component-types/' + typeId + '?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(typeData){
                    self._buildForm(m, typeData, callback, closeModal);
                })
                .catch(function(err){
                    console.error('Ошибка загрузки типа:', err);
                    alert('Ошибка загрузки данных типа.');
                    closeModal();
                });
        } else {
            self._buildForm(m, null, callback, closeModal);
        }
    },

    _buildForm: function(m, typeData, callback, closeModal) {
        var self = this;
        var isEdit = !!typeData;
        var currentTypeId = typeData ? typeData.id : null;

        var h = '';
        h += '<div class="form-group" style="margin-bottom:12px;"><label for="typeName" style="font-weight:bold;display:block;margin-bottom:4px;">Название типа компонента шкафа: <span style="color:red;">*</span></label><input type="text" id="typeName" class="form-control" style="width:100%;padding:8px;box-sizing:border-box;" value="'+self._esc(typeData ? typeData.name : '')+'" required></div>';
        h += '<div class="form-group" style="margin-bottom:12px;"><label for="typeDescription" style="font-weight:bold;display:block;margin-bottom:4px;">Описание:</label><textarea id="typeDescription" class="form-control" style="width:100%;padding:8px;box-sizing:border-box;" rows="3">'+self._esc(typeData ? typeData.description || '' : '')+'</textarea></div>';

        // Материалы типа компонента шкафа
        h += '<div class="form-group" style="margin-top:15px;border-top:1px solid #eee;padding-top:10px;"><label style="font-weight:bold;display:block;margin-bottom:5px;">Материалы типа компонента шкафа (наследуются всеми компонентами этого типа):</label><div id="typeLinkedMaterials"><p style="color:#888;">'+(isEdit ? 'Загрузка...' : 'Сначала сохраните создаваемый тип')+'</p></div><button type="button" id="addTypeMaterialBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить материал</button></div>';

        // Группы материалов типа компонента шкафа
        h += '<div class="form-group" style="margin-top:15px;border-top:1px solid #eee;padding-top:10px;"><label style="font-weight:bold;display:block;margin-bottom:5px;">Группы материалов типа компонента шкафа (наследуются всеми компонентами этого типа):</label><div id="typeLinkedMaterialGroups"><p style="color:#888;">'+(isEdit ? 'Загрузка...' : 'Сначала сохраните создаваемый тип')+'</p></div><button type="button" id="addTypeMaterialGroupBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить группу материалов</button></div>';

        h += '<div class="form-actions" style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn btn-secondary cancel-type-btn">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';

        m.querySelector('#cabTypeForm').innerHTML = h;

        m.querySelector('.cancel-type-btn').onclick = closeModal;

        function refreshTypeMaterials() {
            var mc = m.querySelector('#typeLinkedMaterials');
            if (!currentTypeId) return;
            fetch('/api/component-types/' + currentTypeId + '/materials?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(data){
                    if (!data || !data.length) {
                        mc.innerHTML = '<p style="color:#888;">Нет материалов</p>';
                    } else {
                        var html = '<table class="data-table" style="width:100%;font-size:13px;border-collapse:collapse;"><thead><tr style="background:#f5f5f5;"><th>Артикул</th><th>Название</th><th>Ед.изм.</th><th>LN</th><th>TM</th><th>Кол-во</th><th></th></tr></thead><tbody>';
                        data.forEach(function(item){
                            html += '<tr>' +
                                '<td>'+self._esc(item.article || '')+'</td>' +
                                '<td>'+self._esc(item.name)+'</td>' +
                                '<td>'+self._esc(item.unit || '')+'</td>' +
                                '<td>'+self._esc(item.ln || '')+'</td>' +
                                '<td>'+self._esc(item.tm || '')+'</td>' +
                                '<td>'+item.quantity+'</td>' +
                                '<td>' +
                                    '<button type="button" class="btn btn-sm btn-delete del-mat-btn" data-mat-id="'+item.material_id+'">×</button>' +
                                '</td>' +
                            '</tr>';
                        });
                        html += '</tbody></table>';
                        mc.innerHTML = html;

                        mc.querySelectorAll('.del-mat-btn').forEach(function(btn){
                            btn.onclick = function(){
                                fetch('/api/component-types/' + currentTypeId + '/materials/' + btn.dataset.matId, { method: 'DELETE' })
                                    .then(function(){ refreshTypeMaterials(); });
                            };
                        });
                    }
                })
                .catch(function(err){ console.error('Ошибка загрузки материалов типа:', err); });
        }

        function refreshTypeMaterialGroups() {
            var mgc = m.querySelector('#typeLinkedMaterialGroups');
            if (!currentTypeId) return;
            fetch('/api/component-types/' + currentTypeId + '/material-groups?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(groups){
                    if (!groups || !groups.length) {
                        mgc.innerHTML = '<p style="color:#888;">Нет привязанных групп материалов</p>';
                    } else {
                        var html = '';
                        groups.forEach(function(g){
                            html += '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:8px;background:#fff;">';
                            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">';
                            html += '<strong>📦 ' + self._esc(g.group_name || g.name) + '</strong>';
                            html += '<button type="button" class="btn btn-sm btn-delete unbind-type-group-btn" data-link-id="' + g.link_id + '">✕</button>';
                            html += '</div>';
                            if (g.items && g.items.length) {
                                html += '<table class="data-table" style="width:100%;font-size:12px;">';
                                html += '<thead><tr><th>Материал</th><th>Артикул</th><th>Кол-во</th><th>Ед.</th></tr></thead><tbody>';
                                g.items.forEach(function(it){
                                    html += '<tr><td>' + self._esc(it.name || '') + '</td><td>' + self._esc(it.article || '-') + '</td><td>' + (it.quantity || 1) + '</td><td>' + self._esc(it.unit || '') + '</td></tr>';
                                });
                                html += '</tbody></table>';
                            } else {
                                html += '<div style="font-size:12px;color:#94a3b8;">Группа пуста</div>';
                            }
                            html += '</div>';
                        });
                        mgc.innerHTML = html;

                        mgc.querySelectorAll('.unbind-type-group-btn').forEach(function(btn){
                            btn.addEventListener('click', function(){
                                fetch('/api/component-types/' + currentTypeId + '/material-groups/' + btn.dataset.linkId, { method: 'DELETE' })
                                    .then(function(){ refreshTypeMaterialGroups(); });
                            });
                        });
                    }
                })
                .catch(function(err){ console.error('Ошибка загрузки групп материалов типа:', err); });
        }

        if (isEdit) {
            refreshTypeMaterials();
            refreshTypeMaterialGroups();
        }

        m.querySelector('#addTypeMaterialBtn').addEventListener('click', function(){
            if (!currentTypeId) { alert('Сначала сохраните основной заголовок типа'); return; }
            self._ensureMaterialModal(function() {
                if (typeof MaterialModal !== 'undefined') {
                    var selectFn = MaterialModal.select || MaterialModal.open;
                    selectFn.call(MaterialModal, function(materialId){
                        if (materialId) {
                            var qty = prompt('Количество:', '1');
                            if (qty && !isNaN(qty) && parseInt(qty) > 0) {
                                fetch('/api/component-types/' + currentTypeId + '/materials', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ material_id: materialId, quantity: parseInt(qty) })
                                }).then(function(){ refreshTypeMaterials(); });
                            }
                        }
                    });
                } else {
                    alert('Модальное окно выбора материалов недоступно');
                }
            });
        });

        m.querySelector('#addTypeMaterialGroupBtn').addEventListener('click', function(){
            if (!currentTypeId) { alert('Сначала сохраните основной заголовок типа'); return; }
            fetch('/api/material-groups')
                .then(function(r){ return r.json(); })
                .then(function(groups){
                    if (!groups || !groups.length) {
                        alert('В системе нет созданных групп материалов');
                        return;
                    }
                    var bindModal = document.createElement('div');
                    bindModal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:7000;';
                    var popHtml = '<div style="background:#fff;padding:20px;border-radius:8px;width:350px;">';
                    popHtml += '<h4 style="margin-top:0;">Выберите группу материалов</h4>';
                    popHtml += '<select id="selectTypeGroupToBind" class="form-control" style="width:100%;margin-bottom:15px;">';
                    groups.forEach(function(g) {
                        popHtml += '<option value="' + g.id + '">' + self._esc(g.name) + '</option>';
                    });
                    popHtml += '</select>';
                    popHtml += '<div style="display:flex;justify-content:flex-end;gap:10px;">';
                    popHtml += '<button type="button" class="btn btn-secondary cancel-bind-btn">Отмена</button>';
                    popHtml += '<button type="button" class="btn btn-primary confirm-bind-btn">Привязать</button>';
                    popHtml += '</div></div>';
                    bindModal.innerHTML = popHtml;
                    document.body.appendChild(bindModal);

                    bindModal.querySelector('.cancel-bind-btn').onclick = function() { bindModal.remove(); };
                    bindModal.querySelector('.confirm-bind-btn').onclick = function() {
                        var groupId = bindModal.querySelector('#selectTypeGroupToBind').value;
                        if (groupId) {
                            fetch('/api/component-types/' + currentTypeId + '/material-groups', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ group_id: groupId })
                            }).then(function(){
                                bindModal.remove();
                                refreshTypeMaterialGroups();
                            });
                        }
                    };
                });
        });

        // Сохранение
        m.querySelector('#cabTypeForm').addEventListener('submit', function(e){
            e.preventDefault();
            var name = m.querySelector('#typeName').value.trim();
            var description = m.querySelector('#typeDescription').value.trim();
            if (!name) { alert('Введите название типа'); return; }

            var body = { name: name, description: description || null };
            var url = isEdit ? '/api/component-types/' + currentTypeId : '/api/component-types';

            fetch(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(r){
                if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
                return r.json();
            })
            .then(function(data){
                closeModal();
            })
            .catch(function(err){ alert(err.message); });
        });
    },

    _ensureMaterialModal: function(cb) {
        if (typeof MaterialModal !== 'undefined') return cb();
        fetch('/components/material-modal.html')
            .then(function(r){ return r.text(); })
            .then(function(html){
                var div = document.createElement('div');
                div.innerHTML = html;
                Array.from(div.querySelectorAll('script')).forEach(function(s){
                    var newScript = document.createElement('script');
                    newScript.textContent = s.textContent;
                    document.body.appendChild(newScript);
                });
                cb();
            }).catch(function(err){
                console.error(err);
                alert('Ошибка загрузки компонентов материалов');
            });
    },

    _esc: function(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }
};
</script>
