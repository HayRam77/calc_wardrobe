<script>
window.MaterialModal = {
    _cb: null,

    open: function(callback, preselectedId) {
        this._cb = callback;
        var self = this;
        var isEdit = !!preselectedId;

        // Создаем модальное окно динамически
        var m = document.createElement('div');
        m.className = 'modal';
        m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:6000;';
        m.innerHTML = '<div class="modal-content" style="max-width:95vw;max-height:90vh;overflow-y:auto;width:600px;">' +
            '<span class="modal-close">&times;</span>' +
            '<h3 id="materialModalTitle">Добавить материал</h3>' +
            '<form id="materialForm">' +
            '<input type="hidden" id="materialId">' +
            '<div class="form-group"><label for="existingMaterialSelect">Существующий материал</label><select id="existingMaterialSelect" class="form-control" style="width:100%;"><option value="">-- выберите или создайте новый --</option></select></div>' +
            '<hr style="margin:15px 0;">' +
            '<div class="form-group"><label for="materialArticle">Артикул</label><input type="text" id="materialArticle" class="form-control"></div>' +
            '<div class="form-group"><label for="materialName">Название *</label><input type="text" id="materialName" class="form-control" required></div>' +
            '<div class="form-group"><label for="materialManufacturer">Производитель</label><select id="materialManufacturer" class="form-control"><option value="">-- без производителя --</option></select></div>' +
            '<div class="form-group"><label for="materialDescription">Описание</label><textarea id="materialDescription" class="form-control" rows="2"></textarea></div>' +
            '<div class="form-group"><label for="materialManufacturerUrl">Ссылка на сайт производителя</label><input type="url" id="materialManufacturerUrl" class="form-control" placeholder="https://example.com"></div>' +
            '<div class="form-row" style="display:flex;gap:10px;">' +
            '<div class="form-group" style="flex:1;"><label for="materialLn">LN</label><input type="text" id="materialLn" class="form-control"></div>' +
            '<div class="form-group" style="flex:1;"><label for="materialTm">TM</label><input type="text" id="materialTm" class="form-control"></div>' +
            '</div>' +
            '<div class="form-row" style="display:flex;gap:10px;">' +
            '<div class="form-group" style="flex:1;"><label for="materialUnit">Ед. изм.</label><input type="text" id="materialUnit" class="form-control" placeholder="шт, м, кг..."></div>' +
            '<div class="form-group" style="flex:1;"><label for="materialPrice">Цена, руб.</label><input type="number" id="materialPrice" class="form-control" step="0.01"></div>' +
            '</div>' +
            '<div id="materialError" class="error-message" style="display:none;color:red;margin-top:10px;"></div>' +
            '<div class="form-actions" style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;">' +
            '<button type="button" class="btn btn-secondary cancel-material-btn">Отмена</button>' +
            '<button type="submit" class="btn btn-primary">Сохранить</button>' +
            '</div>' +
            '</form>' +
            '</div>';
        document.body.appendChild(m);

        var closeModal = function() { m.remove(); };
        m.querySelector('.modal-close').addEventListener('click', closeModal);
        m.querySelector('.cancel-material-btn').addEventListener('click', closeModal);
        m.addEventListener('click', function(e){ if(e.target === m) closeModal(); });

        var form = m.querySelector('#materialForm');
        var title = m.querySelector('#materialModalTitle');
        var errorDiv = m.querySelector('#materialError');
        var existingSelect = m.querySelector('#existingMaterialSelect');

        function loadManufacturers(selectedId) {
            return fetch('/api/manufacturers')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var sel = m.querySelector('#materialManufacturer');
                    sel.innerHTML = '<option value="">-- без производителя --</option>';
                    data.forEach(function(man) {
                        sel.innerHTML += '<option value="' + man.id + '">' + (man.name || '') + '</option>';
                    });
                    if (selectedId) sel.value = selectedId;
                });
        }

        function loadExistingMaterials(selectedId) {
            return fetch('/api/materials')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    existingSelect.innerHTML = '<option value="">-- выберите или создайте новый --</option>';
                    data.forEach(function(mat) {
                        var text = mat.article ? mat.article + ' - ' : '';
                        text += mat.name;
                        if (mat.manufacturer_name) text += ' (' + mat.manufacturer_name + ')';
                        existingSelect.innerHTML += '<option value="' + mat.id + '">' + text + '</option>';
                    });
                    if (selectedId) {
                        existingSelect.value = selectedId;
                    }
                });
        }

        function fillMaterialData(material) {
            if (!material) return;
            m.querySelector('#materialId').value = material.id || '';
            m.querySelector('#materialArticle').value = material.article || '';
            m.querySelector('#materialName').value = material.name || '';
            m.querySelector('#materialDescription').value = material.description || '';
            m.querySelector('#materialUnit').value = material.unit || '';
            m.querySelector('#materialPrice').value = material.price || '';
            m.querySelector('#materialManufacturerUrl').value = material.manufacturer_url || '';
            m.querySelector('#materialLn').value = material.ln || '';
            m.querySelector('#materialTm').value = material.tm || '';
            if (material.manufacturer_id) {
                m.querySelector('#materialManufacturer').value = material.manufacturer_id;
            }
        }

        function clearForm() {
            m.querySelector('#materialId').value = '';
            m.querySelector('#materialArticle').value = '';
            m.querySelector('#materialName').value = '';
            m.querySelector('#materialDescription').value = '';
            m.querySelector('#materialUnit').value = '';
            m.querySelector('#materialPrice').value = '';
            m.querySelector('#materialManufacturerUrl').value = '';
            m.querySelector('#materialLn').value = '';
            m.querySelector('#materialTm').value = '';
            m.querySelector('#materialManufacturer').value = '';
            existingSelect.value = '';
            errorDiv.style.display = 'none';
        }

        Promise.all([
            loadManufacturers(),
            loadExistingMaterials(isEdit ? preselectedId : null)
        ]).then(function() {
            if (isEdit && preselectedId) {
                fetch('/api/materials/' + preselectedId)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        fillMaterialData(data);
                        title.textContent = 'Редактировать материал';
                    })
                    .catch(function(err) {
                        console.error(err);
                        errorDiv.textContent = 'Ошибка загрузки данных';
                        errorDiv.style.display = 'block';
                    });
            } else {
                title.textContent = 'Добавить материал';
                clearForm();
            }
        });

        existingSelect.addEventListener('change', function() {
            if (this.value) {
                fetch('/api/materials/' + this.value)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        fillMaterialData(data);
                        title.textContent = 'Редактировать материал';
                        m.querySelector('#materialName').focus();
                    })
                    .catch(function(err) {
                        console.error(err);
                        errorDiv.textContent = 'Ошибка загрузки материала';
                        errorDiv.style.display = 'block';
                    });
            } else {
                clearForm();
                title.textContent = 'Добавить материал';
                m.querySelector('#materialName').focus();
            }
        });

        form.onsubmit = function(e) {
            e.preventDefault();
            var name = m.querySelector('#materialName').value.trim();
            if (!name) {
                errorDiv.textContent = 'Введите название';
                errorDiv.style.display = 'block';
                return;
            }

            var materialId = m.querySelector('#materialId').value;
            var existingId = existingSelect.value;
            if (!materialId && existingId) {
                closeModal();
                if (self._cb) self._cb(parseInt(existingId));
                return;
            }

            var body = {
                article: m.querySelector('#materialArticle').value.trim() || null,
                name: name,
                manufacturer_id: m.querySelector('#materialManufacturer').value || null,
                description: m.querySelector('#materialDescription').value.trim() || null,
                unit: m.querySelector('#materialUnit').value.trim() || null,
                price: parseFloat(m.querySelector('#materialPrice').value) || null,
                manufacturer_url: m.querySelector('#materialManufacturerUrl').value.trim() || null,
                ln: m.querySelector('#materialLn').value.trim() || null,
                tm: m.querySelector('#materialTm').value.trim() || null
            };

            var url = materialId ? '/api/materials/' + materialId : '/api/materials';
            var method = materialId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(r){
                if (!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); });
                return r.json();
            })
            .then(function(data){
                closeModal();
                if (self._cb) self._cb(data.id);
            })
            .catch(function(err){
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            });
        };
    },

    select: function(callback) {
        this.open(function(id) {
            if (callback) callback(id);
        });
    }
};
</script>
