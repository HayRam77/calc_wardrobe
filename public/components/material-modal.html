<script>
window.MaterialModal = {
    _cb: null,
    _modal: null,

    open: function(callback, preselectedId) {
        this._cb = callback;
        var self = this;
        var isEdit = !!preselectedId;

        if (!this._modal) {
            var m = document.createElement('div');
            m.className = 'modal';
            m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:6000;';
            m.innerHTML = '<div class="modal-content" style="max-width:95vw;max-height:90vh;overflow-y:auto;">' +
                '<span class="modal-close">&times;</span>' +
                '<h3 id="materialModalTitle">Добавить материал</h3>' +
                '<form id="materialForm">' +
                '<input type="hidden" id="materialId">' +
                '<div class="form-group"><label>Сществующий материал</label><select id="existingMaterialSelect" style="width:100%;"><option value="">-- выберите или создайте новый --</option></select></div>' +
                '<hr style="margin:15px 0;">' +
                '<div class="form-group"><label>Артикул</label><input type="text" id="materialArticle"></div>' +
                '<div class="form-group"><label>Название *</label><input type="text" id="materialName" required></div>' +
                '<div class="form-group"><label>Производитель</label><select id="materialManufacturer"><option value="">-- без производителя --</option></select></div>' +
                '<div class="form-group"><label>Описание</label><textarea id="materialDescription" rows="2"></textarea></div>' +
                '<div class="form-group"><label>Ссылка на сайт производителя</label><input type="url" id="materialManufacturerUrl" placeholder="https://example.com"></div>' +
                '<div class="form-row" style="display:flex;gap:10px;">' +
                '<div class="form-group" style="flex:1;"><label>LN</label><input type="text" id="materialLn"></div>' +
                '<div class="form-group" style="flex:1;"><label>TM</label><input type="text" id="materialTm"></div>' +
                '</div>' +
                '<div class="form-row" style="display:flex;gap:10px;">' +
                '<div class="form-group" style="flex:1;"><label>Ед. изм.</label><input type="text" id="materialUnit" placeholder="штт, м, кг..."></div>' +
                '<div class="form-group" style="flex:1;"><label>Цена, руб.</label><input type="number" id="materialPrice" step="0.01"></div>' +
                '</div>' +
                '<div id="materialError" class="error-message" style="display:none;"></div>' +
                '<div class="form-actions">' +
                '<button type="button" class="btn btn-secondary cancel-material-btn">Отмена</button>' +
                '<button type="submit" class="btn btn-primary">Сохранить</button>' +
                '</div>' +
                '</form>' +
                '</div>';
            document.body.appendChild(m);
            m.querySelector('.modal-close').addEventListener('click', function(){ m.style.display = 'none'; });
            m.querySelector('.cancel-material-btn').addEventListener('click', function(){ m.style.display = 'none'; });
            m.addEventListener('click', function(e){ if(e.target === m) m.style.display = 'none'; });
            this._modal = m;
        }

        this._modal.style.display = 'block';
        var form = document.getElementById('materialForm');
        var title = document.getElementById('materialModalTitle');
        var errorDiv = document.getElementById('materialError');
        var existingSelect = document.getElementById('existingMaterialSelect');

        function loadManufacturers(selectedId) {
            return fetch('/api/manufacturers')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var sel = document.getElementById('materialManufacturer');
                    sel.innerHTML = '<option value="">-- без производителя --</option>';
                    data.forEach(function(m) {
                        sel.innerHTML += '<option value="' + m.id + '">' + (m.name || '') + '</option>';
                    });
                    if (selectedId) sel.value = selectedId;
                    return data;
                });
        }

        function loadExistingMaterials(selectedId) {
            return fetch('/api/materials')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var sel = document.getElementById('existingMaterialSelect');
                    sel.innerHTML = '<option value="">-- выберите или создайте новый --</option>';
                    data.forEach(function(m) {
                        var text = m.article ? m.article + ' - ' : '';
                        text += m.name;
                        if (m.manufacturer_name) text += ' (' + m.manufacturer_name + ')';
                        sel.innerHTML += '<option value="' + m.id + '">' + text + '</option>';
                    });
                    if (selectedId) {
                        sel.value = selectedId;
                        sel.dispatchEvent(new Event('change'));
                    }
                    return data;
                });
        }

        function fillMaterialData(material) {
            if (!material) return;
            document.getElementById('materialId').value = material.id || '';
            document.getElementById('materialArticle').value = material.article || '';
            document.getElementById('materialName').value = material.name || '';
            document.getElementById('materialDescription').value = material.description || '';
            document.getElementById('materialUnit').value = material.unit || '';
            document.getElementById('materialPrice').value = material.price || '';
            document.getElementById('materialManufacturerUrl').value = material.manufacturer_url || '';
            document.getElementById('materialLn').value = material.ln || '';
            document.getElementById('materialTm').value = material.tm || '';
            if (material.manufacturer_id) {
                document.getElementById('materialManufacturer').value = material.manufacturer_id;
            }
        }

        function clearForm() {
            document.getElementById('materialId').value = '';
            document.getElementById('materialArticle').value = '';
            document.getElementById('materialName').value = '';
            document.getElementById('materialDescription').value = '';
            document.getElementById('materialUnit').value = '';
            document.getElementById('materialPrice').value = '';
            document.getElementById('materialManufacturerUrl').value = '';
            document.getElementById('materialLn').value = '';
            document.getElementById('materialTm').value = '';
            document.getElementById('materialManufacturer').value = '';
            document.getElementById('existingMaterialSelect').value = '';
            errorDiv.style.display = 'none';
        }

        Promise.all([
            loadManufacturers(),
            loadExistingMaterials(isEdit ? preselectedId : null)
        ]).then(function() {
            if (isEdit && preselectedId) {
                fetch('/api/materials/' + preselectedId)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        fillMaterialData(data);
                        title.textContent = 'Редактировать материал';
                    })
                    .catch(function(err) {
                        console.error(err);
                        errorDiv.textContent = 'Ошибка загрузки данных';
                        errorDiv.style.display = 'block';
                    });
            } else {
                title.textContent = 'Добавить материала';
                clearForm();
            }
        });

        existingSelect.addEventListener('change', function() {
            if (this.value) {
                fetch('/api/materials/' + this.value)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        fillMaterialData(data);
                        title.textContent = 'Редактировать материала';
                        document.getElementById('materialName').focus();
                    })
                    .catch(function(err) {
                        console.error(err);
                        errorDiv.textContent = 'Ошибка загрузки материала';
                        errorDiv.style.display = 'block';
                    });
            } else {
                clearForm();
                title.textContent = 'Добавить материала';
                document.getElementById('materialName').focus();
            }
        });

        form.onsubmit = function(e) {
            e.preventDefault();
            var name = document.getElementById('materialName').value.trim();
            if (!name) {
                errorDiv.textContent = 'Введите название';
                errorDiv.style.display = 'block';
                return;
            }

            var materialId = document.getElementById('materialId').value;
            var existingId = document.getElementById('existingMaterialSelect').value;
            if (!materialId && existingId) {
                self._modal.style.display = 'none';
                if (self._cb) self._cb(parseInt(existingId));
                return;
            }

            var body = {
                article: document.getElementById('materialArticle').value.trim() || null,
                name: name,
                manufacturer_id: document.getElementById('materialManufacturer').value || null,
                description: document.getElementById('materialDescription').value.trim() || null,
                unit: document.getElementById('materialUnit').value.trim() || null,
                price: parseFloat(document.getElementById('materialPrice').value) || null,
                manufacturer_url: document.getElementById('materialManufacturerUrl').value.trim() || null,
                ln: document.getElementById('materialLn').value.trim() || null,
                tm: document.getElementById('materialTm').value.trim() || null
            };

            var url = materialId ? '/api/materials/' + materialId : '/api/materials';
            var method = materialId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                body: JSON.stringify(body)
            })
            .then(function(r){
                if (!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); });
                return r.json();
            })
            .then(function(data){
                self._modal.style.display = 'none';
                if (self._cb) self._cb(data.id);
                loadExistingMaterials(data.id);
            })
            .catch(function(err){
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            });
        };
    },

    select: function(callback) {
        this.open(function(id) {
            if (callback) callback(id);
        });
    }
};
</script>
