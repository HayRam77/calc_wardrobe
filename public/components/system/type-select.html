<script>
window.SystemTypeSelect = {
    render: function(container, selectedId, onChange) {
        fetch('/api/system-component-types').then(function(r){return r.json();}).then(function(types){
            var h = '<select class="system-type-select" style="width:100%;"><option value="">-- тип --</option>';
            if (types.length) {
                h += '<optgroup label="Существующие">';
                types.forEach(function(t){ h += '<option value="'+t.id+'"'+(selectedId==t.id?' selected':'')+'>'+t.name+'</option>'; });
                h += '</optgroup>';
            }
            h += '<optgroup label="Добавить"><option value="__new__">+ новый тип</option></optgroup></select>';
            h += '<div class="new-system-type-row" style="display:none;margin-top:5px;display:flex;gap:5px;">';
            h += '<input type="text" class="new-system-type-name" placeholder="Название нового типа" style="flex:1;">';
            h += '<button type="button" class="btn btn-sm btn-primary save-system-type-btn" id="type_select_save_btn">✓</button></div>';
            container.innerHTML = h;
            var sel = container.querySelector('.system-type-select');
            var newRow = container.querySelector('.new-system-type-row');
            var newName = container.querySelector('.new-system-type-name');
            var sv = container.querySelector('.save-system-type-btn');
            if (sel.value === '__new__') newRow.style.display = 'flex';
            sel.addEventListener('change', function(){ newRow.style.display = sel.value === '__new__' ? 'flex' : 'none'; if(onChange)onChange(sel.value); });
            sv.addEventListener('click', function(){
                var n = newName.value.trim(); if (!n) { alert('Введите название'); return; }
                fetch('/api/system-component-types', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
                .then(function(r){return r.json();}).then(function(nt){
                    var opt = document.createElement('option'); opt.value = nt.id; opt.textContent = nt.name;
                    sel.querySelector('optgroup:first-child').appendChild(opt); sel.value = nt.id; newRow.style.display = 'none';
                    if(onChange)onChange(nt.id);
                });
            });
        });
    }
};
</script>
