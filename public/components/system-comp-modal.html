<script>
window.SystemCompModal = {
    _cb: null,

    open: function(compId, callback, cabinetMode, cabinetId) {
        this._cb = callback;
        var self = this;
        var isEdit = !!compId;
        var isCabinetMode = cabinetMode || false;
        var cabinetIdParam = cabinetId || null;

        var m = document.createElement('div');
        m.className = 'modal';
        m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000;';
        m.innerHTML = '<div class="modal-content" style="max-width:95vw;max-height:90vh;overflow-y:auto;"><span class="modal-close">&times;</span><h3>'+(isEdit?'Редактировать':'Добавить')+' компонент систем</h3><form id="sysCompForm"></form></div>';
        document.body.appendChild(m);

        var closeModal = function() { m.remove(); };
        m.querySelector('.modal-close').addEventListener('click', closeModal);
        m.addEventListener('click', function(e){ if(e.target === m) closeModal(); });

        var loadData = [
            fetch('/api/system-parameters?_=' + Date.now()).then(function(r){ return r.json(); }),
            fetch('/api/system-component-types?_=' + Date.now()).then(function(r){ return r.json(); }),
            fetch('/api/system-modules?_=' + Date.now()).then(function(r){ return r.json(); }),
            fetch('/api/system-parameter-types?_=' + Date.now()).then(function(r){ return r.json(); })
        ];
        if (isEdit) {
            loadData.push(fetch('/api/system-components/' + compId + '?_=' + Date.now()).then(function(r){ return r.json(); }));
        }
        if (isCabinetMode && cabinetIdParam) {
            loadData.push(fetch('/api/cabinets/' + cabinetIdParam + '/systems').then(function(r){ return r.json(); }));
        }

        Promise.all(loadData).then(function(results){
            var params = results[0] || [];
            var types = results[1] || [];
            var modules = results[2] || [];
            var paramTypes = results[3] || [];
            var comp = isEdit ? results[4] : null;
            var systems = (isCabinetMode && cabinetIdParam && results.length > 5) ? results[5] : [];

            if (isEdit) {
                fetch('/api/system-components/' + compId + '?_=' + Date.now()).then(function(r){ return r.json(); }).then(function(freshComp) {
                    self._buildForm(m, freshComp, params, types, modules, paramTypes, callback, isCabinetMode, systems, cabinetIdParam);
                });
            } else {
                self._buildForm(m, comp, params, types, modules, paramTypes, callback, isCabinetMode, systems, cabinetIdParam);
            }
        }).catch(function(err){
            console.error('Ошибка загрузки данных:', err);
            alert('Ошибка загрузки данных.');
            closeModal();
        });
    },

    _buildForm: function(m, comp, params, types, modules, paramTypes, callback, isCabinetMode, systems, cabinetId) {
        var self = this;
        var isEdit = !!comp;
        var currentCompId = comp ? comp.id : null;

        var h = '';
        if (isCabinetMode) {
            h += '<div class="form-group" id="cabinetSystemSelectGroup"><label for="cabinetSystemSelect">Система шкафа: <span style="color:red;">*</span></label><select id="cabinetSystemSelect" class="form-control" required><option value="">-- выберите систему --</option>';
            if (systems && systems.length) {
                systems.forEach(function(s) {
                    h += '<option value="' + s.system_id + '">' + self._esc(s.system_name || 'Система #' + s.id) + '</option>';
                });
            }
            h += '</select></div>';
        }

        // ТИП
        h += '<div class="form-group"><label for="compType">Тип: <span style="color:red;">*</span></label><select id="compType" class="form-control" required>';
        h += '<option value="">-- выберите --</option>';
        if (types.length) {
            h += '<optgroup label="Существующие типы">';
            types.forEach(function(t){ h += '<option value="'+t.id+'"'+(comp && comp.type_id == t.id ? ' selected' : '')+'>'+t.name+'</option>'; });
            h += '</optgroup>';
        }
        h += '<optgroup label="Добавить"><option value="__new__">+ новый тип</option></optgroup></select>';
        h += '<div class="new-type-row" style="display:none;margin-top:5px;gap:5px;"><input type="text" class="new-type-name form-control" placeholder="Название нового типа" style="flex:1;"><button type="button" class="btn btn-sm btn-primary save-type-btn">&#10003;</button></div></div>';

        // МОДУЛЬ СИСТЕМЫ
        h += '<div class="form-group"><label for="compModule">Модуль системы:</label><select id="compModule" class="form-control" style="width:100%;"><option value="">-- без модуля --</option>';
        if (modules && modules.length) {
            modules.forEach(function(mod){
                var selected = (comp && comp.module_id == mod.id) ? ' selected' : '';
                h += '<option value="'+mod.id+'"'+selected+'>'+self._esc(mod.name)+'</option>';
            });
        }
        h += '<optgroup label="Добавить"><option value="__new__">+ новый модуль</option></optgroup></select>';
        h += '<div class="new-module-row" style="display:none;margin-top:5px;gap:5px;flex-wrap:wrap;">';
        h += '<input type="text" class="new-module-name form-control" placeholder="Название модуля" style="flex:1;min-width:150px;">';
        h += '<input type="text" class="new-module-description form-control" placeholder="Описание" style="flex:1;min-width:150px;">';
        h += '<button type="button" class="btn btn-sm btn-primary save-module-btn">&#10003;</button></div></div>';

        // Поля
        h += '<div class="form-group"><label for="compName">Название: <span style="color:red;">*</span></label><input type="text" id="compName" class="form-control" value="'+self._esc(comp ? comp.name : '')+'" required></div>';
        h += '<div class="form-group"><label for="compManufacturer">Производитель:</label><select id="compManufacturer" class="form-control"></select></div>';
        h += '<div class="form-group"><label for="compArticle">Артикул:</label><input type="text" id="compArticle" class="form-control" value="'+self._esc(comp ? comp.article || '' : '')+'"></div>';
        h += '<div class="form-group"><label for="compDescription">Описание:</label><textarea id="compDescription" class="form-control" rows="3">'+self._esc(comp ? comp.description || '' : '')+'</textarea></div>';
        h += '<div class="form-row" style="display:flex;gap:10px;"><div class="form-group" style="flex:1;"><label for="compLn">LN</label><input type="text" id="compLn" class="form-control" value="'+self._esc(comp ? comp.ln || '' : '')+'"></div><div class="form-group" style="flex:1;"><label for="compTm">TM</label><input type="text" id="compTm" class="form-control" value="'+self._esc(comp ? comp.tm || '' : '')+'"></div></div>';
        h += '<div class="form-group"><label>Параметры:</label><div id="modalParams"></div><button type="button" id="addParamRowBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить параметр</button></div>';

        h += '<div class="form-group"><label>Компоненты шкафа:</label><div id="linkedBlocks"><p>'+(isEdit?'Загрузка...':'Нет связанных компонентов')+'</p></div><button type="button" id="addBlockLinkBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить компонент шкафа</button></div>';
        h += '<div class="form-group"><label>Материалы компонента:</label><div id="componentMaterials"><p>'+(isEdit?'Загрузка...':'Нет материалов')+'</p></div><button type="button" id="addMaterialLinkBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить материал</button></div>';

        h += '<div class="form-group" style="margin-top:15px;"><label>Группы материалов компонента:</label><div id="componentMaterialGroups"><p>'+(isEdit?'Загрузка...':'Нет групп материалов')+'</p></div><button type="button" id="addMaterialGroupLinkBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить группу материалов</button></div>';

        h += '<div class="form-actions" style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn btn-secondary cancel-comp-btn">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';

        m.querySelector('#sysCompForm').innerHTML = h;

        m.querySelector('.cancel-comp-btn').onclick = function() { m.remove(); };

        // Модуль
        var moduleSelect = m.querySelector('#compModule');
        var newModuleRow = m.querySelector('.new-module-row');
        if (moduleSelect) {
            moduleSelect.addEventListener('change', function() {
                newModuleRow.style.display = this.value === '__new__' ? 'flex' : 'none';
            });
        }
        var saveModuleBtn = m.querySelector('.save-module-btn');
        if (saveModuleBtn) {
            saveModuleBtn.addEventListener('click', function() {
                var name = m.querySelector('.new-module-name').value.trim();
                if (!name) { alert('Введите название модуля'); return; }
                var desc = m.querySelector('.new-module-description').value.trim();
                fetch('/api/system-modules', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, description: desc })
                })
                .then(function(r){ return r.json(); })
                .then(function(nm){
                    moduleSelect.innerHTML += '<option value="'+nm.id+'" selected>'+nm.name+'</option>';
                    moduleSelect.value = nm.id;
                    newModuleRow.style.display = 'none';
                });
            });
        }

        // Производители
        fetch('/api/manufacturers').then(function(r){ return r.json(); }).then(function(mans){
            var sel = m.querySelector('#compManufacturer');
            sel.innerHTML = '<option value="">-- выберите --</option>';
            mans.forEach(function(man){
                var selected = (comp && comp.manufacturer_id == man.id) ? ' selected' : '';
                sel.innerHTML += '<option value="'+man.id+'"'+selected+'>'+man.name+'</option>';
            });
        });

        // Тип
        var ts = m.querySelector('#compType');
        var newTypeRow = m.querySelector('.new-type-row');
        ts.addEventListener('change', function(){ newTypeRow.style.display = ts.value === '__new__' ? 'flex' : 'none'; });
        m.querySelector('.save-type-btn').addEventListener('click', function(){
            var n = m.querySelector('.new-type-name').value.trim();
            if (!n) { alert('Введите название'); return; }
            fetch('/api/system-component-types', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:n})})
            .then(function(r){ return r.json(); })
            .then(function(nt){ ts.innerHTML += '<option value="'+nt.id+'" selected>'+nt.name+'</option>'; ts.value = nt.id; newTypeRow.style.display = 'none'; });
        });

        // Параметры
        var pc = m.querySelector('#modalParams');
        function addParamRow(pId, val, typeVal) {
            var row = document.createElement('div');
            row.className = 'param-row';
            row.style.cssText = 'display:flex;gap:10px;margin-bottom:5px;';
            var s = document.createElement('select');
            s.className = 'param-select form-control';
            s.style.flex = '1';
            s.innerHTML = '<option value="">-- параметр --</option>';
            if (params.length) {
                s.innerHTML += '<optgroup label="Существующие параметры">';
                params.forEach(function(p){
                    var selected = (pId == p.id) ? ' selected' : '';
                    s.innerHTML += '<option value="'+p.id+'"'+selected+'>'+p.name+'</option>';
                });
                s.innerHTML += '</optgroup>';
            }
            s.innerHTML += '<optgroup label="Добавить"><option value="__new__">+ новый параметр</option></optgroup>';
            var vi = document.createElement('input');
            vi.type = 'text'; vi.className = 'param-value form-control'; vi.placeholder = 'Значение'; vi.style.flex = '1';
            if (val) vi.value = val;

            var ti = document.createElement('select');
            ti.className = 'param-type form-control'; ti.style.flex = '0.7';
            ti.innerHTML = '<option value="">-- тип --</option>';
            if (paramTypes && paramTypes.length) {
                paramTypes.forEach(function(pt){
                    var sel = (typeVal && pt.name === typeVal) ? ' selected' : '';
                    ti.innerHTML += '<option value="' + pt.name + '"' + sel + '>' + pt.name + '</option>';
                });
            }

            var dl = document.createElement('button');
            dl.type = 'button'; dl.textContent = '×'; dl.className = 'btn btn-sm btn-delete';
            dl.addEventListener('click', function(){ row.remove(); });

            row.appendChild(s); row.appendChild(vi); row.appendChild(ti); row.appendChild(dl);
            pc.appendChild(row);
        }

        if (comp && comp.params && comp.params.length) {
            comp.params.forEach(function(p){ addParamRow(p.parameter_id || p.id, p.value, p.type); });
        } else {
            addParamRow(null, null, null);
        }
        m.querySelector('#addParamRowBtn').addEventListener('click', function(){ addParamRow(null, null, null); });

        // Загрузка списков связанных блоков и материалов БЕЗ location.reload()
        function refreshLinkedBlocks() {
            var lc = m.querySelector('#linkedBlocks');
            if (!currentCompId) return;
            fetch('/api/system-components/' + currentCompId + '/blocks?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(data){
                    if (!data.length) {
                        lc.innerHTML = '<p>Нет связанных компонентов</p>';
                    } else {
                        var h2 = '<table class="data-table"><thead><tr><th>Тип</th><th>Название</th><th>Артикул</th><th>LN</th><th>TM</th><th>Кол-во</th><th></th></tr></thead><tbody>';
                        data.forEach(function(l){
                            var isInherited = l.inherited === true;
                            h2 += '<tr style="'+(isInherited ? 'opacity:0.7;background:#f9f9f9;' : '')+'">' +
                                '<td>'+self._esc(l.type_name||'')+'</td>' +
                                '<td>'+self._esc(l.name)+'</td>' +
                                '<td>'+self._esc(l.article||'')+'</td>' +
                                '<td>'+self._esc(l.ln||'')+'</td>' +
                                '<td>'+self._esc(l.tm||'')+'</td>' +
                                '<td>'+l.quantity+'</td>' +
                                '<td>' +
                                    '<button type="button" class="btn btn-sm btn-edit edit-block-btn" data-template-id="'+l.block_template_id+'">✏️</button> ' +
                                    (isInherited ? '<span style="font-size:10px;color:#888;">тип</span>' : '<button type="button" class="btn btn-sm btn-delete del-block-btn" data-link-id="'+l.id+'">×</button>') +
                                '</td>' +
                            '</tr>';
                        });
                        h2 += '</tbody></table>';
                        lc.innerHTML = h2;

                        lc.querySelectorAll('.edit-block-btn').forEach(function(btn){
                            btn.onclick = function(){
                                if (typeof BlockTemplateModal !== 'undefined') {
                                    BlockTemplateModal.open(function(){ refreshLinkedBlocks(); }, parseInt(btn.dataset.templateId));
                                }
                            };
                        });
                        lc.querySelectorAll('.del-block-btn').forEach(function(btn){
                            btn.onclick = function(){
                                fetch('/api/system-components/' + currentCompId + '/blocks/' + btn.dataset.linkId, { method: 'DELETE' })
                                    .then(function(){ refreshLinkedBlocks(); });
                            };
                        });
                    }
                });
        }

        function refreshComponentMaterials() {
            var mc = m.querySelector('#componentMaterials');
            if (!currentCompId) return;
            fetch('/api/materials/system-component/' + currentCompId + '?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(data){
                    if (!data.length) {
                        mc.innerHTML = '<p>Нет материалов</p>';
                    } else {
                        var h3 = '<table class="data-table"><thead><tr><th>Артикул</th><th>Название</th><th>Ед.изм.</th><th>LN</th><th>TM</th><th>Кол-во</th><th></th></tr></thead><tbody>';
                        data.forEach(function(item){
                            var isInherited = item.inherited === true;
                            h3 += '<tr style="'+(isInherited ? 'opacity:0.7;background:#f9f9f9;' : '')+'">' +
                                '<td>'+self._esc(item.article||'')+'</td>' +
                                '<td>'+self._esc(item.name)+'</td>' +
                                '<td>'+self._esc(item.unit||'')+'</td>' +
                                '<td>'+self._esc(item.ln||'')+'</td>' +
                                '<td>'+self._esc(item.tm||'')+'</td>' +
                                '<td>'+item.quantity+'</td>' +
                                '<td>' +
                                    '<button type="button" class="btn btn-sm btn-edit edit-mat-btn" data-mat-id="'+item.material_id+'">✏️</button> ' +
                                    (isInherited ? '<span style="font-size:10px;color:#888;">тип</span>' : '<button type="button" class="btn btn-sm btn-delete del-mat-btn" data-mat-id="'+item.material_id+'">×</button>') +
                                '</td>' +
                            '</tr>';
                        });
                        h3 += '</tbody></table>';
                        mc.innerHTML = h3;

                        mc.querySelectorAll('.edit-mat-btn').forEach(function(btn){
                            btn.onclick = function(){
                                if (typeof MaterialModal !== 'undefined') {
                                    MaterialModal.open(function(){ refreshComponentMaterials(); }, parseInt(btn.dataset.matId));
                                }
                            };
                        });
                        mc.querySelectorAll('.del-mat-btn').forEach(function(btn){
                            btn.onclick = function(){
                                fetch('/api/materials/system-component/' + currentCompId + '/' + btn.dataset.matId, { method: 'DELETE' })
                                    .then(function(){ refreshComponentMaterials(); });
                            };
                        });
                    }
                });
        }

        function refreshComponentMaterialGroups() {
            var mgc = m.querySelector('#componentMaterialGroups');
            if (!currentCompId) return;
            fetch('/api/system-components/' + currentCompId + '/material-groups?_=' + Date.now())
                .then(function(r){ return r.json(); })
                .then(function(groups){
                    if (!groups || !groups.length) {
                        mgc.innerHTML = '<p style="color:#888;">Нет групп материалов</p>';
                    } else {
                        var html = '';
                        groups.forEach(function(g){
                            var isInherited = g.inherited === true;
                            html += '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:8px;background:'+(isInherited ? '#f8fafc;opacity:0.85;' : '#fff;')+'">';
                            html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">';
                            html += '<strong>📦 ' + self._esc(g.group_name || 'Группа') + (isInherited ? ' <span style="font-size:11px;color:#64748b;font-weight:normal;">(из типа)</span>' : '') + '</strong>';
                            if (!isInherited) {
                                html += '<button type="button" class="btn btn-sm btn-delete unbind-sys-group-btn" data-link-id="' + g.link_id + '">✕</button>';
                            }
                            html += '</div>';
                            if (g.items && g.items.length) {
                                html += '<table class="data-table" style="width:100%;font-size:12px;">';
                                html += '<thead><tr><th>Материал</th><th>Артикул</th><th>Кол-во</th><th>Ед.</th></tr></thead><tbody>';
                                g.items.forEach(function(it){
                                    html += '<tr><td>' + self._esc(it.name || '') + '</td><td>' + self._esc(it.article || '-') + '</td><td>' + (it.quantity || 1) + '</td><td>' + self._esc(it.unit || '') + '</td></tr>';
                                });
                                html += '</tbody></table>';
                            } else {
                                html += '<div style="font-size:12px;color:#94a3b8;">Группа пуста</div>';
                            }
                            html += '</div>';
                        });
                        mgc.innerHTML = html;

                        mgc.querySelectorAll('.unbind-sys-group-btn').forEach(function(btn){
                            btn.addEventListener('click', function(){
                                fetch('/api/system-components/' + currentCompId + '/material-groups/' + btn.dataset.linkId, { method: 'DELETE' })
                                    .then(function(){ refreshComponentMaterialGroups(); });
                            });
                        });
                    }
                });
        }

        if (isEdit) {
            refreshLinkedBlocks();
            refreshComponentMaterials();
            refreshComponentMaterialGroups();
        }

        m.querySelector('#addBlockLinkBtn').addEventListener('click', function(){
            if (!currentCompId) { alert('Сначала сохраните компонент'); return; }
            if (typeof BlockTemplateModal !== 'undefined') {
                BlockTemplateModal.open(function(blockId){
                    if (blockId) {
                        var qty = prompt('Количество:', '1');
                        if (qty && !isNaN(qty) && parseInt(qty) > 0) {
                            fetch('/api/system-components/' + currentCompId + '/blocks', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ block_template_id: blockId, quantity: parseInt(qty) })
                            }).then(function(){ refreshLinkedBlocks(); });
                        }
                    }
                });
            }
        });

        m.querySelector('#addMaterialLinkBtn').addEventListener('click', function(){
            if (!currentCompId) { alert('Сначала сохраните компонент'); return; }
            if (typeof MaterialModal !== 'undefined') {
                MaterialModal.select(function(materialId){
                    if (materialId) {
                        var qty = prompt('Количество:', '1');
                        if (qty && !isNaN(qty) && parseInt(qty) > 0) {
                            fetch('/api/materials/system-component/' + currentCompId, {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ material_id: materialId, quantity: parseInt(qty) })
                            }).then(function(){ refreshComponentMaterials(); });
                        }
                    }
                });
            }
        });

        m.querySelector('#addMaterialGroupLinkBtn').addEventListener('click', function(){
            if (!currentCompId) { alert('Сначала сохраните компонент'); return; }
            fetch('/api/material-groups')
                .then(function(r){ return r.json(); })
                .then(function(groups){
                    if (!groups || !groups.length) {
                        alert('В системе нет созданных групп материалов');
                        return;
                    }
                    var bindModal = document.createElement('div');
                    bindModal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:7000;';
                    var popHtml = '<div style="background:#fff;padding:20px;border-radius:8px;width:350px;">';
                    popHtml += '<h4 style="margin-top:0;">Выберите группу материалов</h4>';
                    popHtml += '<select id="selectSysGroupToBind" class="form-control" style="width:100%;margin-bottom:15px;">';
                    groups.forEach(function(g) {
                        popHtml += '<option value="' + g.id + '">' + self._esc(g.name) + '</option>';
                    });
                    popHtml += '</select>';
                    popHtml += '<div style="display:flex;justify-content:flex-end;gap:10px;">';
                    popHtml += '<button type="button" class="btn btn-secondary cancel-bind-btn">Отмена</button>';
                    popHtml += '<button type="button" class="btn btn-primary confirm-bind-btn">Привязать</button>';
                    popHtml += '</div></div>';
                    bindModal.innerHTML = popHtml;
                    document.body.appendChild(bindModal);

                    bindModal.querySelector('.cancel-bind-btn').onclick = function() { bindModal.remove(); };
                    bindModal.querySelector('.confirm-bind-btn').onclick = function() {
                        var groupId = bindModal.querySelector('#selectSysGroupToBind').value;
                        if (groupId) {
                            fetch('/api/system-components/' + currentCompId + '/material-groups', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ group_id: groupId })
                            }).then(function(){
                                bindModal.remove();
                                refreshComponentMaterialGroups();
                            });
                        }
                    };
                });
        });

        // Сохранение
        m.querySelector('#sysCompForm').addEventListener('submit', function(e){
            e.preventDefault();
            var name = m.querySelector('#compName').value.trim();
            var type_id = m.querySelector('#compType').value;
            if (!name || !type_id || type_id === '__new__') { alert('Заполните обязательные поля'); return; }

            var paramsArr = [];
            pc.querySelectorAll('.param-row').forEach(function(row){
                var s = row.querySelector('.param-select');
                var v = row.querySelector('.param-value');
                var t = row.querySelector('.param-type');
                if (s.value && s.value !== '__new__') {
                    paramsArr.push({ parameter_id: parseInt(s.value), value: v.value, type: t.value });
                }
            });

            var body = {
                ln: m.querySelector('#compLn')?.value.trim() || null,
                tm: m.querySelector('#compTm')?.value.trim() || null,
                name: name,
                type_id: type_id,
                module_id: m.querySelector('#compModule').value || null,
                manufacturer_id: m.querySelector('#compManufacturer').value || null,
                article: m.querySelector('#compArticle').value.trim() || null,
                description: m.querySelector('#compDescription').value.trim() || null,
                params: paramsArr
            };

            var url = isEdit ? '/api/system-components/' + comp.id : '/api/system-components';

            fetch(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(r){
                if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
                return r.json();
            })
            .then(function(data){
                m.remove();
                if (callback) callback(data.id || data);
            })
            .catch(function(err){ alert(err.message); });
        });
    },

    _esc: function(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }
};
</script>
