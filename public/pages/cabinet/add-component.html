<div style="background:white; border-radius:8px; width:500px; max-height:80vh; overflow-y:auto; padding:20px; position:relative; margin:auto;">
  <span onclick="history.back()" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; color:#888;">&times;</span>
  <h3 style="margin-top:0;">Новый компонент</h3>
  <div class="form-group"><label>Тип</label><select id="blockType"></select></div>
  <div class="form-group"><label>Название</label><input type="text" id="blockNameInput"></div>
  <div class="form-group"><label>Производитель</label><select id="blockManufacturer"></select></div>
  <div class="form-group"><label>Артикул</label><input type="text" id="blockArticle"></div>
  <div class="form-group"><label>Количество</label><input type="number" id="blockQuantity" value="1" min="1"></div>
  <div class="form-group"><label>Описание</label><input type="text" id="blockDescription"></div>
  <div class="form-group"><label>Цена, руб.</label><input type="number" id="blockPrice" step="0.01"></div>
  <div class="form-group"><label>Трудозатраты, мин.</label><input type="number" id="blockLabor" step="1"></div>
  <button id="saveNewBlockBtn">Добавить</button>
  <button onclick="history.back()" style="background:#888; margin-left:10px;">Отмена</button>
  <div id="blockError" style="color:red; margin-top:5px;"></div>
</div>
<script>
(async function() {
  const parts = location.pathname.split('/');
  const cabinetId = parts[2];
  const token = localStorage.getItem('token');
  let projectId;
  try {
    const cabRes = await fetch('/api/cabinets/' + cabinetId, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!cabRes.ok) throw new Error('Ошибка');
    projectId = (await cabRes.json()).project_id;
  } catch(e) { return; }

  function populateSelects() {
    const ts = document.getElementById('blockType');
    ts.innerHTML = '<option value="">--</option>';
    if (typeof componentTypes !== 'undefined') componentTypes.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; ts.appendChild(o); });
    const ms = document.getElementById('blockManufacturer');
    ms.innerHTML = '<option value="">--</option>';
    if (typeof manufacturers !== 'undefined') manufacturers.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; ms.appendChild(o); });
  }
  populateSelects();

  document.getElementById('saveNewBlockBtn').addEventListener('click', async () => {
    const blockName = document.getElementById('blockNameInput').value.trim();
    const errDiv = document.getElementById('blockError');
    errDiv.textContent = '';
    if (!blockName) { errDiv.textContent = 'Введите название'; return; }
    const body = {
      block_name: blockName,
      cabinet_id: cabinetId,
      template_id: null,
      order_index: 0,
      quantity: parseInt(document.getElementById('blockQuantity').value) || 1
    };
    const typeId = document.getElementById('blockType').value;
    const manId = document.getElementById('blockManufacturer').value;
    const article = document.getElementById('blockArticle').value.trim();
    const desc = document.getElementById('blockDescription').value.trim();
    const price = parseFloat(document.getElementById('blockPrice').value) || null;
    const labor = parseInt(document.getElementById('blockLabor').value) || null;

    try {
      const tmplRes = await fetch('/api/block-templates', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: blockName, type_id: typeId || null, manufacturer_id: manId || null, article, description: desc, price, labor })
      });
      if (tmplRes.ok) {
        const newTmpl = await tmplRes.json();
        body.template_id = newTmpl.id;
      } else {
        const existing = templates.find(t => t.name === blockName);
        if (existing) body.template_id = existing.id;
      }
    } catch(e) {}

    try {
      const blockRes = await fetch('/api/projects/' + projectId + '/blocks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(body)
      });
      if (!blockRes.ok) { const err = await blockRes.json(); errDiv.textContent = err.error || 'Ошибка'; return; }
      history.back();
    } catch(e) { errDiv.textContent = 'Ошибка соединения'; }
  });
})();
</script>
