<div style="background:white; border-radius:8px; width:90%; max-width:1200px; max-height:80vh; display:flex; flex-direction:column; position:relative; margin:auto;">
  <span onclick="history.back()" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; color:#888; z-index:3;">&times;</span>
  <div style="padding:20px 20px 10px 20px; border-bottom:1px solid #eee;">
    <h3 style="margin:0 0 10px 0;">Выберите компонент</h3>
    <input type="text" id="searchInput" placeholder="Поиск..." style="width:100%; padding:8px; box-sizing:border-box;">
  </div>
  <div style="overflow-y:auto; padding:0 20px 20px 20px;" id="templateListContent">Загрузка...</div>
</div>
<script>
(async function() {
  const parts = location.pathname.split('/');
  const cabinetId = parts[2];
  const token = localStorage.getItem('token');
  let projectId;
  try {
    const cabRes = await fetch('/api/cabinets/' + cabinetId, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!cabRes.ok) throw new Error('Ошибка загрузки шкафа');
    const cabData = await cabRes.json();
    projectId = cabData.project_id;
  } catch(e) { document.getElementById('templateListContent').innerHTML = '<p style="color:red;">Ошибка загрузки шкафа</p>'; return; }

  if (typeof templates === 'undefined' || templates.length === 0) {
    document.getElementById('templateListContent').innerHTML = '<p>Нет доступных компонентов</p>';
    return;
  }
  const paramNamesSet = new Set();
  templates.forEach(t => { if (t.parameters && t.parameters.length > 0) t.parameters.forEach(p => paramNamesSet.add(p.param_name)); });
  const paramNames = Array.from(paramNamesSet).sort();

  function renderTable(filter = '') {
    const lower = filter.toLowerCase();
    const filtered = templates.filter(t => {
      if (!lower) return true;
      const inName = (t.name || '').toLowerCase().includes(lower);
      const inArticle = (t.article || '').toLowerCase().includes(lower);
      const inManufacturer = (t.manufacturer_name || '').toLowerCase().includes(lower);
      let inParams = false;
      if (t.parameters) inParams = t.parameters.some(p => p.param_name.toLowerCase().includes(lower) || p.param_value.toLowerCase().includes(lower));
      return inName || inArticle || inManufacturer || inParams;
    });
    if (filtered.length === 0) { document.getElementById('templateListContent').innerHTML = '<p>Ничего не найдено</p>'; return; }

    let html = '<table style="width:100%; border-collapse:collapse;"><thead><tr><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th>';
    paramNames.forEach(n => html += `<th>${n}</th>`);
    html += '<th>Описание</th></tr></thead><tbody>';
    filtered.forEach(t => {
      html += `<tr class="clickable" data-id="${t.id}" style="cursor:pointer;">`;
      html += `<td>${t.type_name || ''}</td><td><strong>${t.name}</strong></td><td>${t.manufacturer_name || ''}</td><td>${t.article || ''}</td>`;
      paramNames.forEach(pName => {
        const param = t.parameters ? t.parameters.find(p => p.param_name === pName) : null;
        html += `<td>${param ? param.param_value : ''}</td>`;
      });
      html += `<td>${t.description || ''}</td></tr>`;
    });
    html += '</tbody></table>';
    document.getElementById('templateListContent').innerHTML = html;

    document.querySelectorAll('tr.clickable').forEach(row => {
      row.addEventListener('click', async () => {
        const id = row.dataset.id;
        try {
          const res = await fetch('/api/projects/' + projectId + '/blocks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ block_name: templates.find(t => t.id == id).name, cabinet_id: cabinetId, template_id: id, order_index: 0, quantity: 1 })
          });
          if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
          history.back();
        } catch(e) { alert('Ошибка соединения'); }
      });
    });
  }
  renderTable('');
  document.getElementById('searchInput').addEventListener('input', e => renderTable(e.target.value));
})();
</script>
