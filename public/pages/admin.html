<div class="page-content">
    <div class="page-header">
        <h2>Администрирование</h2>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="projects">Все проекты</button>
        <button class="tab-btn" data-tab="cabinets">Все шкафы</button>
        <button class="tab-btn" data-tab="users">Управление пользователями</button>
    </div>

    <div class="tab-content active" id="tab-projects">
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Владелец</th>
                        <th>Описание</th>
                        <th>Дата создания</th>
                    </tr>
                </thead>
                <tbody id="allProjectsBody"><tr><td colspan="5">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="tab-content" id="tab-cabinets">
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название шкафа</th>
                        <th>Проект</th>
                        <th>Владелец</th>
                        <th>Дата создания</th>
                    </tr>
                </thead>
                <tbody id="allCabinetsBody"><tr><td colspan="5">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="tab-content" id="tab-users">
        <div style="margin-bottom:10px;">
            <button id="addUserBtn" class="btn btn-primary">Добавить пользователя</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя пользователя</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Дата регистрации</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody"><tr><td colspan="6">Загрузка...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Модальное окно добавления пользователя -->
<div id="userModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close">&times;</span>
        <h3 id="userModalTitle">Добавить пользователя</h3>
        <form id="userForm">
            <input type="hidden" id="userId">
            <div class="form-group">
                <label for="userUsername">Имя пользователя *</label>
                <input type="text" id="userUsername" required maxlength="50">
            </div>
            <div class="form-group">
                <label for="userEmail">Email *</label>
                <input type="email" id="userEmail" required maxlength="100">
            </div>
            <div class="form-group">
                <label for="userPassword">Пароль *</label>
                <input type="password" id="userPassword" required minlength="6">
            </div>
            <div class="form-group">
                <label for="userRole">Роль</label>
                <select id="userRole">
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            <div id="userError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;">
                <button type="button" id="userCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var token = localStorage.getItem('token');

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // Вкладки
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // Загрузка проектов
    async function loadAllProjects() {
        var tbody = document.getElementById('allProjectsBody');
        try {
            var res = await fetch('/api/projects?all=true', { headers: { 'Authorization': 'Bearer ' + token } });
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет проектов</td></tr>'; return; }
            var html = '';
            data.forEach(function(p) {
                html += '<tr><td>' + p.id + '</td><td>' + escapeHtml(p.name) + '</td><td>' + escapeHtml(p.owner_name || '') + '</td><td>' + escapeHtml(p.description || '') + '</td><td>' + new Date(p.created_at).toLocaleDateString('ru-RU') + '</td></tr>';
            });
            tbody.innerHTML = html;
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5">Ошибка загрузки</td></tr>'; }
    }

    // Загрузка шкафов
    async function loadAllCabinets() {
        var tbody = document.getElementById('allCabinetsBody');
        try {
            var res = await fetch('/api/cabinets', { headers: { 'Authorization': 'Bearer ' + token } });
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет шкафов</td></tr>'; return; }
            var html = '';
            data.forEach(function(c) {
                html += '<tr><td>' + c.id + '</td><td>' + escapeHtml(c.name) + '</td><td>' + escapeHtml(c.project_name || '') + '</td><td>' + escapeHtml(c.owner_name || '') + '</td><td>' + new Date(c.created_at).toLocaleDateString('ru-RU') + '</td></tr>';
            });
            tbody.innerHTML = html;
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5">Ошибка загрузки</td></tr>'; }
    }

    // Загрузка пользователей
    async function loadUsers() {
        var tbody = document.getElementById('usersTableBody');
        try {
            var res = await fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } });
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="6">Нет пользователей</td></tr>'; return; }
            var html = '';
            data.forEach(function(u) {
                html += '<tr>';
                html += '<td>' + u.id + '</td>';
                html += '<td>' + escapeHtml(u.username) + '</td>';
                html += '<td>' + escapeHtml(u.email) + '</td>';
                html += '<td>' + (u.role === 'admin' ? 'Админ' : 'Пользователь') + '</td>';
                html += '<td>' + new Date(u.created_at).toLocaleDateString('ru-RU') + '</td>';
                html += '<td>';
                html += '<button class="btn btn-sm btn-delete delete-user-btn" data-id="' + u.id + '">🗑️</button>';
                html += '</td>';
                html += '</tr>';
            });
            tbody.innerHTML = html;

            tbody.querySelectorAll('.delete-user-btn').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    if (!confirm('Удалить пользователя?')) return;
                    await fetch('/api/admin/users/' + this.dataset.id, {
                        method: 'DELETE',
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    loadUsers();
                });
            });
        } catch(e) { tbody.innerHTML = '<tr><td colspan="6">Ошибка загрузки</td></tr>'; }
    }

    // Модальное окно пользователя
    var userModal = document.getElementById('userModal');
    var userForm = document.getElementById('userForm');
    var userError = document.getElementById('userError');

    function closeUserModal() { userModal.classList.remove('active'); }
    document.querySelector('#userModal .modal-close').addEventListener('click', closeUserModal);
    document.getElementById('userCancelBtn').addEventListener('click', closeUserModal);
    userModal.addEventListener('click', function(e) { if (e.target === userModal) closeUserModal(); });

    document.getElementById('addUserBtn').addEventListener('click', function() {
        userForm.reset();
        document.getElementById('userId').value = '';
        document.getElementById('userModalTitle').textContent = 'Добавить пользователя';
        userError.style.display = 'none';
        userModal.classList.add('active');
    });

    userForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        userError.style.display = 'none';

        var username = document.getElementById('userUsername').value.trim();
        var email = document.getElementById('userEmail').value.trim();
        var password = document.getElementById('userPassword').value;
        var role = document.getElementById('userRole').value;

        if (!username || !email || !password) {
            userError.textContent = 'Все поля обязательны';
            userError.style.display = 'block';
            return;
        }

        try {
            var res = await fetch('/api/admin/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ username: username, email: email, password: password, role: role })
            });
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            closeUserModal();
            loadUsers();
        } catch(err) {
            userError.textContent = err.message;
            userError.style.display = 'block';
        }
    });

    loadAllProjects();
    loadAllCabinets();
    loadUsers();
})();
</script>
