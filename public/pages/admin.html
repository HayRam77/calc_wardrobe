<div class="page-content">
    <div class="page-header"><h2>Администрирование</h2></div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="projects" id="admin_btn_btn">Все проекты</button>
        <button class="tab-btn" data-tab="cabinets" id="admin_btn_btn_1">Все шкафы</button>
        <button class="tab-btn" data-tab="users" id="admin_btn_btn_2">Управление пользователями</button>
        <button class="tab-btn" data-tab="db" id="admin_btn_btn_3">База данных</button>
    </div>
    <div class="tab-content active" id="tab-projects">
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Владелец</th><th>Описание</th><th>Дата создания</th></tr></thead><tbody id="allProjectsBody"><tr><td colspan="5">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-cabinets">
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название шкафа</th><th>Проект</th><th>Владелец</th><th>Дата создания</th></tr></thead><tbody id="allCabinetsBody"><tr><td colspan="5">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-users">
        <div style="margin-bottom:10px;"><button id="addUserBtn" class="btn btn-primary">Добавить пользователя</button></div>
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Имя пользователя</th><th>Email</th><th>Роль</th><th>Дата регистрации</th><th>Действия</th></tr></thead><tbody id="usersTableBody"><tr><td colspan="6">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-db">
        <h3>База данных</h3>
        <div style="margin-top:15px;">
            <button id="exportDbBtn" class="btn btn-secondary">Экспорт дампа БД</button>
            <input type="file" id="importDbFile" style="display:none" accept=".sql">
            <button id="importDbBtn" class="btn btn-secondary">Импорт дампа БД</button>
        </div>
        <div id="dbMessage" style="margin-top:10px;"></div>
    </div>
</div>
<div id="userModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close">&times;</span>
        <h3 id="userModalTitle">Добавить пользователя</h3>
        <form id="userForm">
            <input type="hidden" id="userId">
            <div class="form-group"><label for="userUsername">Имя пользователя *</label><input type="text" id="userUsername" required maxlength="50"></div>
            <div class="form-group"><label for="userEmail">Email *</label><input type="email" id="userEmail" required maxlength="100"></div>
            <div class="form-group"><label for="userPassword">Пароль *</label><input type="password" id="userPassword" required minlength="6"></div>
            <div class="form-group"><label for="userRole">Роль</label><select id="userRole"><option value="user">Пользователь</option><option value="admin">Администратор</option></select></div>
            <div id="userError" class="error-message" style="display:none;"></div>
            <div class="form-actions"><button type="button" id="userCancelBtn" class="btn btn-secondary">Отмена</button><button type="submit" class="btn btn-primary" id="admin_btn_btn_4">Сохранить</button></div>
        </form>
    </div>
</div>
<script>
(function() {
    var token = localStorage.getItem('token');
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    function formatDate(d) { return d ? new Date(d).toLocaleDateString('ru-RU') : ''; }
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });
    async function loadAllProjects() {
        var tbody = document.getElementById('allProjectsBody');
        try {
            var res = await fetch('/api/projects?all=true');
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет проектов</td></tr>'; return; }
            tbody.innerHTML = data.map(function(p) { return '<tr><td>' + p.id + '</td><td>' + esc(p.name) + '</td><td>' + esc(p.owner_name || '') + '</td><td>' + esc(p.description || '') + '</td><td>' + formatDate(p.created_at) + '</td></tr>'; }).join('');
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5">Ошибка загрузки</td></tr>'; }
    }
    async function loadAllCabinets() {
        var tbody = document.getElementById('allCabinetsBody');
        try {
            var res = await fetch('/api/cabinets');
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Нет шкафов</td></tr>'; return; }
            tbody.innerHTML = data.map(function(c) { return '<tr><td>' + c.id + '</td><td>' + esc(c.name) + '</td><td>' + esc(c.project_name || '') + '</td><td>' + esc(c.owner_name || '') + '</td><td>' + formatDate(c.created_at) + '</td></tr>'; }).join('');
        } catch(e) { tbody.innerHTML = '<tr><td colspan="5">Ошибка загрузки</td></tr>'; }
    }
    async function loadUsers() {
        var tbody = document.getElementById('usersTableBody');
        try {
            var res = await fetch('/api/admin/users');
            var data = await res.json();
            if (!data.length) { tbody.innerHTML = '<tr><td colspan="6">Нет пользователей</td></tr>'; return; }
            tbody.innerHTML = data.map(function(u) { return '<tr><td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.email) + '</td><td>' + (u.role === 'admin' ? 'Админ' : 'Пользователь') + '</td><td>' + formatDate(u.created_at) + '</td><td><button class="btn btn-sm btn-delete" data-id="' + u.id + '">🗑️</button></td></tr>'; }).join('');
            tbody.querySelectorAll('.btn-delete').forEach(function(btn) { btn.addEventListener('click', async function() { if (!confirm('Удалить?')) return; await fetch('/api/admin/users/' + this.dataset.id, { method: 'DELETE' }); loadUsers(); }); });
        } catch(e) { tbody.innerHTML = '<tr><td colspan="6">Ошибка загрузки</td></tr>'; }
    }
    var userModal = document.getElementById('userModal'), userForm = document.getElementById('userForm'), userError = document.getElementById('userError');
    document.querySelector('#userModal .modal-close').addEventListener('click', function() { userModal.classList.remove('active'); });
    document.getElementById('userCancelBtn').addEventListener('click', function() { userModal.classList.remove('active'); });
    userModal.addEventListener('click', function(e) { if (e.target === userModal) userModal.classList.remove('active'); });
    document.getElementById('addUserBtn').addEventListener('click', function() { userForm.reset(); document.getElementById('userId').value = ''; document.getElementById('userModalTitle').textContent = 'Добавить пользователя'; userError.style.display = 'none'; userModal.classList.add('active'); });
    userForm.addEventListener('submit', async function(e) {
        e.preventDefault(); userError.style.display = 'none';
        var username = document.getElementById('userUsername').value.trim(), email = document.getElementById('userEmail').value.trim(), password = document.getElementById('userPassword').value, role = document.getElementById('userRole').value;
        if (!username || !email || !password) { userError.textContent = 'Все поля обязательны'; userError.style.display = 'block'; return; }
        try {
            var res = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, email: email, password: password, role: role }) });
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка');
            userModal.classList.remove('active'); loadUsers();
        } catch(err) { userError.textContent = err.message; userError.style.display = 'block'; }
    });
    // База данных
    document.getElementById('exportDbBtn').addEventListener('click', async function() {
        var r = await fetch('/api/admin/db/export');
        if (!r.ok) { document.getElementById('dbMessage').innerHTML = '<p style="color:red;">Ошибка экспорта</p>'; return; }
        var blob = await r.blob();
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'bd_calc_dump.sql'; a.click();
        document.getElementById('dbMessage').innerHTML = '<p style="color:green;">Экспорт завершён</p>';
    });
    document.getElementById('importDbBtn').addEventListener('click', function() { document.getElementById('importDbFile').click(); });
    document.getElementById('importDbFile').addEventListener('change', async function() {
        var fd = new FormData(); fd.append('file', this.files[0]);
        var r = await fetch('/api/admin/db/import', { method: 'POST', body: fd });
        var data = await r.json();
        document.getElementById('dbMessage').innerHTML = '<p style="color:' + (r.ok ? 'green' : 'red') + ';">' + data.message + '</p>';
        this.value = '';
    });
    loadAllProjects(); loadAllCabinets(); loadUsers();
})();
</script>
