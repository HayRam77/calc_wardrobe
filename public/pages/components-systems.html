<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="components">Компоненты систем</button>
        <button class="tab-btn" data-tab="types">Типы компонентов систем</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов систем</button>
        <button class="tab-btn" data-tab="modules">Модули системы</button>
    </div>
    <div id="tab-content-container"></div>
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>
</div>
<script>
(function() {
    var tabContainer = document.getElementById('tab-content-container');
    var currentActiveTab = null;

    function executeScripts(container) {
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.async = false;
            } else {
                newScript.textContent = oldScript.textContent;
            }
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }

    function loadTab(tab) {
        if (!tabContainer) return;
        // деактивируем текущий таб
        var prevActive = tabContainer.querySelector('.tab-content.active');
        if (prevActive) prevActive.classList.remove('active');

        var file = tab === 'components' ? 'components-tab.html' :
                   tab === 'types' ? 'types-tab.html' :
                   tab === 'params' ? 'params-tab.html' :
                   tab === 'modules' ? 'modules-tab.html' : null;
        if (!file) return;

        // Показываем загрузку
        tabContainer.innerHTML = '<p>Загрузка...</p>';

        fetch('/pages/components-systems-tabs/' + file)
            .then(function(r) { return r.text(); })
            .then(function(html) {
                tabContainer.innerHTML = html;
                // выполняем скрипты внутри загруженного HTML
                executeScripts(tabContainer);
                // активируем вкладку
                var tabContent = tabContainer.querySelector('.tab-content');
                if (tabContent) tabContent.classList.add('active');
            })
            .catch(function(err) {
                console.error(err);
                tabContainer.innerHTML = '<p>Ошибка загрузки</p>';
            });
    }

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            var tab = btn.dataset.tab;
            loadTab(tab);
        });
    });

    // модальное окно
    var modal = document.getElementById('modal');
    document.querySelector('.close-modal').addEventListener('click', function() {
        if (modal) modal.style.display = 'none';
    });
    window.addEventListener('click', function(e) {
        if (e.target === modal) modal.style.display = 'none';
    });

    // загрузка первой вкладки
    loadTab('components');
})();
</script>
