<!-- public/pages/components-systems.html -->
<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="components">Компоненты систем</button>
        <button class="tab-btn" data-tab="types">Типы компонентов систем</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов систем</button>
    </div>

    <div class="tab-content active" id="tab-components">
        <div style="margin-bottom:10px;">
            <button id="addComponentBtn" class="btn btn-primary" style="display:none;">Добавить компонент систем</button>
            <button id="exportComponentsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importComponentsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importComponentsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Описание</th><th>Параметры</th><th id="componentsActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="componentsBody"><tr><td colspan="8" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="componentsEmpty" class="empty-state" style="display:none;"><p>Компонентов нет</p></div>
    </div>

    <div class="tab-content" id="tab-types">
        <div style="margin-bottom:10px;">
            <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип компонента систем</button>
            <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="typesActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="typesEmpty" class="empty-state" style="display:none;"><p>Типов нет</p></div>
    </div>

    <div class="tab-content" id="tab-params">
        <div style="margin-bottom:10px;">
            <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр компонента систем</button>
            <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Описание</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="paramsBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="paramsEmpty" class="empty-state" style="display:none;"><p>Параметров нет</p></div>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>
</div>

<script>
var currentUser = JSON.parse(localStorage.getItem('user') || 'null');
var isAdmin = currentUser && currentUser.role === 'admin';

function applyPermissions() {
    var btns = ['addComponentBtn','exportComponentsBtn','importComponentsBtn','addTypeBtn','exportTypesBtn','importTypesBtn','addParamBtn','exportParamsBtn','importParamsBtn'];
    var cols = ['componentsActionsCol','typesActionsCol','paramsActionsCol'];
    btns.forEach(function(id) { var el = document.getElementById(id); if (el) el.style.display = isAdmin ? '' : 'none'; });
    cols.forEach(function(id) { var el = document.getElementById(id); if (el) el.style.display = isAdmin ? '' : 'none'; });
}

function initTabs() {
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            btn.classList.add('active');
            var target = document.getElementById('tab-' + btn.dataset.tab);
            if (target) target.classList.add('active');
            if (btn.dataset.tab === 'types') loadTypes();
            if (btn.dataset.tab === 'params') loadParams();
        });
    });
}

var modal = document.getElementById('modal');
var modalTitle = document.getElementById('modalTitle');
var modalForm = document.getElementById('modalForm');
document.querySelector('.close-modal').addEventListener('click', function() { modal.style.display = 'none'; });
window.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });
function closeModal() { modal.style.display = 'none'; modalForm.innerHTML = ''; }
function showModal(title, html) { modalTitle.textContent = title; modalForm.innerHTML = html; modal.style.display = 'block'; }
function escapeHtml(text) { return String(text).replace(/[&<>"]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

function loadManufacturersForSelect(selector, selectedId, callback) {
    fetch('/api/manufacturers').then(function(res) { return res.json(); }).then(function(data) {
        var sel = document.querySelector(selector);
        if (!sel) return;
        sel.innerHTML = '<option value="">-- выберите --</option>';
        data.forEach(function(m) { var opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.name; sel.appendChild(opt); });
        if (selectedId) sel.value = selectedId;
        if (callback) callback();
    }).catch(function(e) { console.error(e); });
}

function createNewType(name, callback) {
    fetch('/api/system-component-types', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
    .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'Ошибка');});return r.json();})
    .then(function(nt){ if(callback)callback(nt); })
    .catch(function(e){alert('Ошибка создания типа: '+e.message);});
}

function createNewParam(name, value, callback) {
    fetch('/api/system-parameters', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,value:value||''})})
    .then(function(res) { if (!res.ok) return res.json().then(function(d) { throw new Error(d.message||'Ошибка'); }); return res.json(); })
    .then(function(newParam) { if (callback) callback(newParam); })
    .catch(function(err) { alert('Ошибка создания параметра: '+err.message); });
}

function buildParamSelect(selectedId) {
    var html = '';
    if (window._allParams && window._allParams.length > 0) {
        html += '<optgroup label="Существующие параметры">';
        window._allParams.forEach(function(p) { html += '<option value="'+p.id+'"'+(selectedId==p.id?' selected':'')+'>'+escapeHtml(p.name)+'</option>'; });
        html += '</optgroup>';
    }
    html += '<optgroup label="Добавить"><option value="__new__"'+(selectedId?'':' selected')+'>+ новый параметр</option></optgroup>';
    return html;
}

function buildTypeSelect(selectedId) {
    var html = '';
    if (window._allTypes && window._allTypes.length > 0) {
        html += '<optgroup label="Существующие типы">';
        window._allTypes.forEach(function(t) { html += '<option value="'+t.id+'"'+(selectedId==t.id?' selected':'')+'>'+escapeHtml(t.name)+'</option>'; });
        html += '</optgroup>';
    }
    html += '<optgroup label="Добавить"><option value="__new__"'+(selectedId?'':' selected')+'>+ новый тип</option></optgroup>';
    return html;
}

// ==================== КОМПОНЕНТЫ СИСТЕМ ====================
function loadComponents() {
    fetch('/api/system-components').then(function(res) { if (!res.ok) throw new Error('Ошибка'); return res.json(); }).then(function(data) {
        var tbody = document.getElementById('componentsBody');
        var empty = document.getElementById('componentsEmpty');
        if (!data.length) { empty.style.display = ''; tbody.innerHTML = ''; }
        else {
            empty.style.display = 'none';
            tbody.innerHTML = data.map(function(item) {
                var paramsHtml = item.params && item.params.length ? item.params.map(function(p) { return escapeHtml(p.name) + (p.type ? ' ('+escapeHtml(p.type)+')' : '') + ': ' + escapeHtml(p.value); }).join('<br>') : '-';
                return '<tr><td>'+item.id+'</td><td>'+escapeHtml(item.type_name||'')+'</td><td>'+escapeHtml(item.name)+'</td><td>'+escapeHtml(item.manufacturer_name||'')+'</td><td>'+escapeHtml(item.article||'')+'</td><td>'+escapeHtml(item.description||'')+'</td><td>'+paramsHtml+'</td><td class="actions-col" style="display:'+(isAdmin?'':'none')+'"><button class="btn btn-sm btn-edit" onclick="editSystemComponent('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponent('+item.id+')">🗑️</button></td></tr>';
            }).join('');
        }
    }).catch(function() { document.getElementById('componentsBody').innerHTML = '<tr><td colspan="8" class="error">Ошибка загрузки</td></tr>'; });
}

document.getElementById('addComponentBtn').addEventListener('click', function() {
    Promise.all([
        fetch('/api/system-parameters').then(function(r){return r.json();}),
        fetch('/api/system-component-types').then(function(r){return r.ok?r.json():[];})
    ]).then(function(result){
        window._allParams = result[0] || [];
        window._allTypes = result[1] || [];
        openComponentForm(null);
    });
});

function openComponentForm(comp) {
    var isEdit = !!comp;
    var formHtml = '<div class="form-group"><label>Тип: <span style="color:red;">*</span></label><select id="compType" required></select>' +
        '<div class="new-type-row" style="display:none; margin-top:5px; display:flex; gap:5px;">' +
        '<input type="text" class="new-type-name" placeholder="Название нового типа" style="flex:1;">' +
        '<button type="button" class="btn btn-sm btn-primary save-new-type-btn">✓</button></div></div>';
    formHtml += '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="compName" value="'+(comp?escapeHtml(comp.name):'')+'" required></div>';
    formHtml += '<div class="form-group"><label>Производитель:</label><select id="compManufacturer"></select></div>';
    formHtml += '<div class="form-group"><label>Артикул:</label><input type="text" id="compArticle" value="'+(comp?escapeHtml(comp.article||''):'')+'"></div>';
    formHtml += '<div class="form-group"><label>Описание:</label><textarea id="compDescription" rows="3">'+(comp?escapeHtml(comp.description||''):'')+'</textarea></div>';
    formHtml += '<div class="form-group"><label>Параметры:</label><div id="modalParams"></div><button type="button" id="addParamRowBtn" class="btn btn-sm btn-secondary" style="margin-top:5px;">+ добавить параметр</button></div>';
    formHtml += '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>';

    showModal(isEdit?'Редактировать компонент систем':'Добавить компонент систем', formHtml);
    loadManufacturersForSelect('#compManufacturer', comp?comp.manufacturer_id:null);

    // Заполняем select типов
    var ts = document.getElementById('compType');
    ts.innerHTML = buildTypeSelect(comp?comp.type_id:null);
    
    // Обработчик выбора типа
    var newTypeRow = document.querySelector('.new-type-row');
    var newTypeName = document.querySelector('.new-type-name');
    var saveTypeBtn = document.querySelector('.save-new-type-btn');
    
    if (ts.value === '__new__') newTypeRow.style.display = 'flex';
    
    ts.addEventListener('change', function() {
        if (ts.value === '__new__') newTypeRow.style.display = 'flex';
        else newTypeRow.style.display = 'none';
    });
    
    saveTypeBtn.addEventListener('click', function() {
        var name = newTypeName.value.trim();
        if (!name) { alert('Введите название типа'); return; }
        createNewType(name, function(nt) {
            window._allTypes.push(nt);
            ts.innerHTML = buildTypeSelect(nt.id);
            newTypeRow.style.display = 'none';
            loadTypes();
        });
    });

    // Параметры
    function bindRow(row) {
        var s = row.querySelector('.param-select');
        var vi = row.querySelector('.param-value');
        var ni = row.querySelector('.new-param-name');
        var sv = row.querySelector('.save-new-param-btn');
        s.addEventListener('change', function() {
            if (s.value === '__new__') { ni.style.display=''; sv.style.display=''; }
            else { ni.style.display='none'; sv.style.display='none'; }
        });
        row.querySelector('.remove-param-btn').addEventListener('click', function(){row.remove();});
        sv.addEventListener('click', function() {
            var name = ni.value.trim();
            if (!name) { alert('Введите название параметра'); return; }
            createNewParam(name, vi.value.trim(), function(np) {
                window._allParams.push(np);
                s.innerHTML = buildParamSelect(np.id);
                ni.style.display='none'; sv.style.display='none';
                document.querySelectorAll('.param-row select').forEach(function(sel){
                    if (sel!==s) sel.innerHTML = buildParamSelect(sel.value==='__new__'?null:sel.value);
                });
                loadParams();
            });
        });
    }

    var paramsContainer = document.getElementById('modalParams');
    if (comp && comp.params && comp.params.length) {
        comp.params.forEach(function(p) { addParamRowToContainer(p.parameter_id || p.id, p.value, p.type); });
    } else {
        addParamRowToContainer(null, null, null);
    }

    function addParamRowToContainer(paramId, value, typeVal) {
        var row = document.createElement('div'); row.className = 'param-row'; row.style.cssText = 'display:flex;gap:10px;margin-bottom:5px;';
        var s = document.createElement('select'); s.className = 'param-select'; s.style.flex = '1';
        s.innerHTML = buildParamSelect(paramId);
        var vi = document.createElement('input'); vi.type='text'; vi.className='param-value'; vi.placeholder='Значение'; vi.style.flex='1'; if(value) vi.value=value; var ti = document.createElement('input'); ti.type='text'; ti.className='param-type'; ti.placeholder='Тип'; ti.style.flex='0.7'; if(typeVal) ti.value = typeVal;
        var ni = document.createElement('input'); ni.type='text'; ni.className='new-param-name'; ni.placeholder='Название нового параметра'; ni.style.cssText='flex:1;display:none;';
        var sv = document.createElement('button'); sv.type='button'; sv.className='btn btn-sm btn-primary save-new-param-btn'; sv.textContent='✓'; sv.style.display='none';
        var dl = document.createElement('button'); dl.type='button'; dl.className='btn btn-sm btn-delete remove-param-btn'; dl.textContent='×';
        if (s.value === '__new__' || !paramId) { ni.style.display=''; sv.style.display=''; }
        row.appendChild(s); row.appendChild(vi); row.appendChild(ti); row.appendChild(ni); row.appendChild(sv); row.appendChild(dl);
        paramsContainer.appendChild(row);
        bindRow(row);
    }

    document.getElementById('addParamRowBtn').addEventListener('click', function() { addParamRowToContainer(null, null, null); });

    modalForm.onsubmit = function(e) {
        e.preventDefault();
        var name = document.getElementById('compName').value.trim();
        var type_id = document.getElementById('compType').value;
        var manufacturer_id = document.getElementById('compManufacturer').value || null;
        var article = document.getElementById('compArticle').value.trim();
        var description = document.getElementById('compDescription').value.trim();
        if (!name || !type_id || type_id === '__new__') { alert('Заполните обязательные поля'); return; }
        var params = [];
        document.querySelectorAll('#modalParams .param-row').forEach(function(row) {
            var s = row.querySelector('.param-select');
            var vi = row.querySelector('.param-value');
            var ti2 = row.querySelector('.param-type'); if (s.value && s.value !== '__new__') params.push({parameter_id: parseInt(s.value), value: vi.value.trim(), type: ti2 ? ti2.value.trim() : ''});
        });
        var url = isEdit ? '/api/system-components/'+comp.id : '/api/system-components';
        var method = isEdit ? 'PUT' : 'POST';
        fetch(url, {method:method,headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,type_id:type_id,manufacturer_id:manufacturer_id,article:article,description:description,params:params})})
        .then(function(res){ if(!res.ok) return res.json().then(function(d){throw new Error(d.message||'Ошибка');}); closeModal(); loadComponents(); })
        .catch(function(err){ alert(err.message); });
    };
}

window.editSystemComponent = function(id) {
    Promise.all([
        fetch('/api/system-parameters').then(function(r){return r.json();}),
        fetch('/api/system-component-types').then(function(r){return r.ok?r.json():[];}),
        fetch('/api/system-components/'+id).then(function(r){return r.json();})
    ]).then(function(result){
        window._allParams = result[0] || [];
        window._allTypes = result[1] || [];
        openComponentForm(result[2]);
    });
};

window.deleteSystemComponent = function(id) {
    if (!confirm('Удалить?')) return;
    fetch('/api/system-components/'+id,{method:'DELETE'}).then(loadComponents).catch(function(e){alert(e.message);});
};

// ==================== ТИПЫ ====================
function loadTypes() {
    fetch('/api/system-component-types').then(function(r){if(!r.ok)throw new Error('Ошибка');return r.json();}).then(function(data){
        var tbody = document.getElementById('typesBody');
        var empty = document.getElementById('typesEmpty');
        if (!data.length) { empty.style.display=''; tbody.innerHTML=''; }
        else {
            empty.style.display='none';
            tbody.innerHTML = data.map(function(item){return '<tr><td>'+item.id+'</td><td>'+escapeHtml(item.name)+'</td><td>'+escapeHtml(item.description||'')+'</td><td class="actions-col" style="display:'+(isAdmin?'':'none')+'"><button class="btn btn-sm btn-edit" onclick="editSystemComponentType('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponentType('+item.id+')">🗑️</button></td></tr>';}).join('');
        }
    }).catch(function(){document.getElementById('typesBody').innerHTML='<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';});
}

document.getElementById('addTypeBtn').addEventListener('click', function() {
    showModal('Добавить тип компонента систем','<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="typeName" required></div><div class="form-group"><label>Описание:</label><textarea id="typeDescription" rows="3"></textarea></div><div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>');
    modalForm.onsubmit = function(e) {
        e.preventDefault();
        var name = document.getElementById('typeName').value.trim();
        var desc = document.getElementById('typeDescription').value.trim();
        if (!name) { alert('Введите название'); return; }
        fetch('/api/system-component-types',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,description:desc})})
        .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'Ошибка');});closeModal();loadTypes();})
        .catch(function(e){alert(e.message);});
    };
});

window.editSystemComponentType = function(id) {
    fetch('/api/system-component-types/'+id).then(function(r){return r.json();}).then(function(t){
        showModal('Редактировать тип','<div class="form-group"><label>Название:</label><input type="text" id="typeName" value="'+escapeHtml(t.name)+'" required></div><div class="form-group"><label>Описание:</label><textarea id="typeDescription" rows="3">'+escapeHtml(t.description||'')+'</textarea></div><div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>');
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            fetch('/api/system-component-types/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('typeName').value.trim(),description:document.getElementById('typeDescription').value.trim()})})
            .then(function(){closeModal();loadTypes();}).catch(function(e){alert(e.message);});
        };
    });
};

window.deleteSystemComponentType = function(id) {
    if (!confirm('Удалить?')) return;
    fetch('/api/system-component-types/'+id,{method:'DELETE'}).then(loadTypes).catch(function(e){alert(e.message);});
};

// ==================== ПАРАМЕТРЫ ====================
function loadParams() {
    fetch('/api/system-parameters').then(function(r){if(!r.ok)throw new Error('Ошибка');return r.json();}).then(function(data){
        var tbody = document.getElementById('paramsBody');
        var empty = document.getElementById('paramsEmpty');
        if (!data.length) { empty.style.display=''; tbody.innerHTML=''; }
        else {
            empty.style.display='none';
            tbody.innerHTML = data.map(function(item){return '<tr><td>'+item.id+'</td><td>'+escapeHtml(item.name)+'</td><td>'+escapeHtml(item.type||'')+'</td><td>'+escapeHtml(item.description||'')+'</td><td class="actions-col" style="display:'+(isAdmin?'':'none')+'"><button class="btn btn-sm btn-edit" onclick="editSystemParameter('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemParameter('+item.id+')">🗑️</button></td></tr>';}).join('');
        }
    }).catch(function(){document.getElementById('paramsBody').innerHTML='<tr><td colspan="5" class="error">Ошибка загрузки</td></tr>';});
}

document.getElementById('addParamBtn').addEventListener('click', function() {
    showModal('Добавить параметр','<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="paramName" required></div><div class="form-group"><label>Тип:</label><input type="text" id="paramType"></div><div class="form-group"><label>Описание:</label><textarea id="paramDescription" rows="3"></textarea></div><div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>');
    modalForm.onsubmit = function(e) {
        e.preventDefault();
        var n=document.getElementById('paramName').value.trim(), v=document.getElementById('paramValue').value.trim(), d=document.getElementById('paramDescription').value.trim();
        if(!n){alert('Введите название');return;}
        fetch('/api/system-parameters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,value:v,description:d})})
        .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message||'Ошибка');});closeModal();loadParams();})
        .catch(function(e){alert(e.message);});
    };
});

window.editSystemParameter = function(id) {
    fetch('/api/system-parameters/'+id).then(function(r){return r.json();}).then(function(p){
        showModal('Редактировать параметр','<div class="form-group"><label>Название:</label><input type="text" id="paramName" value="'+escapeHtml(p.name)+'" required></div><div class="form-group"><label>Тип:</label><input type="text" id="paramType" value="'+escapeHtml(p.type||'')+'"></div><div class="form-group"><label>Описание:</label><textarea id="paramDescription" rows="3">'+escapeHtml(p.description||'')+'</textarea></div><div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>');
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            fetch('/api/system-parameters/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('paramName').value.trim(),type:document.getElementById('paramType').value.trim(),description:document.getElementById('paramDescription').value.trim()})})
            .then(function(){closeModal();loadParams();}).catch(function(e){alert(e.message);});
        };
    });
};

window.deleteSystemParameter = function(id) {
    if(!confirm('Удалить?'))return;
    fetch('/api/system-parameters/'+id,{method:'DELETE'}).then(loadParams).catch(function(e){alert(e.message);});
};

window.pageInit = function() { applyPermissions(); initTabs(); loadComponents(); };
</script>
