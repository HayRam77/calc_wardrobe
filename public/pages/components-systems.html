<!-- public/pages/components-systems.html -->
<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="components">Компоненты систем</button>
        <button class="tab-btn" data-tab="types">Типы компонентов систем</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов систем</button>
        <button class="tab-btn" data-tab="modules">Модули системы</button>
    </div>

    <div class="tab-content active" id="tab-components">
        <div style="margin-bottom:10px;">
            <button id="addComponentBtn" class="btn btn-primary" style="display:none;">Добавить компонент систем</button>
            <button id="exportComponentsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importComponentsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importComponentsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Описание</th><th>Параметры</th><th id="componentsActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="componentsBody"><tr><td colspan="8" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="componentsEmpty" class="empty-state" style="display:none;"><p>Компонентов нет</p></div>
    </div>

    <div class="tab-content" id="tab-types">
        <div style="margin-bottom:10px;">
            <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип компонента систем</button>
            <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="typesActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="typesEmpty" class="empty-state" style="display:none;"><p>Типов нет</p></div>
    </div>

    <div class="tab-content" id="tab-params">
        <div style="margin-bottom:10px;">
            <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр компонента систем</button>
            <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Название</th><th>Тип</th><th>Описание</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="paramsBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="paramsEmpty" class="empty-state" style="display:none;"><p>Параметров нет</p></div>
    </div>

    <!-- Вкладка Модули системы -->
    <div class="tab-content" id="tab-modules">
        <div style="margin-bottom:10px;">
            <button id="addModuleBtn" class="btn btn-primary" style="display:none;">Добавить модуль системы</button>
            <button id="exportModulesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importModulesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importModulesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container">
            <table class="data-table">
                <thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="modulesActionsCol" style="display:none;">Действия</th></tr></thead>
                <tbody id="modulesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
            </table>
        </div>
        <div id="modulesEmpty" class="empty-state" style="display:none;"><p>Модулей нет</p></div>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>
</div>

<script>
(function() {
    var currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    var isAdmin = currentUser && currentUser.role === 'admin';

    function applyPermissions() {
        var btns = ['addComponentBtn','exportComponentsBtn','importComponentsBtn','addTypeBtn','exportTypesBtn','importTypesBtn','addParamBtn','exportParamsBtn','importParamsBtn','addModuleBtn','exportModulesBtn','importModulesBtn'];
        var cols = ['componentsActionsCol','typesActionsCol','paramsActionsCol','modulesActionsCol'];
        btns.forEach(function(id) { 
            var el = document.getElementById(id); 
            if (el) el.style.display = isAdmin ? '' : 'none'; 
        });
        cols.forEach(function(id) { 
            var el = document.getElementById(id); 
            if (el) el.style.display = isAdmin ? '' : 'none'; 
        });
    }

    function initTabs() {
        var typesLoaded = false, paramsLoaded = false, modulesLoaded = false;
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                btn.classList.add('active');
                var target = document.getElementById('tab-' + btn.dataset.tab);
                if (target) target.classList.add('active');
                if (btn.dataset.tab === 'types' && !typesLoaded) { 
                    loadTypes(); 
                    typesLoaded = true; 
                }
                if (btn.dataset.tab === 'params' && !paramsLoaded) { 
                    loadParams(); 
                    paramsLoaded = true; 
                }
                if (btn.dataset.tab === 'modules' && !modulesLoaded) { 
                    loadModules(); 
                    modulesLoaded = true; 
                }
            });
        });
    }

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s || '';
        return d.innerHTML;
    }

    var modal = document.getElementById('modal');
    var modalTitle = document.getElementById('modalTitle');
    var modalForm = document.getElementById('modalForm');

    document.querySelector('.close-modal').addEventListener('click', function() { 
        if (modal) modal.style.display = 'none'; 
    });

    window.addEventListener('click', function(e) { 
        if (e.target === modal) modal.style.display = 'none'; 
    });

    function closeModal() { 
        if (modal) {
            modal.style.display = 'none'; 
            if (modalForm) modalForm.innerHTML = ''; 
        }
    }

    function showModal(title, html) { 
        if (!modal || !modalTitle || !modalForm) return;
        modalTitle.textContent = title; 
        modalForm.innerHTML = html; 
        modal.style.display = 'block'; 
    }

    // ==================== КОМПОНЕНТЫ ====================
    function loadComponents() {
        var tbody = document.getElementById('componentsBody');
        if (!tbody) return;
        
        fetch('/api/system-components')
            .then(function(res) { 
                if (!res.ok) throw new Error('Ошибка'); 
                return res.json(); 
            })
            .then(function(data) {
                var empty = document.getElementById('componentsEmpty');
                if (!data.length) { 
                    if (empty) empty.style.display = ''; 
                    tbody.innerHTML = ''; 
                } else {
                    if (empty) empty.style.display = 'none';
                    var html = '';
                    data.forEach(function(item) {
                        var paramsHtml = '-';
                        if (item.params && item.params.length) {
                            paramsHtml = item.params.map(function(p) {
                                return esc(p.name) + (p.type ? ' (' + esc(p.type) + ')' : '') + ': ' + esc(p.value);
                            }).join('<br>');
                        }
                        html += '<tr><td>' + item.id + '</td><td>' + esc(item.type_name || '') + '</td><td>' + esc(item.name) + '</td><td>' + esc(item.manufacturer_name || '') + '</td><td>' + esc(item.article || '') + '</td><td>' + esc(item.description || '') + '</td><td>' + paramsHtml + '</td>';
                        if (isAdmin) {
                            html += '<td><button class="btn btn-sm btn-edit" onclick="editSystemComponent(' + item.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponent(' + item.id + ')">🗑️</button></td>';
                        }
                        html += '</tr>';
                    });
                    tbody.innerHTML = html;
                }
            })
            .catch(function(err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="8" class="error">Ошибка загрузки</td></tr>';
            });
    }

    document.getElementById('addComponentBtn').addEventListener('click', function() {
        if (typeof SystemCompModal !== 'undefined') {
            SystemCompModal.open(null, function() { loadComponents(); });
        } else {
            setTimeout(function(){ document.getElementById('addComponentBtn').click(); }, 200);
        }
    });

    window.editSystemComponent = function(id) {
        if (typeof SystemCompModal !== 'undefined') {
            SystemCompModal.open(id, function() { loadComponents(); });
        }
    };

    window.deleteSystemComponent = function(id) {
        if (!confirm('Удалить?')) return;
        fetch('/api/system-components/' + id, { method: 'DELETE' })
            .then(loadComponents)
            .catch(function(e) { alert(e.message); });
    };

    // ==================== ТИПЫ ====================
    function loadTypes() {
        var tbody = document.getElementById('typesBody');
        if (!tbody) return;
        
        fetch('/api/system-component-types')
            .then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
            .then(function(data){
                var empty = document.getElementById('typesEmpty');
                if (!data.length) { 
                    if (empty) empty.style.display = ''; 
                    tbody.innerHTML = ''; 
                } else {
                    if (empty) empty.style.display = 'none';
                    var html = '';
                    data.forEach(function(item){
                        html += '<tr><td>' + item.id + '</td><td>' + esc(item.name) + '</td><td>' + esc(item.description || '') + '</td>';
                        if (isAdmin) {
                            html += '<td><button class="btn btn-sm btn-edit" onclick="editSystemComponentType(' + item.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponentType(' + item.id + ')">🗑️</button></td>';
                        }
                        html += '</tr>';
                    });
                    tbody.innerHTML = html;
                }
            })
            .catch(function(err){
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';
            });
    }

    document.getElementById('addTypeBtn').addEventListener('click', function() {
        showModal('Добавить тип компонента систем',
            '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="typeName" required></div>' +
            '<div class="form-group"><label>Описание:</label><textarea id="typeDescription" rows="3"></textarea></div>' +
            '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
        );
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            var name = document.getElementById('typeName').value.trim();
            var desc = document.getElementById('typeDescription').value.trim();
            if (!name) { alert('Введите название'); return; }
            fetch('/api/system-component-types', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, description: desc })
            })
            .then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); }); closeModal(); loadTypes(); })
            .catch(function(e){ alert(e.message); });
        };
    });

    window.editSystemComponentType = function(id) {
        fetch('/api/system-component-types/' + id)
            .then(function(r){ return r.json(); })
            .then(function(t){
                showModal('Редактировать тип',
                    '<div class="form-group"><label>Название:</label><input type="text" id="typeName" value="' + esc(t.name) + '" required></div>' +
                    '<div class="form-group"><label>Описание:</label><textarea id="typeDescription" rows="3">' + esc(t.description || '') + '</textarea></div>' +
                    '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
                );
                modalForm.onsubmit = function(e) {
                    e.preventDefault();
                    fetch('/api/system-component-types/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('typeName').value.trim(),
                            description: document.getElementById('typeDescription').value.trim()
                        })
                    })
                    .then(function(){ closeModal(); loadTypes(); })
                    .catch(function(e){ alert(e.message); });
                };
            });
    };

    window.deleteSystemComponentType = function(id) {
        if (!confirm('Удалить?')) return;
        fetch('/api/system-component-types/' + id, { method: 'DELETE' })
            .then(loadTypes)
            .catch(function(e){ alert(e.message); });
    };

    // ==================== ПАРАМЕТРЫ ====================
    function loadParams() {
        var tbody = document.getElementById('paramsBody');
        if (!tbody) return;
        
        fetch('/api/system-parameters')
            .then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
            .then(function(data){
                var empty = document.getElementById('paramsEmpty');
                if (!data.length) { 
                    if (empty) empty.style.display = ''; 
                    tbody.innerHTML = ''; 
                } else {
                    if (empty) empty.style.display = 'none';
                    var html = '';
                    data.forEach(function(item){
                        html += '<tr><td>' + item.id + '</td><td>' + esc(item.name) + '</td><td>' + esc(item.type || '') + '</td><td>' + esc(item.description || '') + '</td>';
                        if (isAdmin) {
                            html += '<td><button class="btn btn-sm btn-edit" onclick="editSystemParameter(' + item.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemParameter(' + item.id + ')">🗑️</button></td>';
                        }
                        html += '</tr>';
                    });
                    tbody.innerHTML = html;
                }
            })
            .catch(function(err){
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="5" class="error">Ошибка загрузки</td></tr>';
            });
    }

    document.getElementById('addParamBtn').addEventListener('click', function() {
        showModal('Добавить параметр',
            '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="paramName" required></div>' +
            '<div class="form-group"><label>Тип:</label><input type="text" id="paramType"></div>' +
            '<div class="form-group"><label>Описание:</label><textarea id="paramDescription" rows="3"></textarea></div>' +
            '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
        );
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            var n = document.getElementById('paramName').value.trim();
            if (!n) { alert('Введите название'); return; }
            fetch('/api/system-parameters', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: n,
                    type: document.getElementById('paramType').value.trim(),
                    description: document.getElementById('paramDescription').value.trim()
                })
            })
            .then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); }); closeModal(); loadParams(); })
            .catch(function(e){ alert(e.message); });
        };
    });

    window.editSystemParameter = function(id) {
        fetch('/api/system-parameters/' + id)
            .then(function(r){ return r.json(); })
            .then(function(p){
                showModal('Редактировать параметр',
                    '<div class="form-group"><label>Название:</label><input type="text" id="paramName" value="' + esc(p.name) + '" required></div>' +
                    '<div class="form-group"><label>Тип:</label><input type="text" id="paramType" value="' + esc(p.type || '') + '"></div>' +
                    '<div class="form-group"><label>Описание:</label><textarea id="paramDescription" rows="3">' + esc(p.description || '') + '</textarea></div>' +
                    '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
                );
                modalForm.onsubmit = function(e) {
                    e.preventDefault();
                    fetch('/api/system-parameters/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('paramName').value.trim(),
                            type: document.getElementById('paramType').value.trim(),
                            description: document.getElementById('paramDescription').value.trim()
                        })
                    })
                    .then(function(){ closeModal(); loadParams(); })
                    .catch(function(e){ alert(e.message); });
                };
            });
    };

    window.deleteSystemParameter = function(id) {
        if (!confirm('Удалить?')) return;
        fetch('/api/system-parameters/' + id, { method: 'DELETE' })
            .then(loadParams)
            .catch(function(e){ alert(e.message); });
    };

    // ==================== МОДУЛИ СИСТЕМЫ ====================
    function loadModules() {
        var tbody = document.getElementById('modulesBody');
        if (!tbody) return;
        
        fetch('/api/system-modules')
            .then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
            .then(function(data){
                var empty = document.getElementById('modulesEmpty');
                if (!data.length) { 
                    if (empty) empty.style.display = ''; 
                    tbody.innerHTML = ''; 
                } else {
                    if (empty) empty.style.display = 'none';
                    var html = '';
                    data.forEach(function(item){
                        html += '<tr><td>' + item.id + '</td><td>' + esc(item.name) + '</td><td>' + esc(item.description || '') + '</td>';
                        if (isAdmin) {
                            html += '<td><button class="btn btn-sm btn-edit" onclick="editSystemModule(' + item.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemModule(' + item.id + ')">🗑️</button></td>';
                        }
                        html += '</tr>';
                    });
                    tbody.innerHTML = html;
                }
            })
            .catch(function(err){
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';
            });
    }

    document.getElementById('addModuleBtn').addEventListener('click', function() {
        showModal('Добавить модуль системы',
            '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="moduleName" required></div>' +
            '<div class="form-group"><label>Описание:</label><textarea id="moduleDescription" rows="3"></textarea></div>' +
            '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
        );
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            var name = document.getElementById('moduleName').value.trim();
            var desc = document.getElementById('moduleDescription').value.trim();
            if (!name) { alert('Введите название'); return; }
            fetch('/api/system-modules', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, description: desc })
            })
            .then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); }); closeModal(); loadModules(); })
            .catch(function(e){ alert(e.message); });
        };
    });

    window.editSystemModule = function(id) {
        fetch('/api/system-modules/' + id)
            .then(function(r){ return r.json(); })
            .then(function(item){
                showModal('Редактировать модуль',
                    '<div class="form-group"><label>Название:</label><input type="text" id="moduleName" value="' + esc(item.name) + '" required></div>' +
                    '<div class="form-group"><label>Описание:</label><textarea id="moduleDescription" rows="3">' + esc(item.description || '') + '</textarea></div>' +
                    '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button></div>'
                );
                modalForm.onsubmit = function(e) {
                    e.preventDefault();
                    fetch('/api/system-modules/' + id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: document.getElementById('moduleName').value.trim(),
                            description: document.getElementById('moduleDescription').value.trim()
                        })
                    })
                    .then(function(){ closeModal(); loadModules(); })
                    .catch(function(e){ alert(e.message); });
                };
            });
    };

    window.deleteSystemModule = function(id) {
        if (!confirm('Удалить модуль?')) return;
        fetch('/api/system-modules/' + id, { method: 'DELETE' })
            .then(loadModules)
            .catch(function(e){ alert(e.message); });
    };

    document.getElementById('exportModulesBtn').addEventListener('click', async function() {
        var r = await fetch('/api/system-modules/export');
        var b = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'system_modules.xlsx';
        a.click();
    });

    document.getElementById('importModulesBtn').addEventListener('click', function() {
        document.getElementById('importModulesFile').click();
    });
    document.getElementById('importModulesFile').addEventListener('change', async function() {
        var fd = new FormData();
        fd.append('file', this.files[0]);
        await fetch('/api/system-modules/import', { method: 'POST', body: fd });
        loadModules();
        this.value = '';
    });

    // Экспорт/импорт для компонентов
    document.getElementById('exportComponentsBtn').addEventListener('click', async function() {
        var r = await fetch('/api/system-components/export');
        var b = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'system_components.xlsx';
        a.click();
    });

    document.getElementById('importComponentsBtn').addEventListener('click', function() {
        document.getElementById('importComponentsFile').click();
    });
    document.getElementById('importComponentsFile').addEventListener('change', async function() {
        var fd = new FormData();
        fd.append('file', this.files[0]);
        await fetch('/api/system-components/import', { method: 'POST', body: fd });
        loadComponents();
        this.value = '';
    });

    window.pageInit = function() { 
        applyPermissions(); 
        initTabs(); 
        loadComponents(); 
        loadModules();
    };

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        applyPermissions();
        initTabs();
        loadComponents();
        loadModules();
    }
})();
</script>
