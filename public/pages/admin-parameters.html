<h2>Параметры</h2>
<div style="margin-bottom:10px;">
  <input type="text" id="newParamName" placeholder="Название параметра">
  <button id="addParamBtn">Добавить</button>
</div>
<div id="paramsTable"></div>

<script>
(function() {
  const token = localStorage.getItem('token');
  const container = document.getElementById('paramsTable');

  async function loadParams() {
    try {
      const res = await fetch('/api/parameters', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const params = await res.json();
      let html = '<table><tr><th>Название</th><th></th></tr>';
      if (params.length === 0) html = '<p>Нет параметров</p>';
      else params.forEach(p => {
        html += `<tr>
          <td>${p.param_name}</td>
          <td>
            <button class="small edit-param-btn" data-id="${p.id}">✎</button>
            <button class="small danger delete-param-btn" data-id="${p.id}">Удалить</button>
          </td>
        </tr>`;
      });
      html += '</table>';
      container.innerHTML = html;

      // редактирование
      container.querySelectorAll('.edit-param-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.target.dataset.id;
          const newName = prompt('Новое название параметра:');
          if (!newName || !newName.trim()) return;
          const res = await fetch('/api/parameters/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ param_name: newName.trim() })
          });
          if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
          if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
          loadParams();
        });
      });
      // удаление
      container.querySelectorAll('.delete-param-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('Удалить параметр?')) return;
          const id = e.target.dataset.id;
          await fetch('/api/parameters/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
          if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
          loadParams();
        });
      });
    } catch(e) { container.innerHTML = '<p style="color:red;">Ошибка</p>'; }
  }

  document.getElementById('addParamBtn').addEventListener('click', async () => {
    const name = document.getElementById('newParamName').value.trim();
    if (!name) return alert('Введите название');
    const res = await fetch('/api/parameters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ param_name: name })
    });
    if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
    document.getElementById('newParamName').value = '';
    if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
    loadParams();
  });

  loadParams();
})();
</script>
