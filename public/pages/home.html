<div class="page-content">
    <div style="margin-bottom:10px;" id="homeActions">
        <button id="addProjectBtn" class="btn btn-primary" style="display:none;">Создать проект</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
    </div>
    <div id="projectsTable" style="margin-top:15px;"></div>
</div>

<div id="projectModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95vw;">
        <span class="modal-close">&times;</span>
        <h3 id="projectModalTitle">Создать проект</h3>
        <form id="projectForm">
            <input type="hidden" id="projectId">
            <div class="form-group">
                <label for="projectName">Название *</label>
                <input type="text" id="projectName" class="form-control" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="projectDescription">Описание</label>
                <textarea id="projectDescription" class="form-control" maxlength="1000" rows="3"></textarea>
            </div>
            <div id="projectError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" id="projectCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary" id="home_btn_btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || 'null');
    var token = localStorage.getItem('token');
    if (!user || !token) { window.location.href = '/login.html'; return; }
    var isAdmin = user.role === 'admin';

    if (isAdmin) {
        document.getElementById('addProjectBtn').style.display = '';
        document.getElementById('exportBtn').style.display = '';
        document.getElementById('importBtn').style.display = '';
    }

    function escapeHtml(text) { return String(text).replace(/[&<>"]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

    function setupDragAndDrop(tbody) {
        var dragInfo = null;
        function onMouseMove(e) {
            if (!dragInfo) return;
            var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            var target = null;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
            }
            if (target && target !== dragInfo.row) {
                var ri = rows.indexOf(dragInfo.row), ti = rows.indexOf(target);
                if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
                else tbody.insertBefore(dragInfo.row, target);
            }
        }
        function onMouseUp() {
            if (!dragInfo) return;
            dragInfo.row.style.opacity = '';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            var items = [];
            tbody.querySelectorAll('tr[data-id]').forEach(function(tr, idx) {
                var id = parseInt(tr.dataset.id);
                if (id) items.push({ id: id, position: idx });
            });
            fetch('/api/projects/reorder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) }).catch(function(e) { console.error(e); });
            dragInfo = null;
        }

        tbody.addEventListener('mousedown', function(e) {
            var handle = e.target.closest('.drag-handle');
            if (!handle) return;
            e.preventDefault();
            var row = handle.closest('tr');
            if (!row) return;
            dragInfo = { row: row, startY: e.clientY };
            row.style.opacity = '0.5';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    async function loadProjects() {
        var container = document.getElementById('projectsTable');
        try {
            var res = await fetch('/api/projects');
            var data = await res.json();
            if (!data.length) { container.innerHTML = '<p>Нет проектов.</p>'; return; }
            var html = '<div class="table-container"><table class="data-table"><thead><tr><th style="width:1%"></th><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="description">Описание</th><th>Владелец</th>';
            if (isAdmin) html += '<th>Действия</th>';
            html += '</tr></thead><tbody>';
            data.forEach(function(p) {
                html += '<tr data-id="' + p.id + '"><td class="drag-handle" style="cursor:grab;">⠿</td><td>' + p.id + '</td><td><a href="/project/' + p.id + '" onclick="navigateTo(\'/project/' + p.id + '\');return false;">' + escapeHtml(p.name) + '</a></td><td>' + escapeHtml(p.description || '') + '</td><td>' + escapeHtml(p.owner_name || p.user_id) + '</td>';
                if (isAdmin) html += '<td><button class="btn btn-sm btn-edit" onclick="editProject(' + p.id + ')" id="home_edit_btn">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteProject(' + p.id + ')" id="home_del_btn">🗑️</button></td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;

            var t = container.querySelector('table');
            if (t) {
                var thd = t.querySelector('thead tr');
                var st = JSON.parse(localStorage.getItem('projects_sort') || '{}');
                var sk = st.key || null, sd = st.dir || 'asc';
                var tb = t.querySelector('tbody');

                setupDragAndDrop(tb);

                function srt(k, d) {
                  if (!tb || !k) return;
                  var rs = Array.from(tb.querySelectorAll('tr[data-id]'));
                  var ci = Array.from(thd.querySelectorAll('th')).findIndex(function(th) { return th.dataset.sort === k; });
                  if (ci < 0) return;
                  rs.sort(function(a, b) {
                    var va = (a.cells[ci]?.textContent || '').trim();
                    var vb = (b.cells[ci]?.textContent || '').trim();
                    var na = parseFloat(va.replace(/,/g, '.')), nb = parseFloat(vb.replace(/,/g, '.'));
                    if (!isNaN(na) && !isNaN(nb)) return d === 'asc' ? na - nb : nb - na;
                    return d === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
                  });
                  rs.forEach(function(r) { tb.appendChild(r); });
                  thd.querySelectorAll('th').forEach(function(th) { th.classList.remove('sorted-asc', 'sorted-desc'); if (th.dataset.sort === k) th.classList.add(d === 'asc' ? 'sorted-asc' : 'sorted-desc'); });
                }

                thd.querySelectorAll('th[data-sort]').forEach(function(th) {
                  th.style.cursor = 'pointer';
                  th.addEventListener('click', function() {
                    var k = this.dataset.sort;
                    if (sk === k) { sd = sd === 'asc' ? 'desc' : 'asc'; } else { sk = k; sd = 'asc'; }
                    localStorage.setItem('projects_sort', JSON.stringify({key: sk, dir: sd}));
                    srt(sk, sd);
                  });
                });
                if (sk) setTimeout(function() { srt(sk, sd); }, 200);
            }

        } catch(e) { container.innerHTML = '<p style="color:red;">Ошибка загрузки проектов</p>'; }
    }

    var modal = document.getElementById('projectModal');
    var modalTitle = document.getElementById('projectModalTitle');
    var form = document.getElementById('projectForm');
    var errorDiv = document.getElementById('projectError');

    document.getElementById('addProjectBtn').addEventListener('click', function() {
        document.getElementById('projectId').value = '';
        document.getElementById('projectName').value = '';
        document.getElementById('projectDescription').value = '';
        errorDiv.style.display = 'none';
        modalTitle.textContent = 'Создать проект';
        modal.style.display = 'flex';
    });

    document.querySelector('#projectModal .modal-close').addEventListener('click', function() { modal.style.display = 'none'; });
    document.getElementById('projectCancelBtn').addEventListener('click', function() { modal.style.display = 'none'; });
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        var id = document.getElementById('projectId').value;
        var name = document.getElementById('projectName').value.trim();
        var description = document.getElementById('projectDescription').value.trim();
        if (!name) { errorDiv.textContent = 'Введите название'; errorDiv.style.display = 'block'; return; }
        try {
            var url = id ? '/api/projects/' + id : '/api/projects';
            var res = await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name, description: description }) });
            if (!res.ok) { var d = await res.json(); throw new Error(d.message || 'Ошибка'); }
            modal.style.display = 'none';
            loadProjects();
        } catch(err) { errorDiv.textContent = err.message; errorDiv.style.display = 'block'; }
    });

    window.editProject = async function(id) {
        try {
            var res = await fetch('/api/projects/' + id);
            var p = await res.json();
            document.getElementById('projectId').value = p.id;
            document.getElementById('projectName').value = p.name;
            document.getElementById('projectDescription').value = p.description || '';
            errorDiv.style.display = 'none';
            modalTitle.textContent = 'Редактировать проект';
            modal.style.display = 'flex';
        } catch(err) { alert(err.message); }
    };

    window.deleteProject = async function(id) {
        if (!confirm('Удалить проект?')) return;
        try { await fetch('/api/projects/' + id, { method: 'DELETE' }); loadProjects(); }
        catch(err) { alert(err.message); }
    };

    window.pageInit = function() { loadProjects(); };
})();
</script>
