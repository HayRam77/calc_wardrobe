<!-- public/pages/home.html -->
<div class="page-content">
    <h2>Проекты</h2>
    <div style="margin-bottom:10px;" id="homeActions">
        <button id="addProjectBtn" class="btn btn-primary" style="display:none;">Создать проект</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
    </div>
    <div id="projectsTable" style="margin-top:15px;"></div>
</div>

<div id="projectModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close">&times;</span>
        <h3 id="projectModalTitle">Создать проект</h3>
        <form id="projectForm">
            <input type="hidden" id="projectId">
            <div class="form-group">
                <label for="projectName">Название *</label>
                <input type="text" id="projectName" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="projectDescription">Описание</label>
                <textarea id="projectDescription" maxlength="1000" rows="3"></textarea>
            </div>
            <div id="projectError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;">
                <button type="button" id="projectCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    // Проверка авторизации перед выполнением
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const token = localStorage.getItem('token');
    if (!user || !token) {
        // Не авторизованы — перенаправляем на страницу входа
        window.location.hash = '#/login';
        return;
    }

    const isAdmin = user.role === 'admin';

    // Показываем кнопки действий только администраторам
    if (isAdmin) {
        document.getElementById('addProjectBtn').style.display = 'inline-block';
        document.getElementById('exportBtn').style.display = 'inline-block';
        document.getElementById('importBtn').style.display = 'inline-block';
    }

    // Загрузка проектов
    async function loadProjects() {
        try {
            const res = await fetch('/api/projects', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Ошибка загрузки проектов');
            const projects = await res.json();

            const container = document.getElementById('projectsTable');
            if (!projects.length) {
                container.innerHTML = '<p>Нет проектов.</p>';
                return;
            }

            let html = `<table class="data-table"><thead><tr>
                <th>ID</th><th>Название</th><th>Описание</th><th>Владелец</th>
                ${isAdmin ? '<th>Действия</th>' : ''}
            </tr></thead><tbody>`;

            projects.forEach(p => {
                html += `<tr>
                    <td>${p.id}</td>
                    <td><a href="#/project/${p.id}">${escapeHtml(p.name)}</a></td>
                    <td>${escapeHtml(p.description || '')}</td>
                    <td>${escapeHtml(p.owner_name || p.user_id)}</td>
                    ${isAdmin ? `<td>
                        <button class="btn btn-sm" onclick="editProject(${p.id})">✏️</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteProject(${p.id})">🗑️</button>
                    </td>` : ''}
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        } catch (err) {
            console.error(err);
            document.getElementById('projectsTable').innerHTML = '<p style="color:red;">Ошибка загрузки проектов</p>';
        }
    }

    // Модальное окно
    const modal = document.getElementById('projectModal');
    const modalTitle = document.getElementById('projectModalTitle');
    const projectIdInput = document.getElementById('projectId');
    const projectNameInput = document.getElementById('projectName');
    const projectDescInput = document.getElementById('projectDescription');
    const projectErrorDiv = document.getElementById('projectError');

    document.getElementById('addProjectBtn').addEventListener('click', () => {
        projectIdInput.value = '';
        projectNameInput.value = '';
        projectDescInput.value = '';
        projectErrorDiv.style.display = 'none';
        modalTitle.textContent = 'Создать проект';
        modal.style.display = 'block';
    });

    document.querySelector('.modal-close').addEventListener('click', () => {
        modal.style.display = 'none';
    });
    document.getElementById('projectCancelBtn').addEventListener('click', () => {
        modal.style.display = 'none';
    });
    window.addEventListener('click', (e) => {
        if (e.target === modal) modal.style.display = 'none';
    });

    // Отправка формы
    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = projectIdInput.value;
        const name = projectNameInput.value.trim();
        const description = projectDescInput.value.trim();

        if (!name) {
            projectErrorDiv.textContent = 'Введите название проекта';
            projectErrorDiv.style.display = 'block';
            return;
        }

        try {
            const url = id ? `/api/projects/${id}` : '/api/projects';
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, description })
            });
            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.message || 'Ошибка сохранения');
            }
            modal.style.display = 'none';
            loadProjects();
        } catch (err) {
            projectErrorDiv.textContent = err.message;
            projectErrorDiv.style.display = 'block';
        }
    });

    // Глобальные функции для кнопок
    window.editProject = async function(id) {
        try {
            const res = await fetch(`/api/projects/${id}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Не удалось загрузить проект');
            const project = await res.json();

            projectIdInput.value = project.id;
            projectNameInput.value = project.name;
            projectDescInput.value = project.description || '';
            projectErrorDiv.style.display = 'none';
            modalTitle.textContent = 'Редактировать проект';
            modal.style.display = 'block';
        } catch (err) {
            alert(err.message);
        }
    };

    window.deleteProject = async function(id) {
        if (!confirm('Удалить проект?')) return;
        try {
            const res = await fetch(`/api/projects/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) throw new Error('Ошибка удаления');
            loadProjects();
        } catch (err) {
            alert(err.message);
        }
    };

    function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
        }[m]));
    }

    // Инициализация
    loadProjects();
})();
</script>
