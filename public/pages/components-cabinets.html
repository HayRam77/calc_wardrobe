<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="templates">Компоненты шкафов</button>
        <button class="tab-btn" data-tab="types">Типы компонентов шкафов</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов шкафов</button>
    </div>

    <div class="tab-content active" id="tab-templates">
        <div style="margin-bottom:10px;">
            <button id="addTemplateBtn" class="btn btn-primary" style="display:none;">Добавить компонент</button>
            <button id="exportTemplatesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTemplatesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTemplatesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Цена, руб.</th><th>Вес, гр.</th><th>Q, Вт</th><th>LN</th><th>Ссылка</th><th id="templatesActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="templatesBody"><tr><td colspan="10">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-types">
        <div style="margin-bottom:10px;">
            <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип</button>
            <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="typesActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-params">
        <div style="margin-bottom:10px;">
            <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр</button>
            <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="paramsBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody></table></div>
    </div>
</div>

<div id="templateModal" class="modal">
    <div class="modal-content" style="max-width:700px; max-height:85vh; overflow-y:auto;">
        <span class="modal-close">&times;</span><h3 id="templateModalTitle">Добавить компонент</h3>
        <form id="templateForm"><input type="hidden" id="templateId"></form>
    </div>
</div>
<div id="typeModal" class="modal"><div class="modal-content" style="max-width:500px;"><span class="modal-close">&times;</span><h3 id="typeModalTitle">Добавить тип</h3><form id="typeForm"></form></div></div>
<div id="paramModal" class="modal"><div class="modal-content" style="max-width:500px;"><span class="modal-close">&times;</span><h3 id="paramModalTitle">Добавить параметр</h3><form id="paramForm"></form></div></div>

<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || 'null');
    var isAdmin = user && user.role === 'admin';
    var typesLoaded = false, paramsLoaded = false;
    var isLoading = false;
    
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    
    function setPermissions() {
        var ids = ['addTemplateBtn','exportTemplatesBtn','importTemplatesBtn','addTypeBtn','exportTypesBtn','importTypesBtn','addParamBtn','exportParamsBtn','importParamsBtn','templatesActionsCol','typesActionsCol','paramsActionsCol'];
        ids.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.style.display = isAdmin ? '' : 'none';
        });
    }
    setPermissions();

    // Вкладки с защитой от повторных запросов
    document.querySelectorAll('.tab-btn').forEach(function(b) {
        b.addEventListener('click', function() {
            // Защита от повторных кликов
            if (isLoading) return;
            
            document.querySelectorAll('.tab-btn').forEach(function(x) { x.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(x) { x.classList.remove('active'); });
            this.classList.add('active');
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            
            // Загружаем только если ещё не загружено
            if (this.dataset.tab === 'types' && !typesLoaded) {
                isLoading = true;
                loadTypes();
                typesLoaded = true;
                setTimeout(function() { isLoading = false; }, 300);
            }
            if (this.dataset.tab === 'params' && !paramsLoaded) {
                isLoading = true;
                loadParams();
                paramsLoaded = true;
                setTimeout(function() { isLoading = false; }, 300);
            }
        });
    });

    // Закрытие модалок
    document.querySelectorAll('.modal .modal-close').forEach(function(el) {
        el.addEventListener('click', function() {
            this.closest('.modal').classList.remove('active');
        });
    });

    // ==================== КОМПОНЕНТЫ ====================
    async function loadTemplates() {
        var tbody = document.getElementById('templatesBody');
        try {
            var res = await fetch('/api/block-templates');
            var data = await res.json();
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="10">Нет компонентов</td></tr>';
                return;
            }
            var html = '';
            data.forEach(function(item) {
                html += '<tr>';
                html += '<td>' + esc(item.type_name || '') + '</td>';
                html += '<td>' + esc(item.name) + '</td>';
                html += '<td>' + esc(item.manufacturer_name || '') + '</td>';
                html += '<td>' + esc(item.article || '') + '</td>';
                html += '<td>' + (item.price || '') + '</td>';
                html += '<td>' + (item.weight_grams || '') + '</td>';
                html += '<td>' + (item.power_watts || '') + '</td>';
                html += '<td>' + esc(item.ln || '') + '</td>';
                html += '<td>' + (item.url ? '<a href="' + esc(item.url) + '" target="_blank">🔗</a>' : '') + '</td>';
                if (isAdmin) {
                    html += '<td><button class="btn btn-sm btn-edit" data-id="' + item.id + '">✏️</button> <button class="btn btn-sm btn-delete" data-id="' + item.id + '">🗑️</button></td>';
                }
                html += '</tr>';
            });
            tbody.innerHTML = html;
            
            if (isAdmin) {
                tbody.querySelectorAll('.btn-edit').forEach(function(btn) {
                    btn.addEventListener('click', function() { openTemplateModal(this.dataset.id); });
                });
                tbody.querySelectorAll('.btn-delete').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (confirm('Удалить?')) deleteTemplate(this.dataset.id);
                    });
                });
            }
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="10">Ошибка загрузки</td></tr>';
        }
    }

    async function deleteTemplate(id) {
        await fetch('/api/block-templates/' + id, { method: 'DELETE' });
        loadTemplates();
    }

    function openTemplateModal(id) {
        if (typeof BlockTemplateModal !== 'undefined') {
            BlockTemplateModal.open(function(newId) {
                if (newId) { document.getElementById('templateModal').classList.remove('active'); loadTemplates(); }
            }, id);
        } else {
            setTimeout(function() { openTemplateModal(id); }, 200);
        }
    }

    document.getElementById('addTemplateBtn').addEventListener('click', function() { openTemplateModal(); });
    document.getElementById('exportTemplatesBtn').addEventListener('click', async function() {
        var r = await fetch('/api/block-templates/export');
        var b = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'block_templates.xlsx';
        a.click();
    });
    document.getElementById('importTemplatesBtn').addEventListener('click', function() {
        document.getElementById('importTemplatesFile').click();
    });
    document.getElementById('importTemplatesFile').addEventListener('change', async function() {
        var fd = new FormData();
        fd.append('file', this.files[0]);
        await fetch('/api/block-templates/import', { method: 'POST', body: fd });
        loadTemplates();
        this.value = '';
    });

    // ==================== ТИПЫ ====================
    async function loadTypes() {
        var tbody = document.getElementById('typesBody');
        try {
            var res = await fetch('/api/component-types');
            var data = await res.json();
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="4">Нет типов</td></tr>';
                return;
            }
            var html = '';
            data.forEach(function(item) {
                html += '<tr>';
                html += '<td>' + item.id + '</td>';
                html += '<td>' + esc(item.name) + '</td>';
                html += '<td>' + esc(item.description || '') + '</td>';
                if (isAdmin) {
                    html += '<td><button class="btn btn-sm btn-edit" data-id="' + item.id + '">✏️</button> <button class="btn btn-sm btn-delete" data-id="' + item.id + '">🗑️</button></td>';
                }
                html += '</tr>';
            });
            tbody.innerHTML = html;
            
            if (isAdmin) {
                tbody.querySelectorAll('.btn-edit').forEach(function(btn) {
                    btn.addEventListener('click', function() { openTypeModal(this.dataset.id); });
                });
                tbody.querySelectorAll('.btn-delete').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (confirm('Удалить?')) {
                            fetch('/api/component-types/' + this.dataset.id, { method: 'DELETE' }).then(loadTypes);
                        }
                    });
                });
            }
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки</td></tr>';
        }
    }

    function openTypeModal(id) {
        var modal = document.getElementById('typeModal');
        var form = document.getElementById('typeForm');
        var title = document.getElementById('typeModalTitle');
        
        title.textContent = id ? 'Редактировать тип' : 'Добавить тип';
        form.innerHTML = '<input type="hidden" id="typeId" value="' + (id || '') + '">' +
            '<div class="form-group"><label>Название *</label><input type="text" id="typeName" required></div>' +
            '<div class="form-group"><label>Описание</label><textarea id="typeDescription" rows="2"></textarea></div>' +
            '<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById(\'typeModal\').classList.remove(\'active\')">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';
        modal.classList.add('active');
        
        if (id) {
            fetch('/api/component-types').then(function(r) { return r.json(); }).then(function(data) {
                var item = data.find(function(x) { return x.id == id; });
                if (item) {
                    document.getElementById('typeName').value = item.name;
                    document.getElementById('typeDescription').value = item.description || '';
                }
            });
        }
        
        form.onsubmit = async function(e) {
            e.preventDefault();
            var typeId = document.getElementById('typeId').value;
            var body = {
                name: document.getElementById('typeName').value.trim(),
                description: document.getElementById('typeDescription').value.trim()
            };
            var url = typeId ? '/api/component-types/' + typeId : '/api/component-types';
            await fetch(url, {
                method: typeId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            modal.classList.remove('active');
            loadTypes();
        };
    }

    document.getElementById('addTypeBtn').addEventListener('click', function() { openTypeModal(); });
    document.getElementById('exportTypesBtn').addEventListener('click', async function() {
        var r = await fetch('/api/component-types/export');
        var b = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'component_types.xlsx';
        a.click();
    });
    document.getElementById('importTypesBtn').addEventListener('click', function() {
        document.getElementById('importTypesFile').click();
    });
    document.getElementById('importTypesFile').addEventListener('change', async function() {
        var fd = new FormData();
        fd.append('file', this.files[0]);
        await fetch('/api/component-types/import', { method: 'POST', body: fd });
        loadTypes();
        this.value = '';
    });

    // ==================== ПАРАМЕТРЫ ====================
    async function loadParams() {
        var tbody = document.getElementById('paramsBody');
        try {
            var res = await fetch('/api/parameters');
            var data = await res.json();
            if (!data.length) {
                tbody.innerHTML = '<tr><td colspan="4">Нет параметров</td></tr>';
                return;
            }
            var html = '';
            data.forEach(function(item) {
                html += '<tr>';
                html += '<td>' + item.id + '</td>';
                html += '<td>' + esc(item.name) + '</td>';
                html += '<td>' + esc(item.description || '') + '</td>';
                if (isAdmin) {
                    html += '<td><button class="btn btn-sm btn-edit" data-id="' + item.id + '">✏️</button> <button class="btn btn-sm btn-delete" data-id="' + item.id + '">🗑️</button></td>';
                }
                html += '</tr>';
            });
            tbody.innerHTML = html;
            
            if (isAdmin) {
                tbody.querySelectorAll('.btn-edit').forEach(function(btn) {
                    btn.addEventListener('click', function() { openParamModal(this.dataset.id); });
                });
                tbody.querySelectorAll('.btn-delete').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (confirm('Удалить?')) {
                            fetch('/api/parameters/' + this.dataset.id, { method: 'DELETE' }).then(loadParams);
                        }
                    });
                });
            }
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="4">Ошибка загрузки</td></tr>';
        }
    }

    function openParamModal(id) {
        var modal = document.getElementById('paramModal');
        var form = document.getElementById('paramForm');
        var title = document.getElementById('paramModalTitle');
        
        title.textContent = id ? 'Редактировать параметр' : 'Добавить параметр';
        form.innerHTML = '<input type="hidden" id="paramId" value="' + (id || '') + '">' +
            '<div class="form-group"><label>Название *</label><input type="text" id="paramName" required></div>' +
            '<div class="form-group"><label>Описание</label><textarea id="paramDescription" rows="2"></textarea></div>' +
            '<div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById(\'paramModal\').classList.remove(\'active\')">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';
        modal.classList.add('active');
        
        if (id) {
            fetch('/api/parameters').then(function(r) { return r.json(); }).then(function(data) {
                var item = data.find(function(x) { return x.id == id; });
                if (item) {
                    document.getElementById('paramName').value = item.name;
                    document.getElementById('paramDescription').value = item.description || '';
                }
            });
        }
        
        form.onsubmit = async function(e) {
            e.preventDefault();
            var paramId = document.getElementById('paramId').value;
            var body = {
                name: document.getElementById('paramName').value.trim(),
                description: document.getElementById('paramDescription').value.trim()
            };
            var url = paramId ? '/api/parameters/' + paramId : '/api/parameters';
            await fetch(url, {
                method: paramId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            modal.classList.remove('active');
            loadParams();
        };
    }

    document.getElementById('addParamBtn').addEventListener('click', function() { openParamModal(); });
    document.getElementById('exportParamsBtn').addEventListener('click', async function() {
        var r = await fetch('/api/parameters/export');
        var b = await r.blob();
        var a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'parameters.xlsx';
        a.click();
    });
    document.getElementById('importParamsBtn').addEventListener('click', function() {
        document.getElementById('importParamsFile').click();
    });
    document.getElementById('importParamsFile').addEventListener('change', async function() {
        var fd = new FormData();
        fd.append('file', this.files[0]);
        await fetch('/api/parameters/import', { method: 'POST', body: fd });
        loadParams();
        this.value = '';
    });

    // Загрузка при инициализации
    loadTemplates();
})();
</script>
