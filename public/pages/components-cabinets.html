<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="templates">Компоненты шкафов</button>
        <button class="tab-btn" data-tab="types">Типы компонентов шкафов</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов шкафов</button>
    </div>

    <div class="tab-content active" id="tab-templates">
        <div style="margin-bottom:10px;">
            <button id="addTemplateBtn" class="btn btn-primary" style="display:none;">Добавить компонент</button>
            <button id="exportTemplatesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTemplatesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTemplatesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Цена, руб.</th><th>Вес, гр.</th><th>Q, Вт</th><th>LN</th><th>Ссылка</th><th id="templatesActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="templatesBody"><tr><td colspan="10">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-types">
        <div style="margin-bottom:10px;">
            <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип</button>
            <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
            <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="typesActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody></table></div>
    </div>
    <div class="tab-content" id="tab-params">
        <div style="margin-bottom:10px;">
            <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр</button>
            <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
            <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
            <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        </div>
        <div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Название</th><th>Описание</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead><tbody id="paramsBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody></table></div>
    </div>
</div>

<div id="templateModal" class="modal">
    <div class="modal-content" style="max-width:700px; max-height:85vh; overflow-y:auto;">
        <span class="modal-close">&times;</span><h3 id="templateModalTitle">Добавить компонент</h3>
        <form id="templateForm"><input type="hidden" id="templateId"></form>
    </div>
</div>
<div id="typeModal" class="modal"><div class="modal-content" style="max-width:500px;"><span class="modal-close">&times;</span><h3 id="typeModalTitle">Добавить тип</h3><form id="typeForm"></form></div></div>
<div id="paramModal" class="modal"><div class="modal-content" style="max-width:500px;"><span class="modal-close">&times;</span><h3 id="paramModalTitle">Добавить параметр</h3><form id="paramForm"></form></div></div>

<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || '{}');
    var isAdmin = user && user.role === 'admin';
    function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

    document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active');});document.querySelectorAll('.tab-content').forEach(function(x){x.classList.remove('active');});b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');if(b.dataset.tab==='types')loadTypes();if(b.dataset.tab==='params')loadParams();});});
    function setAdmin(){var d=isAdmin?'':'none';['addTemplateBtn','exportTemplatesBtn','importTemplatesBtn','addTypeBtn','exportTypesBtn','importTypesBtn','addParamBtn','exportParamsBtn','importParamsBtn','templatesActionsCol','typesActionsCol','paramsActionsCol'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display=d;});}
    setAdmin();

    async function loadTemplates(){var t=document.getElementById('templatesBody');try{var r=await fetch('/api/block-templates');var d=await r.json();if(!d.length){t.innerHTML='<tr><td colspan="10">Нет компонентов</td></tr>';return;}var h='';d.forEach(function(x){h+='<tr><td>'+esc(x.type_name||'')+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.manufacturer_name||'')+'</td><td>'+esc(x.article||'')+'</td><td>'+(x.price||'')+'</td><td>'+(x.weight_grams||'')+'</td><td>'+(x.power_watts||'')+'</td><td>'+esc(x.ln||'')+'</td><td>'+(x.url?'<a href="'+esc(x.url)+'" target="_blank">🔗</a>':'')+'</td>';if(isAdmin)h+='<td><button class="btn btn-sm btn-edit" data-id="'+x.id+'">✏️</button> <button class="btn btn-sm btn-delete" data-id="'+x.id+'">🗑️</button></td>';h+='</tr>';});t.innerHTML=h;t.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){openTemplateModal(this.dataset.id);});});t.querySelectorAll('.btn-delete').forEach(function(b){b.addEventListener('click',function(){if(confirm('Удалить?'))deleteTemplate(this.dataset.id);});});}catch(e){t.innerHTML='<tr><td colspan="10">Ошибка загрузки</td></tr>';}}
    async function deleteTemplate(id){await fetch('/api/block-templates/'+id,{method:'DELETE'});loadTemplates();}

    var tModal=document.getElementById('templateModal');
    document.querySelector('#templateModal .modal-close').addEventListener('click',function(){tModal.classList.remove('active');});

    async function openTemplateModal(id){
        if (typeof BlockTemplateModal !== 'undefined') {
            BlockTemplateModal.open(function(newId){ if(newId){ tModal.classList.remove('active'); loadTemplates(); } });
        } else {
            setTimeout(function(){ openTemplateModal(id); }, 300);
        }
        return;
        var tData={};
        if(id){var r=await fetch('/api/block-templates');var d=await r.json();tData=d.find(function(x){return x.id==id;})||{};}
        var h = '<input type="hidden" id="templateId" value="'+(tData.id||'')+'">';
        h += '<div class="form-row"><div class="form-group"><label>Тип</label><div id="cabTypeContainer"></div></div>';
        h += '<div class="form-group"><label>Производитель</label><select id="templateManufacturer"><option value="">-- Производитель --</option>'+manufacturers.map(function(m){return '<option value="'+m.id+'"'+(tData.manufacturer_id==m.id?' selected':'')+'>'+m.name+'</option>';}).join('')+'</select></div></div>';
        h += '<div class="form-row"><div class="form-group"><label>Название *</label><input type="text" id="templateName" required value="'+esc(tData.name||'')+'"></div><div class="form-group"><label>Артикул</label><input type="text" id="templateArticle" value="'+esc(tData.article||'')+'"></div></div>';
        h += '<div class="form-row"><div class="form-group"><label>Цена, руб.</label><input type="number" id="templatePrice" step="0.01" value="'+(tData.price||'')+'"></div><div class="form-group"><label>Вес, гр.</label><input type="number" id="templateWeight" step="0.01" value="'+(tData.weight_grams||'')+'"></div></div>';
        h += '<div class="form-row"><div class="form-group"><label>Мощность, Вт</label><input type="number" id="templatePower" step="0.01" value="'+(tData.power_watts||'')+'"></div><div class="form-group"><label>LN</label><input type="text" id="templateLn" value="'+esc(tData.ln||'')+'"></div></div>';
        h += '<div class="form-group"><label>Ссылка</label><input type="url" id="templateUrl" value="'+esc(tData.url||'')+'"></div>';
        h += '<div class="form-group"><label>Описание</label><textarea id="templateDescription" rows="2">'+esc(tData.description||'')+'</textarea></div>';
        h += '<h4>Параметры</h4><div id="parametersContainer"></div><button type="button" id="addParamRowBtn" class="btn btn-sm btn-secondary">+ Добавить параметр</button>';
        h += '<div id="templateError" class="error-message" style="display:none;"></div>';
        h += '<div class="form-actions"><button type="button" id="templateCancelBtn" class="btn btn-secondary">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';
        document.getElementById('templateForm').innerHTML = h;
        document.getElementById('templateCancelBtn').addEventListener('click',function(){tModal.classList.remove('active');});

        CabinetTypeSelect.render(document.getElementById('cabTypeContainer'), tData.type_id||null);

        function addParamRow(pId, val) {
            var row = document.createElement('div'); row.className = 'param-row'; row.style.cssText = 'display:flex;gap:8px;margin-bottom:5px;';
            if (typeof CabinetParamSelect !== 'undefined') { CabinetParamSelect.render(row, pId, val); } else {
            fetch('/api/parameters').then(function(r){return r.json();}).then(function(params){
                var h = '<select class="cabinet-param-select" style="flex:1;"><option value="">-- параметр --</option>';
                if (params.length) { h += '<optgroup label="Существующие">'; params.forEach(function(p){ h += '<option value="'+p.id+'"'+(pId==p.id?' selected':'')+'>'+p.name+'</option>'; }); h += '</optgroup>'; }
                h += '<optgroup label="Добавить"><option value="__new__">+ новый параметр</option></optgroup></select>';
                h += '<input type="text" class="cabinet-param-value" placeholder="Значение" style="flex:1;" value="'+(val||'')+'">';
                h += '<input type="text" class="cabinet-param-new-name" placeholder="Название" style="flex:2;display:none;">';
                h += '<button type="button" class="btn btn-sm btn-primary cabinet-param-save-btn" style="display:none;">✓</button>';
                row.innerHTML = h;
                var sel = row.querySelector('.cabinet-param-select');
                var ni = row.querySelector('.cabinet-param-new-name');
                var sv = row.querySelector('.cabinet-param-save-btn');
                sel.addEventListener('change', function(){ ni.style.display = sv.style.display = sel.value === '__new__' ? '' : 'none'; });
                sv.addEventListener('click', function(){
                    var n = ni.value.trim(); if (!n) { alert('Введите название'); return; }
                    fetch('/api/parameters', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})
                    .then(function(r){return r.json();}).then(function(np){
                        var opt = document.createElement('option'); opt.value = np.id; opt.textContent = np.name;
                        sel.querySelector('optgroup:first-child').appendChild(opt); sel.value = np.id; ni.style.display='none'; sv.style.display='none';
                    });
                });
            });
        }
            var del = document.createElement('button'); del.type='button'; del.textContent='✕'; del.className='btn btn-sm btn-delete';
            del.addEventListener('click', function(){row.remove();});
            row.appendChild(del);
            document.getElementById('parametersContainer').appendChild(row);
        }
        if (tData.parameters && tData.parameters.length) { tData.parameters.forEach(function(p){ addParamRow(p.parameter_id, p.param_value); }); }
        else { addParamRow(null, null); }
        document.getElementById('addParamRowBtn').addEventListener('click', function(){ addParamRow(null, null); });

        document.getElementById('templateForm').onsubmit = async function(e) {
            e.preventDefault();
            var id = document.getElementById('templateId').value;
            var params = []; document.querySelectorAll('.param-row').forEach(function(r){ var val = CabinetParamSelect.getValue(r); if (val) params.push(val); });
            var typeSel = document.querySelector('#cabTypeContainer .cabinet-type-select');
            var body = {
                name: document.getElementById('templateName').value.trim(),
                type_id: typeSel && typeSel.value !== '__new__' ? typeSel.value : null,
                manufacturer_id: document.getElementById('templateManufacturer').value || null,
                article: document.getElementById('templateArticle').value.trim() || null,
                price: document.getElementById('templatePrice').value || null,
                weight_grams: document.getElementById('templateWeight').value || null,
                power_watts: document.getElementById('templatePower').value || null,
                ln: document.getElementById('templateLn').value.trim() || null,
                url: document.getElementById('templateUrl').value.trim() || null,
                description: document.getElementById('templateDescription').value.trim() || null,
                parameters: params
            };
            if (!body.name || !body.type_id || body.type_id === '__new__') { alert('Заполните поля'); return; }
            var url = id ? '/api/block-templates/'+id : '/api/block-templates';
            var res = await fetch(url, {method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            if (res.ok) { tModal.classList.remove('active'); loadTemplates(); }
            else { var err = await res.json(); document.getElementById('templateError').textContent = err.error||err.message; document.getElementById('templateError').style.display = 'block'; }
        };
    }

    document.getElementById('addTemplateBtn').addEventListener('click',function(){openTemplateModal();});
    document.getElementById('exportTemplatesBtn').addEventListener('click',async function(){var r=await fetch('/api/block-templates/export');var b=await r.blob();var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='block_templates.xlsx';a.click();});
    document.getElementById('importTemplatesBtn').addEventListener('click',function(){document.getElementById('importTemplatesFile').click();});
    document.getElementById('importTemplatesFile').addEventListener('change',async function(){var fd=new FormData();fd.append('file',this.files[0]);await fetch('/api/block-templates/import',{method:'POST',body:fd});loadTemplates();this.value='';});

    async function loadTypes(){var t=document.getElementById('typesBody');try{var r=await fetch('/api/component-types');var d=await r.json();if(!d.length){t.innerHTML='<tr><td colspan="4">Нет типов</td></tr>';return;}var h='';d.forEach(function(x){h+='<tr><td>'+x.id+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.description||'')+'</td>';if(isAdmin)h+='<td><button class="btn btn-sm btn-edit" data-id="'+x.id+'">✏️</button> <button class="btn btn-sm btn-delete" data-id="'+x.id+'">🗑️</button></td>';h+='</tr>';});t.innerHTML=h;t.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){openTypeModal(this.dataset.id);});});t.querySelectorAll('.btn-delete').forEach(function(b){b.addEventListener('click',function(){fetch('/api/component-types/'+this.dataset.id,{method:'DELETE'}).then(loadTypes);});});}catch(e){t.innerHTML='<tr><td colspan="4">Ошибка загрузки</td></tr>';}}
    var typeModal=document.getElementById('typeModal');
    document.querySelector('#typeModal .modal-close').addEventListener('click',function(){typeModal.classList.remove('active');});
    document.getElementById('addTypeBtn').addEventListener('click',function(){openTypeModal();});
    function openTypeModal(id){document.getElementById('typeForm').innerHTML='<input type="hidden" id="typeId" value="'+(id||'')+'"><div class="form-group"><label>Название *</label><input type="text" id="typeName" required></div><div class="form-group"><label>Описание</label><textarea id="typeDescription" rows="2"></textarea></div><div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById(\'typeModal\').style.display=\'none\'">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';typeModal.classList.add('active');if(id){fetch('/api/component-types').then(function(r){return r.json();}).then(function(d){var t=d.find(function(x){return x.id==id;});if(t){document.getElementById('typeName').value=t.name;document.getElementById('typeDescription').value=t.description||'';}});}document.getElementById('typeForm').onsubmit=async function(e){e.preventDefault();var id=document.getElementById('typeId').value;var body={name:document.getElementById('typeName').value.trim(),description:document.getElementById('typeDescription').value.trim()};var url=id?'/api/component-types/'+id:'/api/component-types';var res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(res.ok){typeModal.classList.remove('active');loadTypes();}};}
    document.getElementById('exportTypesBtn').addEventListener('click',async function(){var r=await fetch('/api/component-types/export');var b=await r.blob();var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='component_types.xlsx';a.click();});
    document.getElementById('importTypesBtn').addEventListener('click',function(){document.getElementById('importTypesFile').click();});
    document.getElementById('importTypesFile').addEventListener('change',async function(){var fd=new FormData();fd.append('file',this.files[0]);await fetch('/api/component-types/import',{method:'POST',body:fd});loadTypes();this.value='';});

    async function loadParams(){var t=document.getElementById('paramsBody');try{var r=await fetch('/api/parameters');var d=await r.json();if(!d.length){t.innerHTML='<tr><td colspan="4">Нет параметров</td></tr>';return;}var h='';d.forEach(function(p){h+='<tr><td>'+p.id+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.description||'')+'</td>';if(isAdmin)h+='<td><button class="btn btn-sm btn-edit" data-id="'+p.id+'">✏️</button> <button class="btn btn-sm btn-delete" data-id="'+p.id+'">🗑️</button></td>';h+='</tr>';});t.innerHTML=h;t.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){openParamModal(this.dataset.id);});});t.querySelectorAll('.btn-delete').forEach(function(b){b.addEventListener('click',function(){fetch('/api/parameters/'+this.dataset.id,{method:'DELETE'}).then(loadParams);});});}catch(e){t.innerHTML='<tr><td colspan="4">Ошибка загрузки</td></tr>';}}
    var paramModal=document.getElementById('paramModal');
    document.querySelector('#paramModal .modal-close').addEventListener('click',function(){paramModal.classList.remove('active');});
    document.getElementById('addParamBtn').addEventListener('click',function(){openParamModal();});
    function openParamModal(id){document.getElementById('paramForm').innerHTML='<input type="hidden" id="paramId" value="'+(id||'')+'"><div class="form-group"><label>Название *</label><input type="text" id="paramName" required></div><div class="form-group"><label>Описание</label><textarea id="paramDescription" rows="2"></textarea></div><div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById(\'paramModal\').style.display=\'none\'">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';paramModal.classList.add('active');if(id){fetch('/api/parameters').then(function(r){return r.json();}).then(function(d){var p=d.find(function(x){return x.id==id;});if(p){document.getElementById('paramName').value=p.name;document.getElementById('paramDescription').value=p.description||'';}});}document.getElementById('paramForm').onsubmit=async function(e){e.preventDefault();var id=document.getElementById('paramId').value;var body={name:document.getElementById('paramName').value.trim(),description:document.getElementById('paramDescription').value.trim()};var url=id?'/api/parameters/'+id:'/api/parameters';var res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(res.ok){paramModal.classList.remove('active');loadParams();}};}
    document.getElementById('exportParamsBtn').addEventListener('click',async function(){var r=await fetch('/api/parameters/export');var b=await r.blob();var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='parameters.xlsx';a.click();});
    document.getElementById('importParamsBtn').addEventListener('click',function(){document.getElementById('importParamsFile').click();});
    document.getElementById('importParamsFile').addEventListener('change',async function(){var fd=new FormData();fd.append('file',this.files[0]);await fetch('/api/parameters/import',{method:'POST',body:fd});loadParams();this.value='';});

    loadTemplates();loadTypes();loadParams();
})();
</script>
