<div class="page-content">
    <div class="tabs">
        <button class="tab-btn active" data-tab="templates">Компоненты шкафов</button>
        <button class="tab-btn" data-tab="types">Типы компонентов шкафов</button>
        <button class="tab-btn" data-tab="params">Параметры компонентов шкафов</button>
    </div>
    <div id="tab-content-container"></div>
</div>
<script>
(function() {
    var tabContainer = document.getElementById('tab-content-container');
    function executeScripts(container) {
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(oldScript) {
            var newScript = document.createElement('script');
            if (oldScript.src) { newScript.src = oldScript.src; newScript.async = false; }
            else { newScript.textContent = oldScript.textContent; }
            oldScript.parentNode.replaceChild(newScript, oldScript);
        });
    }
    function loadTab(tab) {
        if (!tabContainer) return;
        var file = tab === 'templates' ? 'templates-tab.html' :
                   tab === 'types' ? 'types-tab.html' :
                   tab === 'params' ? 'params-tab.html' : null;
        if (!file) return;
        tabContainer.innerHTML = '<p>Загрузка...</p>';
        fetch('/pages/components-cabinets-tabs/' + file + '?_=' + Date.now())
            .then(function(r) { return r.text(); })
            .then(function(html) {
                tabContainer.innerHTML = html;
                executeScripts(tabContainer);
                var tabContent = tabContainer.querySelector('.tab-content');
                if (tabContent) tabContent.classList.add('active');
            })
            .catch(function(err) { console.error(err); tabContainer.innerHTML = '<p>Ошибка загрузки</p>'; });
    }
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            loadTab(btn.dataset.tab);
        });
    });
    loadTab('templates');
})();
</script>
