<div class="login-container">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 15px;
      padding: 2.5rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #333;
    }
    .login-card .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      padding: 0.8rem;
      font-size: 1.1rem;
      margin-top: 1rem;
    }
  </style>

  <div class="login-card">
    <h2>Вход в систему</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginUsername" class="form-label">Имя пользователя</label>
        <input type="text" class="form-control" id="loginUsername" placeholder="Введите логин" required autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label">Пароль</label>
        <input type="password" class="form-control" id="loginPassword" placeholder="Введите пароль" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="login_btn_btn">Войти</button>
    </form>
    <div id="loginError" class="text-danger mt-3 text-center" style="display: none;"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('loginError');
      errorDiv.style.display = 'none';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        errorDiv.textContent = 'Заполните все поля';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Ошибка входа');
        }

        // Сохраняем токен и объект пользователя (необходимо для SPA)
        localStorage.setItem('token', data.token);
        try {
          const payload = JSON.parse(atob(data.token.split('.')[1]));
          const user = {
            id: payload.id,
            username: payload.username,
            email: payload.email,
            role: payload.role
          };
          localStorage.setItem('user', JSON.stringify(user));
        } catch (e) {}

        window.location.href = '/';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
      }
    });
  </script>
</div>
