<h2>Типы компонентов</h2>
<div style="margin-bottom:10px;">
  <input type="text" id="newTypeName" placeholder="Название типа">
  <button id="addTypeBtn">Добавить</button>
</div>
<div id="typesTable"></div>
<script>
(function() {
  const token = localStorage.getItem('token');
  const container = document.getElementById('typesTable');

  async function loadTypes() {
    try {
      const res = await fetch('/api/component-types', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const types = await res.json();
      let html = '<table><tr><th>Название</th><th></th></tr>';
      if (types.length === 0) html = '<p>Нет типов</p>';
      else types.forEach(t => { html += `<tr><td>${t.name}</td><td><button class="small danger delete-type-btn" data-id="${t.id}">Удалить</button></td></tr>`; });
      html += '</table>';
      container.innerHTML = html;
      container.querySelectorAll('.delete-type-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('Удалить тип?')) return;
          await fetch('/api/component-types/' + e.target.dataset.id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
          // Обновляем глобальный массив
          if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
          loadTypes();
        });
      });
    } catch(e) { container.innerHTML = '<p style="color:red;">Ошибка</p>'; }
  }

  document.getElementById('addTypeBtn').addEventListener('click', async () => {
    const name = document.getElementById('newTypeName').value.trim();
    if (!name) return alert('Введите название');
    const res = await fetch('/api/component-types', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ name })
    });
    if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
    document.getElementById('newTypeName').value = '';
    // Обновляем глобальный массив
    if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
    loadTypes();
  });

  loadTypes();
})();
</script>
