<div class="page-content">
    <h2>Производители</h2>
    <div style="margin-bottom:10px;">
        <button id="addManufacturerBtn" class="btn btn-primary" style="display:none;">Добавить производителя</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
    </div>
    <div id="manufacturersTable" style="margin-top:15px;"></div>
</div>

<div id="manufacturerModal" class="modal">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close">&times;</span>
        <h3 id="manufacturerModalTitle">Добавить производителя</h3>
        <form id="manufacturerForm">
            <input type="hidden" id="manufacturerId">
            <div class="form-group">
                <label for="manufacturerName">Название *</label>
                <input type="text" id="manufacturerName" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="manufacturerCountry">Страна</label>
                <input type="text" id="manufacturerCountry" maxlength="100">
            </div>
            <div class="form-group">
                <label for="manufacturerWebsite">Сайт</label>
                <input type="url" id="manufacturerWebsite" maxlength="255">
            </div>
            <div id="manufacturerError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;">
                <button type="button" id="manufacturerCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var token = localStorage.getItem('token');
    var user = JSON.parse(localStorage.getItem('user') || '{}');
    var isAdmin = user && user.role === 'admin';

    if (isAdmin) {
        document.getElementById('addManufacturerBtn').style.display = 'inline-block';
        document.getElementById('exportBtn').style.display = 'inline-block';
        document.getElementById('importBtn').style.display = 'inline-block';
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    // ==================== ЗАГРУЗКА ТАБЛИЦЫ ====================
    async function loadManufacturers() {
        var container = document.getElementById('manufacturersTable');
        if (!container) return;
        try {
            var res = await fetch('/api/manufacturers', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (!res.ok) throw new Error('Ошибка загрузки');
            var data = await res.json();

            if (data.length === 0) {
                container.innerHTML = '<p>Нет производителей.</p>';
                return;
            }

            var html = '<div class="table-container"><table class="data-table"><thead><tr>';
            html += '<th>ID</th><th>Название</th><th>Страна</th><th>Сайт</th>';
            if (isAdmin) html += '<th>Действия</th>';
            html += '</tr></thead><tbody>';

            data.forEach(function(m) {
                html += '<tr>';
                html += '<td>' + m.id + '</td>';
                html += '<td>' + escapeHtml(m.name) + '</td>';
                html += '<td>' + escapeHtml(m.country || '') + '</td>';
                html += '<td>' + (m.website ? '<a href="' + escapeHtml(m.website) + '" target="_blank">' + escapeHtml(m.website) + '</a>' : '') + '</td>';
                if (isAdmin) {
                    html += '<td>';
                    html += '<button class="btn btn-sm btn-edit edit-manufacturer-btn" data-id="' + m.id + '">✏️</button> ';
                    html += '<button class="btn btn-sm btn-delete delete-manufacturer-btn" data-id="' + m.id + '">🗑️</button>';
                    html += '</td>';
                }
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;

            container.querySelectorAll('.edit-manufacturer-btn').forEach(function(btn) {
                btn.addEventListener('click', function() { openManufacturerModal(this.dataset.id); });
            });
            container.querySelectorAll('.delete-manufacturer-btn').forEach(function(btn) {
                btn.addEventListener('click', async function() {
                    if (!confirm('Удалить производителя?')) return;
                    try {
                        await fetch('/api/manufacturers/' + this.dataset.id, {
                            method: 'DELETE',
                            headers: { 'Authorization': 'Bearer ' + token }
                        });
                        loadManufacturers();
                    } catch(e) { alert('Ошибка удаления'); }
                });
            });
        } catch(e) {
            container.innerHTML = '<p style="color:red;">Ошибка загрузки производителей</p>';
        }
    }

    // ==================== МОДАЛЬНОЕ ОКНО ====================
    var modal = document.getElementById('manufacturerModal');
    var modalTitle = document.getElementById('manufacturerModalTitle');
    var form = document.getElementById('manufacturerForm');
    var errorDiv = document.getElementById('manufacturerError');

    function closeModal() { modal.classList.remove('active'); }
    function openModal() { modal.classList.add('active'); }

    document.querySelector('#manufacturerModal .modal-close').addEventListener('click', closeModal);
    document.getElementById('manufacturerCancelBtn').addEventListener('click', closeModal);
    modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });

    window.openManufacturerModal = function(id) {
        errorDiv.style.display = 'none';
        form.reset();
        document.getElementById('manufacturerId').value = '';
        modalTitle.textContent = 'Добавить производителя';

        if (id) {
            modalTitle.textContent = 'Редактировать производителя';
            document.getElementById('manufacturerId').value = id;
            fetch('/api/manufacturers', {
                headers: { 'Authorization': 'Bearer ' + token }
            }).then(function(res) { return res.json(); })
              .then(function(data) {
                var m = data.find(function(item) { return item.id == id; });
                if (m) {
                    document.getElementById('manufacturerName').value = m.name || '';
                    document.getElementById('manufacturerCountry').value = m.country || '';
                    document.getElementById('manufacturerWebsite').value = m.website || '';
                }
            });
        }
        openModal();
    };

    document.getElementById('addManufacturerBtn').addEventListener('click', function() { openManufacturerModal(); });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errorDiv.style.display = 'none';

        var id = document.getElementById('manufacturerId').value;
        var name = document.getElementById('manufacturerName').value.trim();
        if (!name) {
            errorDiv.textContent = 'Название обязательно';
            errorDiv.style.display = 'block';
            return;
        }

        var body = {
            name: name,
            country: document.getElementById('manufacturerCountry').value.trim() || null,
            website: document.getElementById('manufacturerWebsite').value.trim() || null
        };

        var url = id ? '/api/manufacturers/' + id : '/api/manufacturers';
        var method = id ? 'PUT' : 'POST';

        try {
            var res = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                var data = await res.json();
                throw new Error(data.error || 'Ошибка сохранения');
            }
            closeModal();
            loadManufacturers();
        } catch(err) {
            errorDiv.textContent = err.message;
            errorDiv.style.display = 'block';
        }
    });

    // ==================== ЭКСПОРТ / ИМПОРТ ====================
    document.getElementById('exportBtn').addEventListener('click', async function() {
        try {
            var res = await fetch('/api/manufacturers/export?token=' + encodeURIComponent(token));
            if (!res.ok) { var err = await res.json(); alert(err.error || 'Ошибка экспорта'); return; }
            var blob = await res.blob();
            var url = window.URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'manufacturers.xlsx';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } catch(e) { alert('Ошибка соединения'); }
    });

    var fileInput = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', function() { fileInput.click(); });
    fileInput.addEventListener('change', async function() {
        var file = fileInput.files[0];
        if (!file) return;
        var formData = new FormData();
        formData.append('file', file);
        try {
            var res = await fetch('/api/manufacturers/import', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token },
                body: formData
            });
            var data = await res.json();
            if (!res.ok) { alert(data.error || 'Ошибка импорта'); return; }
            alert(data.message);
            loadManufacturers();
        } catch(e) { alert('Ошибка соединения'); }
        fileInput.value = '';
    });

    loadManufacturers();
})();
</script>
