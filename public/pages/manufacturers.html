<div class="page-content">
    <div style="margin-bottom:10px;">
        <button id="addManufacturerBtn" class="btn btn-primary" style="display:none;">Добавить производителя</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
    </div>
    <div id="manufacturersTable" style="margin-top:15px;"></div>
</div>

<div id="manufacturerModal" class="modal">
    <div class="modal-content" style="max-width:95vw;">
        <span class="modal-close">&times;</span>
        <h3 id="manufacturerModalTitle">Добавить производителя</h3>
        <form id="manufacturerForm">
            <input type="hidden" id="manufacturerId">
            <div class="form-group"><label for="manufacturerName">Название *</label><input type="text" id="manufacturerName" required maxlength="255"></div>
            <div class="form-group"><label for="manufacturerCountry">Страна</label><input type="text" id="manufacturerCountry" maxlength="100"></div>
            <div class="form-group"><label for="manufacturerWebsite">Сайт</label><input type="url" id="manufacturerWebsite" maxlength="255"></div>
            <div id="manufacturerError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;">
                <button type="button" id="manufacturerCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary" id="manufacturers_btn_btn">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || '{}');
    var isAdmin = user && user.role === 'admin';
    if (isAdmin) {
        document.getElementById('addManufacturerBtn').style.display = '';
        document.getElementById('exportBtn').style.display = '';
        document.getElementById('importBtn').style.display = '';
    }
    function escapeHtml(str) { var d=document.createElement('div');d.textContent=str||'';return d.innerHTML; }

    function setupDragAndDrop(tbody) {
        var dragInfo = null;
        function onMouseMove(e) {
            if (!dragInfo) return;
            var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            var target = null;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
            }
            if (target && target !== dragInfo.row) {
                var ri = rows.indexOf(dragInfo.row), ti = rows.indexOf(target);
                if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
                else tbody.insertBefore(dragInfo.row, target);
            }
        }
        function onMouseUp() {
            if (!dragInfo) return;
            dragInfo.row.style.opacity = '';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            var items = [];
            tbody.querySelectorAll('tr[data-id]').forEach(function(tr, idx) {
                var id = parseInt(tr.dataset.id);
                if (id) items.push({ id: id, position: idx });
            });
            fetch('/api/manufacturers/sort-order', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) }).catch(function(e) { console.error(e); });
            dragInfo = null;
        }

        tbody.addEventListener('mousedown', function(e) {
            var handle = e.target.closest('.drag-handle');
            if (!handle) return;
            e.preventDefault();
            var row = handle.closest('tr');
            if (!row) return;
            dragInfo = { row: row, startY: e.clientY };
            row.style.opacity = '0.5';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    async function loadManufacturers() {
        var container = document.getElementById('manufacturersTable');
        try {
            var res = await fetch('/api/manufacturers');
            var data = await res.json();
            if (!data.length) { container.innerHTML = '<p>Нет производителей.</p>'; return; }
            var html = '<div class="table-container"><table class="data-table"><thead><tr><th style="width:1%"></th><th>ID</th><th>Название</th><th>Страна</th><th>Сайт</th>';
            if (isAdmin) html += '<th>Действия</th>';
            html += '</tr></thead><tbody>';
            data.forEach(function(m) {
                html += '<tr data-id="'+m.id+'"><td class="drag-handle" style="cursor:grab;">⠿</td><td>'+m.id+'</td><td>'+escapeHtml(m.name)+'</td><td>'+escapeHtml(m.country||'')+'</td><td>'+(m.website?'<a href="'+escapeHtml(m.website)+'" target="_blank">'+escapeHtml(m.website)+'</a>':'')+'</td>';
                if (isAdmin) html += '<td><button class="btn btn-sm btn-edit" data-id="'+m.id+'">✏️</button> <button class="btn btn-sm btn-delete" data-id="'+m.id+'">🗑️</button></td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;

            var manTable = container.querySelector('table');
            if (manTable) {
                var manThead = manTable.querySelector('thead tr');
                var manTbody = manTable.querySelector('tbody');
                
                setupDragAndDrop(manTbody);

                manThead.querySelectorAll('th').forEach(function(th, idx) {
                    if (idx === 1) th.dataset.sort = 'id';
                    else if (idx === 2) th.dataset.sort = 'name';
                    else if (idx === 3) th.dataset.sort = 'country';
                });

                manThead.querySelectorAll('th[data-sort]').forEach(function(th) {
                    th.style.cursor = 'pointer';
                    th.addEventListener('click', function() {
                        var key = this.dataset.sort;
                        var s = JSON.parse(localStorage.getItem('manufacturers_sort') || '{}');
                        s.dir = s.key === key ? (s.dir === 'asc' ? 'desc' : 'asc') : 'asc';
                        s.key = key;
                        localStorage.setItem('manufacturers_sort', JSON.stringify(s));
                        
                        var rows = Array.from(manTbody.querySelectorAll('tr[data-id]'));
                        var colIdx = Array.from(manThead.querySelectorAll('th')).findIndex(function(t) { return t.dataset.sort === key; });
                        if (colIdx < 0) return;
                        rows.sort(function(a, b) {
                            var va = (a.cells[colIdx]?.textContent || '').trim();
                            var vb = (b.cells[colIdx]?.textContent || '').trim();
                            var na = parseFloat(va.replace(/,/g, '.')), nb = parseFloat(vb.replace(/,/g, '.'));
                            if (!isNaN(na) && !isNaN(nb)) return s.dir === 'asc' ? na - nb : nb - na;
                            return s.dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
                        });
                        rows.forEach(function(row) { manTbody.appendChild(row); });
                    });
                });
            }

            container.querySelectorAll('.btn-edit').forEach(function(b){b.addEventListener('click',function(){openManufacturerModal(this.dataset.id);});});
            container.querySelectorAll('.btn-delete').forEach(function(b){b.addEventListener('click',async function(){if(!confirm('Удалить?'))return;await fetch('/api/manufacturers/'+this.dataset.id,{method:'DELETE'});loadManufacturers();});});
        } catch(e) { container.innerHTML = '<p style="color:red;">Ошибка загрузки</p>'; }
    }

    var modal=document.getElementById('manufacturerModal'), form=document.getElementById('manufacturerForm'), errorDiv=document.getElementById('manufacturerError');
    document.querySelector('#manufacturerModal .modal-close').addEventListener('click',function(){modal.classList.remove('active');});
    document.getElementById('manufacturerCancelBtn').addEventListener('click',function(){modal.classList.remove('active');});
    modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('active');});

    window.openManufacturerModal = function(id) {
        errorDiv.style.display='none'; form.reset(); document.getElementById('manufacturerId').value='';
        document.getElementById('manufacturerModalTitle').textContent = id ? 'Редактировать производителя' : 'Добавить производителя';
        if (id) {
            fetch('/api/manufacturers').then(function(r){return r.json();}).then(function(data){
                var m = data.find(function(x){return x.id==id;});
                if(m){document.getElementById('manufacturerId').value=m.id;document.getElementById('manufacturerName').value=m.name||'';document.getElementById('manufacturerCountry').value=m.country||'';document.getElementById('manufacturerWebsite').value=m.website||'';}
            });
        }
        modal.classList.add('active');
    };

    document.getElementById('addManufacturerBtn').addEventListener('click',function(){openManufacturerModal();});
    form.addEventListener('submit', async function(e) {
        e.preventDefault(); errorDiv.style.display='none';
        var id=document.getElementById('manufacturerId').value, name=document.getElementById('manufacturerName').value.trim();
        if(!name){errorDiv.textContent='Название обязательно';errorDiv.style.display='block';return;}
        var body={name:name,country:document.getElementById('manufacturerCountry').value.trim()||null,website:document.getElementById('manufacturerWebsite').value.trim()||null};
        var url=id?'/api/manufacturers/'+id:'/api/manufacturers';
        var res=await fetch(url,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(res.ok){modal.classList.remove('active');loadManufacturers();}
        else{var d=await res.json();errorDiv.textContent=d.error||'Ошибка';errorDiv.style.display='block';}
    });

    document.getElementById('exportBtn').addEventListener('click', async function() {
        var res=await fetch('/api/manufacturers/export');
        var blob=await res.blob();var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manufacturers.xlsx';a.click();
    });
    document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('importFile').click();});
    document.getElementById('importFile').addEventListener('change',async function(){
        var fd=new FormData();fd.append('file',this.files[0]);
        await fetch('/api/manufacturers/import',{method:'POST',body:fd});
        loadManufacturers();this.value='';
    });

    loadManufacturers();
})();
</script>
