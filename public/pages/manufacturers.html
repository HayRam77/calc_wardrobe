<div class="page-content">
    <div class="page-header">
        <h2>Производители</h2>
        <button id="addManufacturerBtn" class="btn btn-primary" style="display:none;">Добавить производителя</button>
    </div>

    <div id="manufacturersTableContainer" class="table-container">
        <table id="manufacturersTable" class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th class="actions-col" style="display:none;">Действия</th>
                </tr>
            </thead>
            <tbody id="manufacturersTableBody">
                <tr><td colspan="3" class="loading">Загрузка...</td></tr>
            </tbody>
        </table>
    </div>
    <div id="manufacturersEmpty" class="empty-state" style="display:none;">
        <p>Список производителей пуст</p>
    </div>
</div>

<!-- Модальное окно для добавления/редактирования -->
<div id="manufacturerModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h3 id="manufacturerModalTitle">Добавить производителя</h3>
        <form id="manufacturerForm">
            <input type="hidden" id="manufacturerId">
            <div class="form-group">
                <label for="manufacturerName">Название</label>
                <input type="text" id="manufacturerName" required maxlength="255" placeholder="Введите название">
            </div>
            <div id="manufacturerError" class="error-message" style="display:none;"></div>
            <div class="form-actions">
                <button type="button" id="manufacturerCancelBtn" class="btn btn-secondary">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    // Используем глобальную API_BASE из index.html
    const manufacturersTableBody = document.getElementById('manufacturersTableBody');
    const manufacturersEmpty = document.getElementById('manufacturersEmpty');
    const addBtn = document.getElementById('addManufacturerBtn');
    const actionsCols = document.querySelectorAll('#manufacturersTable .actions-col');
    const modal = document.getElementById('manufacturerModal');
    const modalTitle = document.getElementById('manufacturerModalTitle');
    const form = document.getElementById('manufacturerForm');
    const manufacturerId = document.getElementById('manufacturerId');
    const manufacturerName = document.getElementById('manufacturerName');
    const manufacturerError = document.getElementById('manufacturerError');
    const cancelBtn = document.getElementById('manufacturerCancelBtn');
    const closeBtn = document.querySelector('#manufacturerModal .modal-close');

    let manufacturers = [];

    // Проверка на админа
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const isAdmin = user && user.role === 'admin';

    if (isAdmin) {
        addBtn.style.display = 'inline-block';
        actionsCols.forEach(col => col.style.display = '');
    }

    // Загрузка списка
    async function loadManufacturers() {
        try {
            const token = localStorage.getItem('token');
            if (!token) {
                manufacturersTableBody.innerHTML = '<tr><td colspan="3">Необходимо авторизоваться</td></tr>';
                return;
            }

            const response = await fetch(API_BASE + '/manufacturers', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) throw new Error('Ошибка загрузки');

            manufacturers = await response.json();
            renderTable();
        } catch (err) {
            console.error(err);
            manufacturersTableBody.innerHTML = '<tr><td colspan="3" class="error">Ошибка загрузки данных</td></tr>';
        }
    }

    // Рендер таблицы
    function renderTable() {
        if (manufacturers.length === 0) {
            document.getElementById('manufacturersTableContainer').style.display = 'none';
            manufacturersEmpty.style.display = 'block';
            return;
        }
        document.getElementById('manufacturersTableContainer').style.display = '';
        manufacturersEmpty.style.display = 'none';

        manufacturersTableBody.innerHTML = manufacturers.map(m => `
            <tr>
                <td>${m.id}</td>
                <td>${escapeHtml(m.name)}</td>
                ${isAdmin ? `
                <td class="actions-col">
                    <button class="btn btn-sm btn-edit" onclick="editManufacturer(${m.id})">✏️</button>
                    <button class="btn btn-sm btn-delete" onclick="deleteManufacturer(${m.id})">🗑️</button>
                </td>` : ''}
            </tr>
        `).join('');
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // Открытие модалки для добавления
    addBtn.addEventListener('click', () => {
        manufacturerId.value = '';
        manufacturerName.value = '';
        manufacturerError.style.display = 'none';
        modalTitle.textContent = 'Добавить производителя';
        modal.style.display = 'flex';
        manufacturerName.focus();
    });

    // Закрытие модалки
    function closeModal() {
        modal.style.display = 'none';
    }
    cancelBtn.addEventListener('click', closeModal);
    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // Отправка формы
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        manufacturerError.style.display = 'none';

        const id = manufacturerId.value;
        const name = manufacturerName.value.trim();

        if (!name) {
            showError('Введите название');
            return;
        }

        try {
            const token = localStorage.getItem('token');
            const url = id 
                ? API_BASE + '/manufacturers/' + id 
                : API_BASE + '/manufacturers';
            const method = id ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ name })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Ошибка сохранения');
            }

            closeModal();
            await loadManufacturers();
        } catch (err) {
            showError(err.message);
        }
    });

    function showError(msg) {
        manufacturerError.textContent = msg;
        manufacturerError.style.display = 'block';
    }

    // Глобальные функции для кнопок в таблице
    window.editManufacturer = function(id) {
        const m = manufacturers.find(x => x.id === id);
        if (!m) return;
        manufacturerId.value = m.id;
        manufacturerName.value = m.name;
        manufacturerError.style.display = 'none';
        modalTitle.textContent = 'Редактировать производителя';
        modal.style.display = 'flex';
        manufacturerName.focus();
    };

    window.deleteManufacturer = async function(id) {
        const m = manufacturers.find(x => x.id === id);
        if (!m) return;
        if (!confirm('Удалить производителя "' + m.name + '"?')) return;

        try {
            const token = localStorage.getItem('token');
            const response = await fetch(API_BASE + '/manufacturers/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.error || 'Ошибка удаления');
            }

            await loadManufacturers();
        } catch (err) {
            alert(err.message);
        }
    };

    // Загрузка при открытии страницы
    loadManufacturers();
})();
</script>
