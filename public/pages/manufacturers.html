<div class="page-container">
    <h2>Производители</h2>
    
    <div class="toolbar" style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
        <button id="addBtn" style="background: #1a5f7a; color: white;">+ Добавить</button>
        <button id="exportBtn" style="background: #28a745; color: white;">📥 Экспорт Excel</button>
        <label style="background: #ffc107; color: black; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
            📤 Импорт Excel
            <input type="file" id="importFile" accept=".xlsx,.xls" style="display: none;">
        </label>
    </div>
    
    <table id="manufacturersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Страна</th>
                <th>Сайт</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <!-- Модальное окно -->
    <div class="modal" id="manufacturerModal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить производителя</h3>
            <form id="manufacturerForm">
                <input type="hidden" id="manufacturerId">
                <label>Название: <input type="text" id="manufacturerName" required style="width: 100%; padding: 8px; margin: 5px 0;"></label>
                <label>Страна: <input type="text" id="manufacturerCountry" style="width: 100%; padding: 8px; margin: 5px 0;"></label>
                <label>Сайт: <input type="text" id="manufacturerWebsite" style="width: 100%; padding: 8px; margin: 5px 0;"></label>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button type="submit" style="background: #1a5f7a; color: white;">Сохранить</button>
                    <button type="button" onclick="closeManufacturerModal()" style="background: #6c757d; color: white;">Отмена</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
var token = localStorage.getItem('token');
var currentUser = JSON.parse(localStorage.getItem('user') || 'null');

async function loadManufacturers() {
    try {
        var response = await fetch('/api/manufacturers', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        var data = await response.json();
        var tbody = document.querySelector('#manufacturersTable tbody');
        tbody.innerHTML = '';
        data.forEach(function(m) {
            tbody.innerHTML += '<tr>' +
                '<td>' + m.id + '</td>' +
                '<td>' + m.name + '</td>' +
                '<td>' + (m.country || '') + '</td>' +
                '<td>' + (m.website ? '<a href="' + m.website + '" target="_blank">' + m.website + '</a>' : '') + '</td>' +
                '<td>' +
                    '<button onclick="editManufacturer(' + m.id + ')" style="background: #17a2b8; color: white; margin-right: 5px;">✎</button>' +
                    '<button onclick="deleteManufacturer(' + m.id + ')" style="background: #dc3545; color: white;">✕</button>' +
                '</td>' +
            '</tr>';
        });
    } catch (err) { console.error(err); }
}

function closeManufacturerModal() {
    document.getElementById('manufacturerModal').classList.remove('active');
}

document.getElementById('addBtn').addEventListener('click', function() {
    document.getElementById('modalTitle').textContent = 'Добавить производителя';
    document.getElementById('manufacturerId').value = '';
    document.getElementById('manufacturerName').value = '';
    document.getElementById('manufacturerCountry').value = '';
    document.getElementById('manufacturerWebsite').value = '';
    document.getElementById('manufacturerModal').classList.add('active');
});

async function editManufacturer(id) {
    var response = await fetch('/api/manufacturers', {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    var data = await response.json();
    var m = data.find(function(item) { return item.id === id; });
    if (m) {
        document.getElementById('modalTitle').textContent = 'Редактировать производителя';
        document.getElementById('manufacturerId').value = m.id;
        document.getElementById('manufacturerName').value = m.name;
        document.getElementById('manufacturerCountry').value = m.country || '';
        document.getElementById('manufacturerWebsite').value = m.website || '';
        document.getElementById('manufacturerModal').classList.add('active');
    }
}

document.getElementById('manufacturerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    var id = document.getElementById('manufacturerId').value;
    var name = document.getElementById('manufacturerName').value;
    var country = document.getElementById('manufacturerCountry').value;
    var website = document.getElementById('manufacturerWebsite').value;
    
    var url = '/api/manufacturers';
    var method = 'POST';
    if (id) {
        url += '/' + id;
        method = 'PUT';
    }
    
    var response = await fetch(url, {
        method: method,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ name: name, country: country, website: website })
    });
    
    if (response.ok) {
        closeManufacturerModal();
        loadManufacturers();
    } else {
        var err = await response.json();
        alert(err.error);
    }
});

async function deleteManufacturer(id) {
    if (!confirm('Удалить производителя?')) return;
    await fetch('/api/manufacturers/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
    });
    loadManufacturers();
}

// Экспорт
document.getElementById('exportBtn').addEventListener('click', function() {
    window.open('/api/manufacturers/export?token=' + token);
});

// Импорт
document.getElementById('importFile').addEventListener('change', async function(e) {
    var file = e.target.files[0];
    if (!file) return;
    
    var formData = new FormData();
    formData.append('file', file);
    
    var response = await fetch('/api/manufacturers/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
    });
    
    var data = await response.json();
    alert(data.message || data.error);
    loadManufacturers();
    e.target.value = '';
});

loadManufacturers();
</script>
