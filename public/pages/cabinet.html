<div class="page-content">
    <div id="cabinetContent" style="max-width:900px;">
        <p>Загрузка шкафа...</p>
    </div>
</div>

<div id="systemModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close" onclick="document.getElementById('systemModal').style.display='none'">&times;</span>
        <h3>Добавить систему</h3>
        <form id="systemForm">
            <div class="form-group">
                <label for="systemSelect">Система *</label>
                <select id="systemSelect" required><option value="">-- выберите --</option></select>
                <div class="new-system-row" style="display:none;margin-top:5px;display:flex;gap:5px;">
                    <input type="text" class="new-system-name" placeholder="Название новой системы" style="flex:1;">
                    <button type="button" class="btn btn-sm btn-primary save-new-system-btn" id="cabinet_save_btn">✓</button>
                </div>
            </div>
            <div id="systemError" class="error-message" style="display:none;"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('systemModal').style.display='none'" id="cabinet_btn_btn">Отмена</button>
                <button type="submit" class="btn btn-primary" id="cabinet_btn_btn_1">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<div id="blockModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close" onclick="document.getElementById('blockModal').style.display='none'">&times;</span>
        <h3>Добавить компонент</h3>
        <form id="blockForm">
            <div class="form-group"><label for="blockTemplate">Компонент *</label><select id="blockTemplate" required></select></div>
            <div class="form-group"><label for="blockQuantity">Количество</label><input type="number" id="blockQuantity" value="1" min="1"></div>
            <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById('blockModal').style.display='none'" id="cabinet_btn_btn_2">Отмена</button><button type="submit" class="btn btn-primary" id="cabinet_btn_btn_3">Добавить</button></div>
        </form>
    </div>
</div>

<script>
(function() {
    var cabinetId = window.pageParam; window.cabinetId = cabinetId; window.cabinetId = cabinetId; window.cabinetId = cabinetId; window.cabinetId = cabinetId; window.cabinetId = cabinetId; window.cabinetId = cabinetId; window.cabinetId = cabinetId;
    if (!cabinetId) { document.getElementById('cabinetContent').innerHTML = '<p>Шкаф не найден</p>'; return; }
    function esc(str) { var d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

    fetch('/api/cabinets/' + cabinetId).then(function(res) { return res.json(); }).then(function(cabinet) {
        document.querySelector('.page-title').textContent = 'Шкаф: ' + cabinet.name;
        var html = '<div class="module-box"><h3>Системы шкафа</h3><div id="cabinetSystems">Загрузка...</div><button id="addSystemBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить систему</button></div>';
        
        html += '<div class="module-box"><h3>Компоненты систем</h3><div id="cabinetSystemComponents">Загрузка...</div><button id="addSystemCompBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить компонент системы</button></div>';
        
        html += '<div class="module-box"><h3>Компоненты шкафа</h3><div id="cabinetBlocks">Загрузка...</div><button id="addBlockBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить компонент шкафа</button></div>';
        
        document.getElementById('cabinetContent').innerHTML = html;
        loadSystems(); loadSystemComponents();
        setTimeout(function(){ window.loadBlocks(); }, 100);
        document.getElementById('addSystemBtn').addEventListener('click', function(){ openSystemModal(); });
        document.getElementById('addSystemCompBtn').addEventListener('click', openSystemCompModal);
        document.getElementById('addBlockBtn').addEventListener('click', window.openBlockModal);
    });

    function loadSystems() {
        fetch('/api/cabinets/' + cabinetId + '/systems').then(function(r){return r.json();}).then(function(data){
            var c = document.getElementById('cabinetSystems');
            if (!data.length) { c.innerHTML = '<p>Нет систем</p>'; return; }
            var h = '<div class="table-container"><table class="data-table"><tr><th>Система</th><th>Действия</th></tr>';
            data.forEach(function(s){h += '<tr><td>'+esc(s.system_name||'')+'</td><td><button class="btn btn-sm btn-edit" onclick="editSystem('+s.id+')" id="cabinet_edit_btn">✏️</button> <button class="btn btn-sm btn-delete" onclick="delSystem('+s.id+')" id="cabinet_del_btn">🗑️</button></td></tr>';});
            h += '</table></div>'; c.innerHTML = h;
        });
    }

    function openSystemModal(sysId) {
        fetch('/api/systems').then(function(r){return r.json();}).then(function(data){
            var sel = document.getElementById('systemSelect');
            sel.innerHTML = '<option value="">-- выберите --</option>';
            if (data.length) {
                sel.innerHTML += '<optgroup label="Существующие">';
                data.forEach(function(s){ sel.innerHTML += '<option value="'+s.id+'">'+esc(s.name)+'</option>'; });
                sel.innerHTML += '</optgroup>';
            }
            sel.innerHTML += '<optgroup label="Добавить"><option value="__new__">+ новая система</option></optgroup>';
            document.getElementById('systemForm').dataset.editId = '';
            document.querySelector('.new-system-row').style.display = 'none';
            if (sysId) {
                fetch('/api/cabinets/' + cabinetId + '/systems').then(function(r){return r.json();}).then(function(sysData){
                    var sys = sysData.find(function(s){return s.id === sysId;});
                    if (sys) sel.value = sys.system_id;
                    document.getElementById('systemForm').dataset.editId = sysId;
                });
            }
            document.getElementById('systemModal').style.display = 'block';
            sel.onchange = function() { document.querySelector('.new-system-row').style.display = sel.value === '__new__' ? 'flex' : 'none'; };
            document.querySelector('.save-new-system-btn').onclick = function() {
                var name = document.querySelector('.new-system-name').value.trim();
                if (!name) { alert('Введите название'); return; }
                fetch('/api/systems', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})})
                .then(function(r){return r.json();}).then(function(ns){
                    sel.innerHTML += '<option value="'+ns.id+'" selected>'+esc(ns.name)+'</option>';
                    sel.value = ns.id;
                    document.querySelector('.new-system-row').style.display = 'none';
                });
            };
        });
    }

    document.getElementById('systemForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var system_id = document.getElementById('systemSelect').value;
        if (!system_id || system_id === '__new__') { alert('Выберите или создайте систему'); return; }
        var editId = document.getElementById('systemForm').dataset.editId;
        var url = editId ? '/api/cabinets/' + cabinetId + '/systems/' + editId : '/api/cabinets/' + cabinetId + '/systems';
        fetch(url, {method: editId ? 'PUT' : 'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({system_id: parseInt(system_id)})})
        .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});document.getElementById('systemModal').style.display='none';loadSystems();})
        .catch(function(e){alert(e.message);});
    });

    window.editSystem = function(id) { openSystemModal(id); };
    window.delSystem = function(id) { fetch('/api/cabinets/' + cabinetId + '/systems/' + id, {method:'DELETE'}).then(function(){loadSystems();loadSystemComponents();}); };

    // Компоненты систем — группировка по системам
    function loadSystemComponents() {
        var container = document.getElementById('cabinetSystemComponents');
        fetch('/api/cabinets/' + cabinetId + '/systems').then(function(r){return r.json();}).then(function(systems){
            if (!systems.length) { container.innerHTML = '<p>Нет систем</p>'; return; }
            var html = '';
            var done = 0;
            systems.forEach(function(sys){
                fetch('/api/systems/' + sys.system_id).then(function(r){return r.json();}).then(function(sysData){
                    html += '<h4>'+esc(sys.system_name||'Система')+'</h4>';
                    if (sysData.components && sysData.components.length) {
                        html += '<div class="table-container"><table class="data-table"><tr><th>Компонент</th><th>Тип</th><th>Артикул</th><th>Кол-во</th><th>Действия</th></tr>';
                        sysData.components.forEach(function(c){ html += '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.type_name||'')+'</td><td>'+esc(c.article||'')+'</td><td>'+c.quantity+'</td><td><button class="btn btn-sm btn-edit" onclick="editSysComp('+c.id+')" id="cabinet_edit_btn_1">✏️</button> <button class="btn btn-sm btn-delete" onclick="delSysComp('+c.id+')" id="cabinet_del_btn_1">🗑️</button></td></tr>'; });
                        html += '</table></div>';
                    } else { html += '<p>Нет компонентов</p>'; }
                    html += '<br>';
                    done++;
                    if (done === systems.length) container.innerHTML = html;
                });
            });
        });
    }

    window.openSystemCompModal = function() {
        if (typeof SystemCompModal !== 'undefined') {
            SystemCompModal.open(null, function() { loadSystemComponents(); });
        } else { setTimeout(window.openSystemCompModal, 200); }
    }

    
    
    window.openBlockModal = function() {
        if (typeof BlockTemplateModal !== 'undefined') {
            BlockTemplateModal.open(function(blockId){
                if (blockId) {
                    fetch('/api/cabinets/'+window.cabinetId+'/blocks', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({template_id:blockId,quantity:1})})
                    .then(function(r){if(!r.ok)return r.json().then(function(d){throw new Error(d.message);});console.log('Добавлено, обновляем...'); setTimeout(function(){ window.loadBlocks(); }, 500);})
                    .catch(function(e){alert(e.message);});
                }
            });
        } else { setTimeout(function(){ openBlockModal(); }, 200); }
    }

    // blockForm больше не используется

    window.delBlock = function(id) { fetch('/api/cabinets/'+cabinetId+'/blocks/'+id,{method:'DELETE'}).then(loadBlocks); };
    window.editSysComp = function(linkId) {
        fetch('/api/systems/link/'+linkId).then(function(r){return r.json();}).then(function(link){
            if (link && link.component_id) {
                SystemCompModal.open(link.component_id, function(){ loadSystemComponents(); });
            }
        });
    };
    window.delSysComp = function(linkId) {
        if (!confirm('Удалить компонент из системы?')) return;
        fetch('/api/systems/link/'+linkId, {method:'DELETE'}).then(function(){loadSystemComponents();});
    };
    
    
    window.editBlockQuantity = function(blockId) {
        var newQty = prompt('Новое количество:');
        if (!newQty || isNaN(newQty) || parseInt(newQty) < 1) return;
        fetch('/api/cabinets/' + window.cabinetId + '/blocks/' + blockId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({quantity: parseInt(newQty)})
        })
        .then(function(r){
            if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
            // Обновляем таблицу через HTML-фрагмент
            fetch('/api/cabinets/' + window.cabinetId + '/blocks/html')
                .then(function(r){ return r.text(); })
                .then(function(html){ document.getElementById('cabinetBlocks').innerHTML = html; });
        })
        .catch(function(e){ alert(e.message); });
    };


    window.editSysComp = function(linkId) {
        fetch('/api/systems/link/'+linkId).then(function(r){return r.json();}).then(function(link){
            if (link && link.component_id) {
                SystemCompModal.open(link.component_id, function(){ loadSystemComponents(); });
            }
        });
    };
    window.delSysComp = function(linkId) {
        if (!confirm('Удалить компонент из системы?')) return;
        fetch('/api/systems/link/'+linkId, {method:'DELETE'}).then(function(){loadSystemComponents();});
    };
    
    window.loadBlocks = function() {
        var container = document.getElementById('cabinetBlocks');
        if (!container) return;
        fetch('/api/cabinets/' + window.cabinetId + '/blocks/html')
            .then(function(r){ return r.text(); })
            .then(function(html){ container.innerHTML = html; })
            .catch(function(e){ console.error(e); });
    };

window.pageInit = function() {};

})();
</script>
