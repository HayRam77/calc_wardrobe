<div class="page-content">
    <div id="cabinetContent" style="max-width:1920px;">
        <p>Загрузка шкафа...</p>
    </div>
</div>

<div id="systemModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95vw;">
        <span class="modal-close" onclick="document.getElementById('systemModal').style.display='none'">&times;</span>
        <h3>Добавить систему</h3>
        <form id="systemForm">
            <div class="form-group">
                <label for="systemSelect">Система *</label>
                <select id="systemSelect" required><option value="">-- выберите --</option></select>
                <div class="new-system-row" style="display:none;margin-top:5px;gap:5px;">
                    <input type="text" class="new-system-name" placeholder="Название новой системы" style="flex:1;">
                    <button type="button" class="btn btn-sm btn-primary save-new-system-btn">✓</button>
                </div>
            </div>
            <div class="form-group">
                <label for="systemDescription">Описание</label>
                <textarea id="systemDescription" rows="2" placeholder="Описание системы в шкафу"></textarea>
            </div>
            <div class="form-group">
                <label for="cabinetSelect">Шкаф</label>
                <select id="cabinetSelect"><option value="">-- текущий шкаф --</option></select>
            </div>
            <div id="systemError" class="error-message" style="display:none;"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('systemModal').style.display='none'">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<div id="blockModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95vw;">
        <span class="modal-close" onclick="document.getElementById('blockModal').style.display='none'">&times;</span>
        <h3>Добавить компонент</h3>
        <form id="blockForm">
            <div class="form-group"><label for="blockTemplate">Компонент *</label><select id="blockTemplate" required></select></div>
            <div class="form-group"><label for="blockQuantity">Количество</label><input type="number" id="blockQuantity" value="1" min="1"></div>
            <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="document.getElementById('blockModal').style.display='none'">Отмена</button><button type="submit" class="btn btn-primary">Добавить</button></div>
        </form>
    </div>
</div>

<div id="attachComponentModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:95vw;">
        <span class="modal-close" onclick="document.getElementById('attachComponentModal').style.display='none'">&times;</span>
        <h3 id="attachComponentModalTitle">Привязать компонент к системе</h3>
        <form id="attachComponentForm">
            <div class="form-group">
                <label for="attachComponentSelect">Компонент *</label>
                <select id="attachComponentSelect" required>
                    <option value="">-- выберите компонент --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="attachComponentQuantity">Количество *</label>
                <input type="number" id="attachComponentQuantity" value="1" min="1" required>
            </div>
            <div id="attachComponentError" class="error-message" style="display:none;"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('attachComponentModal').style.display='none'">Отмена</button>
                <button type="submit" class="btn btn-primary">Привязать</button>
            </div>
        </form>
    </div>
</div>

<div id="copySystemModal" class="modal" style="display:none;">
  <div class="modal-content" style="max-width:500px;">
    <span class="modal-close" onclick="document.getElementById('copySystemModal').style.display='none'">&times;</span>
    <h3>Копировать компонент в другую систему</h3>
    <form id="copySystemForm">
      <div class="form-group">
        <label for="copySystemSelect">Целевая система *</label>
        <select id="copySystemSelect" required><option value="">-- выберите --</option></select>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('copySystemModal').style.display='none'">Отмена</button>
        <button type="submit" class="btn btn-primary">Копировать</button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
    var cabinetId = window.pageParam;
    window.cabinetId = cabinetId;
    if (!cabinetId) { document.getElementById('cabinetContent').innerHTML = '<p>Шкаф не найден</p>'; return; }

    function esc(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }

    function setupDragAndDrop(tbody, tableName, onComplete) {
        var dragInfo = null;

        function onMouseMove(e) {
            if (!dragInfo) return;
            var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            var target = null;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
            }
            if (target && target !== dragInfo.row) {
                var ri = rows.indexOf(dragInfo.row);
                var ti = rows.indexOf(target);
                if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
                else tbody.insertBefore(dragInfo.row, target);
            }
        }

        function onMouseUp() {
            if (!dragInfo) return;
            dragInfo.row.style.opacity = '';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            var ids = Array.from(tbody.querySelectorAll('tr[data-id]')).map(function(tr) {
                return parseInt(tr.dataset.id);
            }).filter(function(v) { return !isNaN(v); });

            if (tableName) {
                fetch('/api/table-sort/' + tableName, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sort_order: ids })
                }).catch(function(e) { console.error('Ошибка сохранения порядка:', e); });
            }

            if (onComplete) onComplete(ids);
            dragInfo = null;
        }

        tbody.addEventListener('mousedown', function(e) {
            var handle = e.target.closest('.drag-handle');
            if (!handle) return;
            e.preventDefault();
            var row = handle.closest('tr');
            if (!row) return;
            dragInfo = { row: row, startY: e.clientY };
            row.style.opacity = '0.5';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    fetch('/api/cabinets/' + cabinetId)
        .then(function(res) { return res.json(); })
        .then(function(cabinet) {
            document.querySelector('.page-title').textContent = 'Шкаф: ' + cabinet.name;

            var html = '<div class="cabinet-tabs">';
            html += '<div class="tabs">';
            html += '<button class="tab-btn active" data-tab="config">Конфигурация шкафа</button>';
            html += '<button class="tab-btn" data-tab="calculation">Калькуляция шкафа</button>';
            html += '<button class="tab-btn" data-tab="pricing">Расценки шкафа</button>';
            html += '</div>';

            html += '<div class="tab-content active" id="tab-config"><div style="margin-bottom:10px;text-align:right;"><button class="btn btn-primary" onclick="exportConfigToPDF()">📄 Экспорт PDF</button></div>';
            html += '<div class="module-box"><h3>Системы шкафа</h3><div id="cabinetSystems">Загрузка...</div><button id="addSystemBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить систему</button></div>';
            html += '<div class="module-box"><h3>Компоненты систем</h3><div id="cabinetSystemComponents">Загрузка...</div></div>';
            html += '<div class="module-box"><h3>Компоненты шкафа</h3><div id="cabinetBlocks">Загрузка...</div><button id="addBlockBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить компонент шкафа</button></div>';
            html += '<div class="module-box"><h3>Материалы шкафа</h3><div id="cabinetMaterials">Загрузка...</div><button id="addMaterialToCabinetBtn" class="btn btn-primary btn-sm" style="margin-top:10px;">+ Добавить материал</button></div>';
            html += '</div>';

            html += '<div class="tab-content" id="tab-calculation"><div style="margin-bottom:10px;text-align:right;"><button class="btn btn-primary" onclick="exportCalcToPDF()">📄 Экспорт PDF</button></div><div id="cabinetCalculation">Загрузка...</div></div>';
            html += '</div>';

            html += '<div class="tab-content" id="tab-pricing">';
            html += '<div style="padding:20px;text-align:center;color:#666;">';
            html += '<h3 style="color:#1a5f7a;">Расценки шкафа</h3>';
            html += '<p>Страница в разработке. Здесь будут отображаться расценки шкафа.</p>';
            html += '</div>';
            html += '</div>';

            html += '</div>';

            document.getElementById('cabinetContent').innerHTML = html;

            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                    document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                    this.classList.add('active');
                    var target = document.getElementById('tab-' + this.dataset.tab);
                    if (target) target.classList.add('active');
                });
            });

            refreshAllData();

            document.getElementById('addSystemBtn').addEventListener('click', function(){ openSystemModal(); });
            document.getElementById('addBlockBtn').addEventListener('click', window.openBlockModal);
            document.getElementById('addMaterialToCabinetBtn').addEventListener('click', openAddMaterialToCabinet);
        });

    function refreshAllData() {
        loadSystems();
        loadSystemComponents();
        window.loadBlocks();
        window.loadCabinetMaterials();
        loadCabinetCalculation();
    }

    function loadSystems() {
        var container = document.getElementById('cabinetSystems');
        container.innerHTML = '';

        var table = document.createElement('table');
        table.className = 'data-table';
        var thead = document.createElement('thead');
        thead.innerHTML = '<tr><th style="width:1%"></th><th data-sort="id" style="width:50px;text-align:center;">ID</th><th data-sort="system_name">Система</th>' +
            '<th data-sort="page" style="position:relative;">Страница<span class="filter-icon" data-col="page" style="cursor:pointer;font-size:14px;margin-left:4px;">⚙</span></th>' +
            '<th data-sort="installation" style="position:relative;">Установка<span class="filter-icon" data-col="installation" style="cursor:pointer;font-size:14px;margin-left:4px;">⚙</span></th>' +
            '<th data-sort="description">Описание</th><th data-sort="room">Помещение</th><th>Действия</th></tr>';
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        table.appendChild(tbody);

        container.appendChild(table);

        Promise.all([
            fetch('/api/cabinets/' + cabinetId + '/systems').then(function(r){ return r.json(); }),
            fetch('/api/table-sort/cabinet_systems').then(function(r){ return r.json(); }).catch(function(){ return {}; })
        ]).then(function(results) {
            var data = results[0];
            var saved = results[1] || {};

            if (!data.length) {
                container.innerHTML = '<p>Нет систем</p>';
                return;
            }

            var filterData = saved.filter_data || {};

            if (saved.sort_order && saved.sort_order.length) {
                var orderMap = {};
                saved.sort_order.forEach(function(id, idx) { orderMap[id] = idx; });
                data.sort(function(a, b) {
                    var ia = orderMap.hasOwnProperty(a.id) ? orderMap[a.id] : 999999;
                    var ib = orderMap.hasOwnProperty(b.id) ? orderMap[b.id] : 999999;
                    return ia - ib;
                });
            }

            data.forEach(function(s) {
                var tr = document.createElement('tr');
                tr.setAttribute('data-id', s.id);
                tr.setAttribute('data-system-id', s.system_id);
                tr.innerHTML = '<td class="drag-handle" style="cursor:grab;">\u282F</td>' +
                    '<td style="text-align:center;">' + s.id + '</td>' +
                    '<td><strong>' + esc(s.system_name || '') + '</strong></td>' +
                    '<td>' + esc(s.page || '') + '</td>' +
                    '<td>' + esc(s.installation || '') + '</td>' +
                    '<td>' + esc(s.description || '') + '</td>' +
                    '<td>' + esc(s.room || '') + '</td>' +
                    '<td><button class="btn btn-sm btn-edit" onclick="editSystem(' + s.id + ')">\u270F\uFE0F</button> ' +
                    '<button class="btn btn-sm btn-copy" onclick="copySystemTo(' + s.system_id + ')">\uD83D\uDCCB</button> ' +
                    '<button class="btn btn-sm btn-delete" onclick="delSystem(' + s.id + ')">\uD83D\uDDD1\uFE0F</button></td>';
                tbody.appendChild(tr);
            });

            Object.keys(filterData).forEach(function(col) {
                var selectedValues = filterData[col] || [];
                if (selectedValues.length > 0) {
                    tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
                        var colIdx = Array.from(thead.querySelectorAll('th')).findIndex(function(th) { return th.dataset.sort === col; });
                        var cellValue = (tr.cells[colIdx]?.textContent || '').trim() || '-';
                        if (selectedValues.indexOf(cellValue) < 0) {
                            tr.style.display = 'none';
                        }
                    });
                    var icon = thead.querySelector('.filter-icon[data-col="' + col + '"]');
                    if (icon) icon.textContent = '⚙️';
                }
            });

            setupDragAndDrop(tbody, 'cabinet_systems', function() {
                loadSystemComponents();
            });

            thead.querySelectorAll('.filter-icon').forEach(function(icon) {
                icon.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var col = icon.dataset.col;
                    var colIdx = Array.from(thead.querySelectorAll('th')).findIndex(function(th) { return th.dataset.sort === col; });
                    var values = {};
                    tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
                        var v = (tr.cells[colIdx]?.textContent || '').trim() || '-';
                        values[v] = 1;
                    });

                    var selectedValues = filterData[col] || [];

                    var modal = document.createElement('div');
                    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;justify-content:center;align-items:center;';
                    modal.innerHTML = '<div style="background:#fff;border-radius:8px;padding:20px;max-width:400px;max-height:80vh;overflow-y:auto;"><h3 style="margin-top:0;">Фильтр: ' + col + '</h3><div id="fc_cab_sys_' + col + '"></div><div style="margin-top:15px;display:flex;gap:10px;"><button class="btn-sel-all" style="padding:6px 12px;background:#e0e0e0;border:none;border-radius:4px;cursor:pointer;">Выбрать все</button><button class="btn-desel-all" style="padding:6px 12px;background:#e0e0e0;border:none;border-radius:4px;cursor:pointer;">Снять все</button><button class="btn-close-f" style="padding:8px 16px;background:#1a5f7a;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-left:auto;">Закрыть</button></div></div>';
                    document.body.appendChild(modal);

                    var content = modal.querySelector('#fc_cab_sys_' + col);
                    content.innerHTML = Object.keys(values).sort().map(function(v) {
                        var ch = selectedValues.indexOf(v) >= 0 ? ' checked' : '';
                        return '<label style="display:block;font-size:13px;cursor:pointer;white-space:nowrap;"><input type="checkbox" class="f-cb" value="' + v.replace(/"/g, '&quot;') + '"' + ch + '> ' + v + '</label>';
                    }).join('');

                    modal.querySelector('.btn-close-f').addEventListener('click', function() {
                        var newSelected = [];
                        content.querySelectorAll('.f-cb:checked').forEach(function(cb) { newSelected.push(cb.value); });
                        filterData[col] = newSelected;
                        icon.textContent = newSelected.length > 0 ? '⚙️' : '⚙';

                        tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
                            var cellValue = (tr.cells[colIdx]?.textContent || '').trim() || '-';
                            if (newSelected.length > 0 && newSelected.indexOf(cellValue) < 0) {
                                tr.style.display = 'none';
                            } else {
                                tr.style.display = '';
                            }
                        });

                        fetch('/api/table-sort/cabinet_systems', {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filter_data: filterData })
                        }).catch(function(err) { console.error(err); });

                        modal.remove();
                    });

                    modal.querySelector('.btn-sel-all').onclick = function() { content.querySelectorAll('.f-cb').forEach(function(cb) { cb.checked = true; }); };
                    modal.querySelector('.btn-desel-all').onclick = function() { content.querySelectorAll('.f-cb').forEach(function(cb) { cb.checked = false; }); };
                    modal.onclick = function(ev) { if (ev.target === modal) modal.remove(); };
                });
            });

            thead.addEventListener('click', function(e) {
                var th = e.target.closest('th[data-sort]');
                if (!th || e.target.closest('.filter-icon')) return;
                e.stopPropagation();

                var key = th.dataset.sort;
                var currentDir = th.dataset.sortDir || 'asc';
                var newDir = (currentDir === 'asc') ? 'desc' : 'asc';

                thead.querySelectorAll('th[data-sort]').forEach(function(t) { t.dataset.sortDir = ''; });
                th.dataset.sortDir = newDir;

                var allTh = Array.from(thead.querySelectorAll('th'));
                var colIdx = allTh.indexOf(th);

                var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
                rows.sort(function(a, b) {
                    var va = (a.cells[colIdx]?.textContent || '').trim();
                    var vb = (b.cells[colIdx]?.textContent || '').trim();
                    var na = parseFloat(va);
                    var nb = parseFloat(vb);
                    if (!isNaN(na) && !isNaN(nb) && va == na.toString() && vb == nb.toString()) {
                        return newDir === 'asc' ? na - nb : nb - na;
                    }
                    return newDir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
                });
                rows.forEach(function(row) { tbody.appendChild(row); });

                var ids = rows.map(function(r) { return parseInt(r.dataset.id); });

                fetch('/api/table-sort/cabinet_systems', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sort_order: ids, sort_key: key, sort_dir: newDir })
                }).then(function() { loadSystemComponents(); }).catch(function(e) { console.error(e); });
            });

        }).catch(function(err) {
            console.error(err);
            container.innerHTML = '<p>Ошибка загрузки систем</p>';
        });
    }

    function openSystemModal(sysId) {
        document.getElementById('systemDescription').value = '';
        fetch('/api/cabinets?project_id=' + (window.projectId || ''))
          .then(function(r){ return r.json(); })
          .then(function(cabinets){
            var cabSel = document.getElementById('cabinetSelect');
            cabSel.innerHTML = '<option value="">-- текущий шкаф --</option>';
            cabinets.forEach(function(cab){
              cabSel.innerHTML += '<option value="' + cab.id + '">' + esc(cab.name) + '</option>';
            });
          });
        fetch('/api/systems')
            .then(function(r){ return r.json(); })
            .then(function(data){
                var sel = document.getElementById('systemSelect');
                sel.innerHTML = '<option value="">-- выберите --</option>';
                if (data.length) {
                    sel.innerHTML += '<optgroup label="Существующие">';
                    data.forEach(function(s){
                        sel.innerHTML += '<option value="' + s.id + '">' + esc(s.name) + '</option>';
                    });
                    sel.innerHTML += '</optgroup>';
                }
                sel.innerHTML += '<optgroup label="Добавить"><option value="__new__">+ новая система</option></optgroup>';
                document.getElementById('systemForm').dataset.editId = '';
                document.querySelector('.new-system-row').style.display = 'none';

                if (sysId) {
                    fetch('/api/cabinets/' + cabinetId + '/systems')
                        .then(function(r){ return r.json(); })
                        .then(function(sysData){
                            var sys = sysData.find(function(s){ return s.id === sysId; });
                            if (sys) {
                                sel.value = sys.system_id;
                                document.getElementById('systemDescription').value = sys.description || '';
                                document.getElementById('cabinetSelect').value = sys.cabinet_id || '';
                            }
                            document.getElementById('systemForm').dataset.editId = sysId;
                        });
                }
                document.getElementById('systemModal').style.display = 'flex';
                sel.onchange = function() {
                    document.querySelector('.new-system-row').style.display = sel.value === '__new__' ? 'flex' : 'none';
                };
                
                var saveBtn = document.querySelector('.save-new-system-btn');
                saveBtn.onclick = function() {
                    var nameInput = document.querySelector('.new-system-name');
                    var name = nameInput.value.trim();
                    if (!name) { alert('Введите название'); return; }
                    fetch('/api/systems', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name }) })
                    .then(function(r){ return r.json(); })
                    .then(function(ns){
                        sel.innerHTML += '<option value="' + ns.id + '" selected>' + esc(ns.name) + '</option>';
                        sel.value = ns.id;
                        nameInput.value = '';
                        document.querySelector('.new-system-row').style.display = 'none';
                    });
                };
            });
    }

    document.getElementById('systemForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var system_id = document.getElementById('systemSelect').value;
        if (!system_id || system_id === '__new__') { alert('Выберите или создайте систему'); return; }
        var editId = document.getElementById('systemForm').dataset.editId;
        var description = document.getElementById('systemDescription').value.trim();
        var url = editId ? '/api/cabinets/' + cabinetId + '/systems/' + editId : '/api/cabinets/' + cabinetId + '/systems';
        var bodyData = { system_id: parseInt(system_id), description: description || null };
        if (editId) {
          var newCabinetId = document.getElementById('cabinetSelect')?.value;
          if (newCabinetId) bodyData.cabinet_id = parseInt(newCabinetId);
        }
        fetch(url, {
            method: editId ? 'PUT' : 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyData)
        })
        .then(function(r){
            if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
            document.getElementById('systemModal').style.display = 'none';
            refreshAllData();
        })
        .catch(function(e){ alert(e.message); });
    });

    window.editSystem = function(id) { openSystemModal(id); };
    window.delSystem = function(id) {
        if (!confirm('Удалить систему из шкафа?')) return;
        fetch('/api/cabinets/' + cabinetId + '/systems/' + id, { method: 'DELETE' })
            .then(function(){ refreshAllData(); });
    };

    // ===== 2. КОМПОНЕНТЫ СИСТЕМ =====
    window.loadSystemComponents = loadSystemComponents;
    function loadSystemComponents() {
        var container = document.getElementById('cabinetSystemComponents');
        Promise.all([
            fetch('/api/cabinets/' + cabinetId + '/systems').then(function(r){ return r.json(); }),
            fetch('/api/table-sort/cabinet_systems').then(function(r){ return r.json(); }).catch(function(){ return {}; })
        ]).then(function(results) {
            var systems = results[0];
            var saved = results[1];

            if (!systems.length) {
                container.innerHTML = '<p>Нет систем. Добавьте систему в шкаф.</p>';
                return;
            }

            if (saved.sort_order && saved.sort_order.length) {
                var orderMap = {};
                saved.sort_order.forEach(function(id, idx) { orderMap[id] = idx; });
                systems.sort(function(a, b) {
                    var ia = orderMap.hasOwnProperty(a.id) ? orderMap[a.id] : 999999;
                    var ib = orderMap.hasOwnProperty(b.id) ? orderMap[b.id] : 999999;
                    return ia - ib;
                });
            }

            container.innerHTML = 'Загрузка...';
            var promises = systems.map(function(sys) {

    window.initSystemCompTable = function(table) {
        var thead = table.querySelector('thead');
        var tbody = table.querySelector('tbody');
        if (!thead || !tbody) return;

        var systemBlock = table.closest('.system-block');
        var clearBtn = systemBlock ? systemBlock.querySelector('button[onclick*="clearSystemComponents"]') : null;
        var systemId = null;
        if (clearBtn) {
            var match = clearBtn.getAttribute('onclick').match(/clearSystemComponents\((\d+)\)/);
            if (match) systemId = match[1];
        }
        if (!systemId) return;

        var tableName = 'system_components_' + systemId;

        var existingStatusLine = systemBlock.querySelector('.comp-status-line');
        if (existingStatusLine) existingStatusLine.remove();

        setupDragAndDrop(tbody, tableName);

        function getRowId(tr) {
            return tr.dataset.id || tr.getAttribute('data-id');
        }

        fetch('/api/table-sort/' + tableName).then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(saved) {
            var filterData = saved.filter_data || {};

            if (saved.sort_order && saved.sort_order.length) {
                var orderMap = {};
                saved.sort_order.forEach(function(id, idx) { orderMap[id] = idx; });
                var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
                rows.sort(function(a, b) {
                    var ia = orderMap.hasOwnProperty(getRowId(a)) ? orderMap[getRowId(a)] : 999999;
                    var ib = orderMap.hasOwnProperty(getRowId(b)) ? orderMap[getRowId(b)] : 999999;
                    return ia - ib;
                });
                rows.forEach(function(row) { tbody.appendChild(row); });
            }

            Object.keys(filterData).forEach(function(col) {
                var selectedValues = filterData[col] || [];
                if (selectedValues.length > 0) {
                    tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
                        var colIdx = Array.from(thead.querySelectorAll('th')).findIndex(function(th) { return th.dataset.sort === col; });
                        var cellValue = (tr.cells[colIdx]?.textContent || '').trim() || '-';
                        if (selectedValues.indexOf(cellValue) < 0) {
                            tr.style.display = 'none';
                        }
                    });
                    var icon = thead.querySelector('.filter-icon[data-col="' + col + '"]');
                    if (icon) icon.textContent = '\u2699\uFE0F';
                }
            });

            table._filterData = filterData;
            table._tableName = tableName;
        });

        thead.addEventListener('click', function(e) {
            var th = e.target.closest('th[data-sort]');
            if (!th || e.target.closest('.filter-icon') || e.target.closest('.filter-dropdown')) return;
            e.stopPropagation();

            var key = th.dataset.sort;
            var currentDir = th.dataset.sortDir || 'asc';
            var newDir = (currentDir === 'asc') ? 'desc' : 'asc';

            thead.querySelectorAll('th[data-sort]').forEach(function(t) { t.dataset.sortDir = ''; });
            th.dataset.sortDir = newDir;

            var colIdx = Array.from(thead.querySelectorAll('th')).indexOf(th);
            var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            rows.sort(function(a, b) {
                var va = (a.cells[colIdx]?.textContent || '').trim();
                var vb = (b.cells[colIdx]?.textContent || '').trim();
                var na = parseFloat(va);
                var nb = parseFloat(vb);
                if (!isNaN(na) && !isNaN(nb) && va == na.toString() && vb == nb.toString()) {
                    return newDir === 'asc' ? na - nb : nb - na;
                }
                return newDir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
            });
            rows.forEach(function(row) { tbody.appendChild(row); });

            var ids = rows.map(function(r) { return getRowId(r); });

            fetch('/api/table-sort/' + tableName, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sort_order: ids, sort_key: key, sort_dir: newDir })
            }).catch(function(e) { console.error(e); });
        });
    };

    window.attachExistingComponent = function(systemId) {
        var modal = document.getElementById('attachComponentModal');
        var select = document.getElementById('attachComponentSelect');
        var form = document.getElementById('attachComponentForm');
        var errorDiv = document.getElementById('attachComponentError');
        var title = document.getElementById('attachComponentModalTitle');
        select.innerHTML = '<option value="">-- выберите компонент --</option>';
        document.getElementById('attachComponentQuantity').value = '1';
        errorDiv.style.display = 'none';
        title.textContent = 'Привязать компонент к системе';
        fetch('/api/system-components')
            .then(function(r){ return r.json(); })
            .then(function(components){
                if (!components || !components.length) {
                    select.innerHTML = '<option value="">-- нет доступных компонентов --</option>';
                    alert('Нет доступных компонентов. Создайте компонент на странице "Компоненты систем".');
                    return;
                }
                components.forEach(function(comp){
                    var text = comp.name;
                    if (comp.type_name) text += ' (' + comp.type_name + ')';
                    if (comp.article) text += ' Арт: ' + comp.article;
                    if (comp.manufacturer_name) text += ' [' + comp.manufacturer_name + ']';
                    select.innerHTML += '<option value="' + comp.id + '">' + esc(text) + '</option>';
                });
                modal.style.display = 'flex';
            })
            .catch(function(err){
                errorDiv.textContent = 'Ошибка загрузки компонентов';
                errorDiv.style.display = 'flex';
            });

        form.onsubmit = function(e) {
            e.preventDefault();
            var componentId = select.value;
            var quantity = parseInt(document.getElementById('attachComponentQuantity').value);
            if (!componentId) { errorDiv.textContent = 'Выберите компонент'; errorDiv.style.display = 'flex'; return; }
            if (!quantity || quantity < 1) { errorDiv.textContent = 'Введите корректное количество'; errorDiv.style.display = 'flex'; return; }
            errorDiv.style.display = 'none';
            fetch('/api/systems/' + systemId + '/components', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ component_id: parseInt(componentId), quantity: quantity })
            })
            .then(function(r){
                if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
                modal.style.display = 'none';
                refreshAllData();
                alert('✅ Компонент успешно привязан к системе!');
            })
            .catch(function(e){ errorDiv.textContent = 'Ошибка привязки: ' + e.message; errorDiv.style.display = 'flex'; });
        };
    };

      html2pdf().set({ margin: 10, filename: 'config.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
    };

    window.exportCalcToPDF = function() {

      html2pdf().set({ margin: 10, filename: 'calculation.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(element).save();
    };

    window.openBlockModalWithId = function(blockId, templateId) {
        if (typeof BlockTemplateModal !== "undefined") {
            BlockTemplateModal.open(function() {
                refreshAllData();
            }, parseInt(templateId));
        } else {
            alert("Ошибка: модальное окно компонентов не загружено");
        }
    };

    window.pageInit = function() {};

})();

(function setupGlobalTooltips() {
    var chainTooltipStyles = document.createElement("style");
    chainTooltipStyles.textContent = ".material-chain-tooltip{position:fixed;z-index:99999;background:#1e293b;color:#f1f5f9;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,0.5);pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:420px;}.material-chain-tooltip.visible{opacity:1;}.chain-header{font-weight:600;margin-bottom:6px;color:#fbbf24;}.chain-line{color:#e2e8f0;}.chain-arrow{color:#94a3b8;margin:0 4px;}";
    document.head.appendChild(chainTooltipStyles);

    var chainTooltip = document.createElement('div');
    chainTooltip.className = 'material-chain-tooltip';
    document.body.appendChild(chainTooltip);

    function esc(str) {
        var d = document.createElement('div');
        d.textContent = str || '';
        return d.innerHTML;
    }

    document.body.addEventListener('mouseover', function(e) {
        var matCell = e.target.closest('.material-name-cell');
        var compCell = e.target.closest('.component-name-cell');

        if (matCell) {
            var block = matCell.dataset.chainBlock || '-';
            var comp = matCell.dataset.chainComp || '-';
            var type = matCell.dataset.chainType || '';
            if (block === '-' && comp === '-') return;

            var matName = matCell.textContent.trim();
            var html = '<div class="chain-header">🔗 Связи материала «' + esc(matName) + '»:</div>';
            html += '<div class="chain-line">' + esc(matName);
            if (block !== '-') html += ' <span class="chain-arrow">→</span> ' + esc(block);
            if (comp !== '-') html += ' <span class="chain-arrow">→</span> ' + esc(comp);
            if (type) html += ' (' + esc(type) + ')';
            html += '</div>';

            chainTooltip.innerHTML = html;
            chainTooltip.classList.add('visible');
        } else if (compCell) {
            var comp = compCell.dataset.chainComp || '';
            var type = compCell.dataset.chainType || '';
            if (!comp && !type) return;

            var blockName = compCell.closest('tr')?.querySelector('td:nth-child(4)')?.textContent?.trim() || '';
            var html = '<div class="chain-header">🔗 Связи компонента «' + esc(blockName) + '»:</div>';
            html += '<div class="chain-line">' + esc(blockName);
            if (comp) html += ' <span class="chain-arrow">→</span> ' + esc(comp);
            if (type) html += ' (' + esc(type) + ')';
            html += '</div>';

            chainTooltip.innerHTML = html;
            chainTooltip.classList.add('visible');
        }
    });

    document.body.addEventListener('mousemove', function(e) {
        if (chainTooltip.classList.contains('visible')) {
            chainTooltip.style.left = (e.clientX + 12) + 'px';
            chainTooltip.style.top = (e.clientY + 12) + 'px';
        }
    });

    document.body.addEventListener('mouseout', function(e) {
        if (e.target.closest('.material-name-cell, .component-name-cell')) {
            chainTooltip.classList.remove('visible');
        }
    });
})();
