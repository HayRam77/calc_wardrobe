<div class="page-content">
    <div id="cabinetContent" style="max-width:800px;">
        <p>Загрузка шкафа...</p>
    </div>
</div>

<script>
(function() {
    var cabinetId = window.pageParam;
    if (!cabinetId) {
        document.getElementById('cabinetContent').innerHTML = '<p>Шкаф не найден</p>';
        return;
    }

    function esc(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    fetch('/api/cabinets/' + cabinetId).then(function(res) {
        if (!res.ok) throw new Error('Ошибка');
        return res.json();
    }).then(function(cabinet) {
        var html = '<h2>' + esc(cabinet.name) + '</h2>';
        html += '<p>' + esc(cabinet.description || '') + '</p>';
        html += '<p><em>Проект: ' + esc(cabinet.project_name || '') + '</em></p>';
        html += '<hr><h3>Компоненты шкафа</h3>';
        html += '<div id="cabinetBlocks">Загрузка...</div>';
        html += '<hr><h3>Системы шкафа</h3>';
        html += '<div id="cabinetSystems">Загрузка...</div>';
        document.getElementById('cabinetContent').innerHTML = html;
        loadBlocks(cabinetId);
    }).catch(function() {
        document.getElementById('cabinetContent').innerHTML = '<p style="color:red;">Ошибка загрузки</p>';
    });

    function loadBlocks(cabinetId) {
        fetch('/api/cabinets/' + cabinetId + '/blocks').then(function(res) {
            if (!res.ok) throw new Error('Ошибка');
            return res.json();
        }).then(function(blocks) {
            var container = document.getElementById('cabinetBlocks');
            if (!blocks.length) {
                container.innerHTML = '<p>Нет компонентов</p>';
                return;
            }
            var h = '<table class="data-table"><tr><th>Тип</th><th>Название</th><th>Артикул</th><th>Производитель</th><th>Кол-во</th></tr>';
            blocks.forEach(function(b) {
                h += '<tr><td>' + esc(b.type_name || '') + '</td><td>' + esc(b.name) + '</td><td>' + esc(b.article || '') + '</td><td>' + esc(b.manufacturer_name || '') + '</td><td>' + b.quantity + '</td></tr>';
            });
            h += '</table>';
            container.innerHTML = h;
        }).catch(function() {
            document.getElementById('cabinetBlocks').innerHTML = '<p style="color:red;">Ошибка</p>';
        });
    }

    window.pageInit = function() {};
})();
</script>
