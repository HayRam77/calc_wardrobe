<div class="page-content">
    <div id="projectContent" style="max-width:800px;">
        <p>Загрузка проекта...</p>
    </div>
</div>

<!-- Модальное окно для шкафа -->
<div id="cabinetModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:500px;">
        <span class="modal-close" onclick="document.getElementById('cabinetModal').style.display='none'">&times;</span>
        <h3 id="cabinetModalTitle">Добавить шкаф</h3>
        <form id="cabinetForm">
            <input type="hidden" id="cabinetId">
            <div class="form-group">
                <label for="cabinetName">Название *</label>
                <input type="text" id="cabinetName" required maxlength="255">
            </div>
            <div class="form-group">
                <label for="cabinetDescription">Описание</label>
                <textarea id="cabinetDescription" maxlength="500" rows="2"></textarea>
            </div>
            <div id="cabinetError" class="error-message" style="display:none;"></div>
            <div class="form-actions" style="margin-top:15px;">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('cabinetModal').style.display='none'">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<script>
(function() {
    var token = localStorage.getItem('token');
    var projectId = window.pageParam;

    if (!projectId || !token) {
        document.getElementById('projectContent').innerHTML = '<p>Проект не найден</p>';
        return;
    }

    function esc(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
    }

    var cabinetModal = document.getElementById('cabinetModal');
    var cabinetForm = document.getElementById('cabinetForm');
    var cabinetError = document.getElementById('cabinetError');

    fetch('/api/projects/' + projectId).then(function(res) {
        if (!res.ok) throw new Error('Ошибка загрузки');
        return res.json();
    }).then(function(project) {
        document.querySelector('.page-title').textContent = 'Проект: ' + project.name + (project.description ? ' — ' + project.description : '') + ' (' + (project.owner_name || 'Автор') + ')';
        var html = '<h3>Шкафы проекта</h3>';
        html += '<div id="projectCabinets">Загрузка шкафов...</div>';
        html += '<button id="addCabinetBtn" class="btn btn-primary" style="margin-top:10px;">+ Добавить шкаф</button>';
        document.getElementById('projectContent').innerHTML = html;

        loadCabinets(projectId);
        document.getElementById('addCabinetBtn').addEventListener('click', function() {
            openCabinetModal();
        });
    }).catch(function(err) {
        document.getElementById('projectContent').innerHTML = '<p style="color:red;">Ошибка загрузки проекта</p>';
    });

    function loadCabinets(projectId) {
        fetch('/api/cabinets?project_id=' + projectId).then(function(res) {
            if (!res.ok) throw new Error('Ошибка');
            return res.json();
        }).then(function(cabinets) {
            var container = document.getElementById('projectCabinets');
            if (!cabinets.length) {
                container.innerHTML = '<p>Нет шкафов в проекте</p>';
                return;
            }
            var h = '<div class="table-container"><table class="data-table"><tr><th>ID</th><th>Название</th><th>Описание</th><th></th></tr>';
            cabinets.forEach(function(c) {
                h += '<tr><td>' + c.id + '</td><td><a href="/cabinet/' + c.id + '" onclick="event.preventDefault(); navigateTo(\'/cabinet/' + c.id + '\')">' + esc(c.name) + '</a></td><td>' + esc(c.description || '') + '</td><td><button class="btn btn-sm btn-edit" onclick="editCabinet(' + c.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteCabinet(' + c.id + ')">🗑️</button></td></tr>';
            });
            h += '</table></div>';
            container.innerHTML = h;
        }).catch(function() {
            document.getElementById('projectCabinets').innerHTML = '<p style="color:red;">Ошибка загрузки шкафов</p>';
        });
    }

    function openCabinetModal(cabinet) {
        var isEdit = !!cabinet;
        document.getElementById('cabinetModalTitle').textContent = isEdit ? 'Редактировать шкаф' : 'Добавить шкаф';
        document.getElementById('cabinetId').value = cabinet ? cabinet.id : '';
        document.getElementById('cabinetName').value = cabinet ? cabinet.name : '';
        document.getElementById('cabinetDescription').value = cabinet ? cabinet.description || '' : '';
        cabinetError.style.display = 'none';
        cabinetModal.style.display = 'block';
    }

    cabinetForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var id = document.getElementById('cabinetId').value;
        var body = {
            name: document.getElementById('cabinetName').value.trim(),
            description: document.getElementById('cabinetDescription').value.trim(),
            project_id: projectId
        };
        if (!body.name) { cabinetError.textContent = 'Введите название'; cabinetError.style.display = 'block'; return; }
        var url = id ? '/api/cabinets/' + id : '/api/cabinets';
        var method = id ? 'PUT' : 'POST';
        fetch(url, { method: method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })
        .then(function(res) {
            console.log('Response status:', res.status);
            if (!res.ok) return res.json().then(function(d) { throw new Error(d.message || 'Ошибка'); });
            cabinetModal.style.display = 'none';
            loadCabinets(projectId);
        }).catch(function(err) { cabinetError.textContent = err.message; cabinetError.style.display = 'block'; });
    });

    window.editCabinet = function(id) {
        fetch('/api/cabinets/' + id).then(function(r) { return r.json(); }).then(function(c) {
            openCabinetModal(c);
        });
    };

    window.deleteCabinet = function(id) {
        if (!confirm('Удалить шкаф?')) return;
        fetch('/api/cabinets/' + id, {method: 'DELETE'}).then(function() {
            loadCabinets(projectId);
        });
    };

    window.pageInit = function() {};
})();
</script>
