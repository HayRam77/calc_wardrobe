<h2>Все шкафы</h2>
<div id="allCabinetsTable"></div>

<!-- Модальное окно выбора проекта для переноса -->
<div id="moveModal" class="modal-overlay hidden">
  <div class="modal">
    <h3>Перенести шкаф в проект</h3>
    <select id="projectSelect"></select>
    <div style="margin-top:10px; text-align:right;">
      <button id="confirmMoveBtn">Перенести</button>
      <button id="cancelMoveBtn" style="background:#888; margin-left:8px;">Отмена</button>
    </div>
  </div>
</div>

<script>
(function() {
  let currentCabinetId = null;

  async function loadProjects() {
    const token = localStorage.getItem('token');
    try {
      const res = await fetch('/api/projects', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки проектов');
      const projects = await res.json();
      const sel = document.getElementById('projectSelect');
      sel.innerHTML = projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
    } catch(e) { alert('Ошибка загрузки проектов'); }
  }

  async function loadCabinets() {
    const token = localStorage.getItem('token');
    const container = document.getElementById('allCabinetsTable');
    try {
      const res = await fetch('/api/admin/cabinets', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const cabinets = await res.json();
      if (cabinets.length === 0) {
        container.innerHTML = '<p>Нет шкафов</p>';
        return;
      }
      let html = '<table><tr><th>Название шкафа</th><th>Проект</th><th>Создатель</th><th>Дата создания</th><th>Действия</th></tr>';
      cabinets.forEach(c => {
        html += `<tr>
          <td><a href="/cabinet/${c.id}" class="cabinet-link">${c.cabinet_name}</a></td>
          <td>${c.project_name}</td>
          <td>${c.creator || 'неизвестно'}</td>
          <td>${new Date(c.created_at).toLocaleString('ru-RU')}</td>
          <td>
            <button class="small move-btn" data-id="${c.id}">↗</button>
            <button class="small copy-btn" data-id="${c.id}">📄</button>
            <button class="small danger delete-btn" data-id="${c.id}">🗑</button>
          </td>
        </tr>`;
      });
      html += '</table>';
      container.innerHTML = html;

      // Переход на страницу шкафа
      container.querySelectorAll('.cabinet-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          navigateTo(this.getAttribute('href'));
        });
      });

      // Удаление
      container.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Удалить шкаф?')) return;
          const token = localStorage.getItem('token');
          try {
            await fetch('/api/admin/cabinets/' + btn.dataset.id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            loadCabinets();
          } catch(e) { alert('Ошибка удаления'); }
        });
      });

      // Копирование
      container.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const newName = prompt('Введите имя для копии:');
          if (!newName) return;
          const token = localStorage.getItem('token');
          try {
            const res = await fetch('/api/admin/cabinets/' + btn.dataset.id + '/copy', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({ new_name: newName })
            });
            if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
            loadCabinets();
          } catch(e) { alert('Ошибка соединения'); }
        });
      });

      // Перенос
      container.querySelectorAll('.move-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentCabinetId = btn.dataset.id;
          document.getElementById('moveModal').classList.remove('hidden');
          loadProjects();
        });
      });
    } catch(e) {
      container.innerHTML = '<p style="color:red;">Ошибка загрузки шкафов</p>';
    }
  }

  document.getElementById('confirmMoveBtn').addEventListener('click', async () => {
    const projectId = document.getElementById('projectSelect').value;
    if (!projectId || !currentCabinetId) return;
    const token = localStorage.getItem('token');
    try {
      const res = await fetch('/api/admin/cabinets/' + currentCabinetId + '/move', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ project_id: Number(projectId) })
      });
      if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
      document.getElementById('moveModal').classList.add('hidden');
      loadCabinets();
    } catch(e) { alert('Ошибка соединения'); }
  });

  document.getElementById('cancelMoveBtn').addEventListener('click', () => {
    document.getElementById('moveModal').classList.add('hidden');
  });

  loadCabinets();
})();
</script>
