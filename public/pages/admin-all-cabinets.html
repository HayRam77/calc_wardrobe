<h2>Все шкафы</h2>
<div id="allCabinetsTable"></div>

<div id="moveModal" style="display:none; position:fixed; top:20%; left:50%; transform:translate(-50%,0); background:white; border:1px solid #ccc; padding:20px; z-index:1000;">
  <h3>Перенести шкаф</h3>
  <select id="projectSelect"></select>
  <br><br>
  <button id="confirmMoveBtn">Перенести</button>
  <button id="cancelMoveBtn">Отмена</button>
</div>

<script>
(function() {
  const token = localStorage.getItem('token');
  const container = document.getElementById('allCabinetsTable');
  let cabinets = [];
  let currentCabinetId = null;

  async function loadCabinets() {
    try {
      const res = await fetch('/api/admin/cabinets', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      cabinets = await res.json();
      renderCabinets();
    } catch(e) {
      container.innerHTML = '<p style="color:red;">Ошибка загрузки шкафов</p>';
    }
  }

  function renderCabinets() {
    if (cabinets.length === 0) {
      container.innerHTML = '<p>Нет шкафов</p>';
      return;
    }
    let html = '<table><tr><th>Название шкафа</th><th>Проект</th><th>Создатель</th><th>Дата создания</th><th>Действия</th></tr>';
    cabinets.forEach(c => {
      html += `<tr>
        <td><a href="/cabinet/${c.id}" class="cabinet-link">${c.cabinet_name}</a></td>
        <td>${c.project_name}</td>
        <td>${c.creator || 'неизвестно'}</td>
        <td>${new Date(c.created_at).toLocaleString('ru-RU')}</td>
        <td>
          <button class="small move-btn" data-id="${c.id}" title="Перенести шкаф в другой проект">↗</button>
          <button class="small duplicate-btn" data-id="${c.id}" title="Дублировать шкаф">📋</button>
          <button class="small danger delete-btn" data-id="${c.id}" title="Удалить шкаф">🗑</button>
        </td>
      </tr>`;
    });
    html += '</table>';
    container.innerHTML = html;

    // Привязываем события
    container.querySelectorAll('.cabinet-link').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        navigateTo(this.getAttribute('href'));
      });
    });

    // Удаление с токеном
    container.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        if (!confirm('Удалить шкаф?')) return;
        try {
          const res = await fetch('/api/admin/cabinets/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error || 'Ошибка удаления');
            return;
          }
          loadCabinets();
        } catch(e) { alert('Ошибка соединения'); }
      });
    });

    // Дублирование с проверкой ошибок
    container.querySelectorAll('.duplicate-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        const newName = prompt('Имя для дубликата:');
        if (!newName) return;
        try {
          const res = await fetch('/api/admin/cabinets/' + id + '/copy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ new_name: newName })
          });
          if (!res.ok) {
            const err = await res.json();
            alert(err.error || 'Ошибка');
            return;
          }
          loadCabinets();
        } catch(e) { alert('Ошибка соединения'); }
      });
    });

    // Перенос
    container.querySelectorAll('.move-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        currentCabinetId = id;
        const res = await fetch('/api/projects', { headers: { 'Authorization': 'Bearer ' + token } });
        const projects = await res.json();
        const select = document.getElementById('projectSelect');
        select.innerHTML = '';
        projects.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.name;
          select.appendChild(opt);
        });
        document.getElementById('moveModal').style.display = 'block';
      });
    });
  }

  document.getElementById('confirmMoveBtn').addEventListener('click', async () => {
    const projectId = document.getElementById('projectSelect').value;
    if (!currentCabinetId || !projectId) return;
    await fetch('/api/admin/cabinets/' + currentCabinetId + '/move', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ project_id: projectId })
    });
    document.getElementById('moveModal').style.display = 'none';
    loadCabinets();
  });

  document.getElementById('cancelMoveBtn').addEventListener('click', () => {
    document.getElementById('moveModal').style.display = 'none';
  });

  loadCabinets();
})();
</script>
