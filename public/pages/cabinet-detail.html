<div id="cabinetContent">
  <h2>Шкаф: <span id="cabinetName"></span></h2>
  <p>Проект: <a href="#" id="projectLink"></a></p>
  <p>Создатель: <span id="cabinetCreator"></span></p>
  <p>Дата создания: <span id="cabinetCreated"></span></p>

  <h3>Компоненты</h3>
  <div id="cabinetBlocks"></div>

  <div style="margin-top:15px; display:flex; gap:10px; flex-wrap:wrap;">
    <button id="selectComponentBtn">Выбрать компонент</button>
    <button id="newComponentBtn">Добавить новый компонент</button>
    <button id="exportCabinetBtn">📥 Экспорт Excel</button>
    <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
    <button id="importCabinetBtn">📤 Импорт Excel</button>
  </div>

  <!-- Модальное окно выбора существующего компонента -->
  <div id="templateListModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; border-radius:8px; width:90%; max-width:1200px; max-height:80vh; display:flex; flex-direction:column; position:relative;">
      <span id="closeModalX" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; color:#888; z-index:3;">&times;</span>
      <div style="padding:20px 20px 10px 20px; border-bottom:1px solid #eee; position:sticky; top:0; background:white; z-index:2;">
        <h3 style="margin:0 0 10px 0;">Выберите компонент</h3>
        <input type="text" id="searchInput" placeholder="Поиск..." style="width:100%; padding:8px; box-sizing:border-box;">
      </div>
      <div style="overflow-y:auto; padding:0 20px 20px 20px;">
        <div id="templateListContent"></div>
      </div>
    </div>
  </div>

  <!-- Модальное окно добавления нового компонента -->
  <div id="addComponentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:white; border-radius:8px; width:500px; max-height:80vh; overflow-y:auto; padding:20px; position:relative;">
      <span id="closeAddModalX" style="position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; color:#888;">&times;</span>
      <h3 style="margin-top:0;">Новый компонент</h3>
      <div class="form-group"><label>Тип</label><select id="blockType"></select></div>
      <div class="form-group"><label>Название</label><input type="text" id="blockNameInput"></div>
      <div class="form-group"><label>Производитель</label><select id="blockManufacturer"></select></div>
      <div class="form-group"><label>Артикул</label><input type="text" id="blockArticle"></div>
      <div class="form-group"><label>Количество</label><input type="number" id="blockQuantity" value="1" min="1"></div>
      <div class="form-group"><label>Описание</label><input type="text" id="blockDescription"></div>
      <div class="form-group"><label>Цена, руб.</label><input type="number" id="blockPrice" step="0.01"></div>
      <div class="form-group"><label>Трудозатраты, мин.</label><input type="number" id="blockLabor" step="1"></div>
      <button id="saveNewBlockBtn">Добавить</button>
      <button id="cancelAddModalBtn" style="background:#888; margin-left:10px;">Отмена</button>
      <div id="blockError" style="color:red; margin-top:5px;"></div>
    </div>
  </div>

  <button onclick="history.back()" style="margin-top:15px;">← Назад</button>
</div>

<script>
(function() {
  const pathParts = location.pathname.split('/');
  const cabinetId = pathParts[pathParts.length - 1];
  let projectId = null;
  let currentBlocks = [];

  async function loadCabinet() {
    const token = localStorage.getItem('token');
    try {
      const res = await fetch('/api/cabinets/' + cabinetId, { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const data = await res.json();
      projectId = data.project_id;
      document.getElementById('cabinetName').textContent = data.name;
      document.getElementById('cabinetCreator').textContent = data.project_owner_id || 'неизвестно';
      document.getElementById('cabinetCreated').textContent = new Date(data.created_at).toLocaleString('ru-RU');
      const projectLink = document.getElementById('projectLink');
      projectLink.textContent = data.project_name;
      projectLink.href = '/project/' + data.project_id;
      projectLink.addEventListener('click', function(e) { e.preventDefault(); navigateTo(this.getAttribute('href')); });
      currentBlocks = data.blocks || [];
      renderBlocks(currentBlocks);
    } catch(e) { document.getElementById('cabinetContent').innerHTML = '<p style="color:red;">Ошибка загрузки шкафа</p>'; }
  }

  function renderBlocks(blocks) {
    const container = document.getElementById('cabinetBlocks');
    if (blocks.length === 0) { container.innerHTML = '<p>Нет компонентов</p>'; return; }
    let html = '<table><thead><tr><th></th><th>Тип</th><th>Наименование</th><th>Количество</th><th>Артикул</th><th>Производитель</th><th>Примечание</th><th></th></tr></thead><tbody id="sortableBody">';
    blocks.forEach(b => {
      html += `<tr draggable="true" data-id="${b.id}" data-order="${b.order_index}" class="draggable-row">
        <td style="cursor:grab; color:#888; font-size:18px; vertical-align:middle; text-align:center;">⠿</td>
        <td>${b.type_name || ''}</td>
        <td>${b.block_name}</td>
        <td><input type="number" class="quantity-input" value="${b.quantity || 1}" min="0" style="width:70px;" data-id="${b.id}"></td>
        <td>${b.article || ''}</td>
        <td>${b.manufacturer_name || ''}</td>
        <td>${b.template_description || ''}</td>
        <td>
          ${b.template_id ? `<button class="small edit-block-btn" data-id="${b.id}" data-template-id="${b.template_id}">✎</button>` : ''}
          <button class="small danger delete-block-btn" data-id="${b.id}">🗑</button>
        </td>
      </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;

    // Drag‑n‑Drop
    const rows = container.querySelectorAll('.draggable-row');
    rows.forEach(row => {
      row.addEventListener('dragstart', handleDragStart);
      row.addEventListener('dragover', handleDragOver);
      row.addEventListener('drop', handleDrop);
      row.addEventListener('dragend', handleDragEnd);
    });

    // Удаление
    container.querySelectorAll('.delete-block-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const blockId = e.target.dataset.id;
        if (!confirm('Удалить компонент?')) return;
        const token = localStorage.getItem('token');
        try {
          await fetch('/api/projects/' + projectId + '/blocks/' + blockId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
          loadCabinet();
        } catch(e) { alert('Ошибка удаления'); }
      });
    });

    // Изменение количества
    container.querySelectorAll('.quantity-input').forEach(input => {
      input.addEventListener('change', async (e) => {
        const blockId = e.target.dataset.id;
        const newQty = parseInt(e.target.value) || 0;
        const token = localStorage.getItem('token');
        try {
          await fetch('/api/projects/' + projectId + '/blocks/' + blockId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ quantity: newQty })
          });
        } catch(e) { alert('Ошибка обновления количества'); }
      });
    });

    // Кнопка ✎ (редактирование через глобальное окно)
    container.querySelectorAll('.edit-block-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const templateId = e.target.dataset.templateId;
        if (!templateId) return;
        openTemplateModal(templateId);
        const observer = new MutationObserver(() => {
          const modal = document.getElementById('templateModal');
          if (modal.classList.contains('hidden')) {
            observer.disconnect();
            loadCabinet();
          }
        });
        observer.observe(document.getElementById('templateModal'), { attributes: true, attributeFilter: ['class'] });
      });
    });
  }

  // Drag‑n‑Drop handlers
  let draggedRow = null;
  function handleDragStart(e) { draggedRow = this; e.dataTransfer.effectAllowed = 'move'; this.classList.add('dragging'); }
  function handleDragOver(e) { if (e.preventDefault) e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }
  function handleDrop(e) {
    if (e.stopPropagation) e.stopPropagation();
    if (draggedRow !== this) {
      const draggedId = parseInt(draggedRow.dataset.id);
      const targetId = parseInt(this.dataset.id);
      const draggedOrder = parseInt(draggedRow.dataset.order);
      const targetOrder = parseInt(this.dataset.order);

      const tbody = document.getElementById('sortableBody');
      const rows = Array.from(tbody.querySelectorAll('.draggable-row'));
      const draggedIdx = rows.findIndex(r => parseInt(r.dataset.id) === draggedId);
      const targetIdx = rows.findIndex(r => parseInt(r.dataset.id) === targetId);
      if (draggedIdx < targetIdx) {
        tbody.insertBefore(draggedRow, rows[targetIdx].nextSibling);
      } else {
        tbody.insertBefore(draggedRow, rows[targetIdx]);
      }

      const token = localStorage.getItem('token');
      Promise.all([
        fetch('/api/projects/' + projectId + '/blocks/' + draggedId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ order_index: targetOrder })
        }),
        fetch('/api/projects/' + projectId + '/blocks/' + targetId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ order_index: draggedOrder })
        })
      ]).then(() => {
        draggedRow.dataset.order = targetOrder;
        this.dataset.order = draggedOrder;
        loadCabinet();
        loadCabinet(); // <-- теперь перезагружаем шкаф
      }).catch(e => console.error(e));
    }
    return false;
  }
  function handleDragEnd(e) { this.classList.remove('dragging'); draggedRow = null; }

  // Заполнение справочников (глобальные массивы componentTypes и manufacturers)
  function populateSelects() {
    const typeSel = document.getElementById('blockType');
    typeSel.innerHTML = '<option value="">--</option>';
    if (typeof componentTypes !== 'undefined') componentTypes.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = t.name; typeSel.appendChild(o); });
    const manSel = document.getElementById('blockManufacturer');
    manSel.innerHTML = '<option value="">--</option>';
    if (typeof manufacturers !== 'undefined') manufacturers.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; manSel.appendChild(o); });
  }

  // --- Модальное окно выбора компонента ---
  const selectModal = document.getElementById('templateListModal');
  function closeSelectModal() { selectModal.style.display = 'none'; }
  document.getElementById('closeModalX').addEventListener('click', closeSelectModal);
  selectModal.addEventListener('click', function(e) { if (e.target === selectModal) closeSelectModal(); });

  document.getElementById('selectComponentBtn').addEventListener('click', () => {
    const listDiv = document.getElementById('templateListContent');
    listDiv.innerHTML = '';
    if (typeof templates === 'undefined' || templates.length === 0) {
      listDiv.innerHTML = '<p>Нет доступных компонентов</p>';
      selectModal.style.display = 'flex';
      return;
    }

    const paramNamesSet = new Set();
    templates.forEach(t => { if (t.parameters && t.parameters.length > 0) t.parameters.forEach(p => paramNamesSet.add(p.param_name)); });
    const paramNames = Array.from(paramNamesSet).sort();

    function renderTable(filterText = '') {
      const filterLower = filterText.toLowerCase();
      const filtered = templates.filter(t => {
        if (!filterLower) return true;
        const inName = (t.name || '').toLowerCase().includes(filterLower);
        const inArticle = (t.article || '').toLowerCase().includes(filterLower);
        const inManufacturer = (t.manufacturer_name || '').toLowerCase().includes(filterLower);
        let inParams = false;
        if (t.parameters) inParams = t.parameters.some(p => p.param_name.toLowerCase().includes(filterLower) || p.param_value.toLowerCase().includes(filterLower));
        return inName || inArticle || inManufacturer || inParams;
      });

      if (filtered.length === 0) { listDiv.innerHTML = '<p>Ничего не найдено</p>'; return; }

      let html = '<table style="width:100%; border-collapse:collapse;"><thead style="position:sticky; top:0; background:white; z-index:1;"><tr><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th>';
      paramNames.forEach(name => { html += `<th>${name}</th>`; });
      html += '<th>Описание</th></tr></thead><tbody>';

      filtered.forEach(t => {
        html += `<tr class="clickable" data-id="${t.id}" style="cursor:pointer;">`;
        html += `<td>${t.type_name || ''}</td><td><strong>${t.name}</strong></td><td>${t.manufacturer_name || ''}</td><td>${t.article || ''}</td>`;
        paramNames.forEach(pName => {
          const param = t.parameters ? t.parameters.find(p => p.param_name === pName) : null;
          html += `<td>${param ? param.param_value : ''}</td>`;
        });
        html += `<td>${t.description || ''}</td></tr>`;
      });

      html += '</tbody></table>';
      listDiv.innerHTML = html;

      listDiv.querySelectorAll('tr.clickable').forEach(row => {
        row.addEventListener('click', async () => {
          const id = row.dataset.id;
          const token = localStorage.getItem('token');
          try {
            const res = await fetch('/api/projects/' + projectId + '/blocks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
              body: JSON.stringify({
                block_name: templates.find(t => t.id == id).name,
                cabinet_id: cabinetId,
                template_id: id,
                order_index: 0,
                quantity: 1
              })
            });
            if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
            closeSelectModal();
            loadCabinet();
          } catch(e) { alert('Ошибка соединения'); }
        });
      });
    }

    renderTable('');

    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    searchInput.focus();
    const newSearchInput = searchInput.cloneNode(true);
    searchInput.parentNode.replaceChild(newSearchInput, searchInput);
    newSearchInput.addEventListener('input', (e) => { renderTable(e.target.value); });

    selectModal.style.display = 'flex';
  });

  // --- Модальное окно добавления нового компонента ---
  const addModal = document.getElementById('addComponentModal');
  function closeAddModal() { addModal.style.display = 'none'; }
  document.getElementById('closeAddModalX').addEventListener('click', closeAddModal);
  document.getElementById('cancelAddModalBtn').addEventListener('click', closeAddModal);
  addModal.addEventListener('click', function(e) { if (e.target === addModal) closeAddModal(); });

  document.getElementById('newComponentBtn').addEventListener('click', async () => {
    addModal.style.display = 'flex';
    document.getElementById('blockError').textContent = '';
    ['blockNameInput','blockArticle','blockDescription','blockPrice','blockLabor','blockQuantity'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('blockQuantity').value = 1;
    if (typeof loadTemplatesGlobal === 'function') await loadTemplatesGlobal();
    populateSelects();
    document.getElementById('blockNameInput').focus();
  });

  document.getElementById('saveNewBlockBtn').addEventListener('click', async () => {
    const blockName = document.getElementById('blockNameInput').value.trim();
    const errorDiv = document.getElementById('blockError');
    errorDiv.textContent = '';
    if (!blockName) { errorDiv.textContent = 'Введите название'; return; }
    const type_id = document.getElementById('blockType').value || null;
    const manufacturer_id = document.getElementById('blockManufacturer').value || null;
    const article = document.getElementById('blockArticle').value.trim();
    const description = document.getElementById('blockDescription').value.trim();
    const price = parseFloat(document.getElementById('blockPrice').value) || null;
    const labor = parseInt(document.getElementById('blockLabor').value) || null;
    const quantity = parseInt(document.getElementById('blockQuantity').value) || 1;
    const token = localStorage.getItem('token');

    let templateId = null;
    try {
      const tmplRes = await fetch('/api/block-templates', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify({ name: blockName, type_id, manufacturer_id, article, description, price, labor }) });
      if (tmplRes.ok) { const newTmpl = await tmplRes.json(); templateId = newTmpl.id; }
      else { const existing = templates.find(t => t.name === blockName); if (existing) templateId = existing.id; }
    } catch(e) {}

    try {
      const blockRes = await fetch('/api/projects/' + projectId + '/blocks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ block_name: blockName, cabinet_id: cabinetId, template_id: templateId, order_index: 0, quantity })
      });
      if (!blockRes.ok) { const err = await blockRes.json(); errorDiv.textContent = err.error || 'Ошибка'; return; }
    } catch(e) { errorDiv.textContent = 'Ошибка соединения'; return; }

    closeAddModal();
    loadCabinet();
    if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
  });

  // Экспорт / Импорт
  document.getElementById('exportCabinetBtn').addEventListener('click', async () => {
    const token = localStorage.getItem('token');
    try {
      const res = await fetch('/api/cabinets/' + cabinetId + '/export', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка экспорта'); return; }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'cabinet_components.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch(e) { alert('Ошибка соединения'); }
  });

  const fileInput = document.getElementById('importFile');
  document.getElementById('importCabinetBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const token = localStorage.getItem('token');
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch('/api/cabinets/' + cabinetId + '/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Ошибка импорта'); return; }
      alert(`Добавлено ${data.added} компонентов из ${data.total}`);
      loadCabinet();
      if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
    } catch(e) { alert('Ошибка соединения'); }
    fileInput.value = '';
  });

  loadCabinet();
})();
</script>
