<h2>Системы автоматизации</h2>
<p>Здесь будет конфигурация систем автоматизации вентиляционной установки.</p>
<div class="form-group">
  <label>Название проекта</label>
  <input type="text" id="projectName" placeholder="Введите название проекта">
</div>
<div class="form-group">
  <label>Тип системы</label>
  <select id="systemType">
    <option value="supply">Приточная</option>
    <option value="exhaust">Вытяжная</option>
    <option value="combined">Приточно-вытяжная</option>
  </select>
</div>
<div class="form-group">
  <label>Расход воздуха, м³/ч</label>
  <input type="number" id="airflow" value="1000" min="100" step="100">
</div>
<button id="saveBtn">Сохранить и продолжить</button>

<script>
document.getElementById('saveBtn').addEventListener('click', () => {
  const name = document.getElementById('projectName').value.trim();
  if (!name) return alert('Введите название проекта');
  const type = document.getElementById('systemType').value;
  const airflow = document.getElementById('airflow').value;
  alert(`Проект "${name}" (${type}, ${airflow} м³/ч) создан.\nЗдесь будет дальнейшая конфигурация.`);
});
</script>
