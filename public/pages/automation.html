<div class="page-content">
    <div style="margin-bottom:10px;">
        <button id="addSystemBtn" class="btn btn-primary" style="display:none;">Добавить систему</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
        <span id="filterBadge" style="display:none; margin-left:10px; font-size:13px; color:#1a5f7a; font-weight:600;"></span>
    </div>
    <div class="table-container">
        <table class="data-table" id="systemsTable">
            <thead>
                <tr>
                    <th style="width:1%"></th>
                    <th data-sort="id">ID</th>
                    <th data-sort="cabinet_names" style="position:relative;">
                        Шкаф <span class="filter-icon" data-col="cabinet_names" style="cursor:pointer; font-size:14px;" title="Шкафам">⚙</span>
                    </th>
                    <th data-sort="name">Название</th>
                    <th data-sort="page" style="position:relative;">
                        Страница <span class="filter-icon" data-col="page" style="cursor:pointer; font-size:14px;" title="Страницам">⚙</span>
                    </th>
                    <th data-sort="installation" style="position:relative;">
                        Установка <span class="filter-icon" data-col="installation" style="cursor:pointer; font-size:14px;" title="Установке">⚙</span>
                    </th>
                    <th data-sort="description">Описание</th>
                    <th data-sort="room">Помещение</th>
                    <th id="actionsCol" style="display:none;">Действия</th>
                </tr>
            </thead>
            <tbody id="systemsBody"><tr><td colspan="9" class="loading">Загрузка...</td></tr></tbody>
        </table>
    </div>
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:600px;width:95vw;">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>
</div>
<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || 'null');
    var isAdmin = user && user.role === 'admin';
    if (isAdmin) {
        document.getElementById('addSystemBtn').style.display = '';
        document.getElementById('exportBtn').style.display = '';
        document.getElementById('importBtn').style.display = '';
        document.getElementById('actionsCol').style.display = '';
    }
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    var modal = document.getElementById('modal'), modalTitle = document.getElementById('modalTitle'), modalForm = document.getElementById('modalForm');
    modal.querySelector('.close-modal').addEventListener('click', function() { modal.style.display = 'none'; });
    modal.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });

    var sysSortKey = null, sysSortDir = 'asc';
    var filterData = { cabinet_names: [], page: [], installation: [] };

    function setupDragAndDrop(tbody) {
        var dragInfo = null;
        function onMouseMove(e) {
            if (!dragInfo) return;
            var rows = Array.from(tbody.querySelectorAll('tr[data-id]'));
            var target = null;
            for (var i = 0; i < rows.length; i++) {
                var rect = rows[i].getBoundingClientRect();
                if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
            }
            if (target && target !== dragInfo.row) {
                var ti = rows.indexOf(target), ri = rows.indexOf(dragInfo.row);
                if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
                else tbody.insertBefore(dragInfo.row, target);
            }
        }
        function onMouseUp() {
            if (!dragInfo) return;
            dragInfo.row.style.opacity = '';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);

            var items = [], ids = [];
            tbody.querySelectorAll('tr[data-id]').forEach(function(tr, idx) {
                var id = parseInt(tr.dataset.id);
                if (id) { items.push({ id: id, position: idx }); ids.push(id); }
            });
            localStorage.setItem('systems_order', JSON.stringify(ids));
            fetch('/api/table-sort/systems', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sort_order: ids, filter_data: filterData }) }).catch(function(e){ console.error(e); });
            fetch('/api/systems/sort-order', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) }).catch(function(e){ console.error(e); });
            dragInfo = null;
        }

        tbody.addEventListener('mousedown', function(e) {
            var handle = e.target.closest('.drag-handle');
            if (!handle) return;
            e.preventDefault();
            var row = handle.closest('tr');
            if (!row) return;
            dragInfo = { row: row, startY: e.clientY };
            row.style.opacity = '0.5';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });
    }

    function renderSystems(data) {
        var tbody = document.getElementById('systemsBody');
        if (!data || !data.length) { tbody.innerHTML = '<tr><td colspan="9">Нет систем</td></tr>'; return; }
        
        tbody.innerHTML = data.map(function(s) {
            var cabHtml = (s.cabinet_names||'').split(', ').filter(Boolean).map(function(n,i){
                var ids = (s.cabinet_ids||'').split(',');
                return '<a href="/cabinet/' + (ids[i]||'') + '" target="_blank" style="color:#1a5f7a;">' + esc(n) + '</a>';
            }).join(', ')||'-';

            return '<tr data-id="'+s.id+'">' +
                '<td class="drag-handle" style="cursor:grab;">⠿</td>' +
                '<td>' + s.id + '</td>' +
                '<td>' + cabHtml + '</td>' +
                '<td><a href="#" style="color:#1a5f7a;text-decoration:underline;cursor:pointer;" onclick="openSystemModal('+s.id+');return false;">' + esc(s.name) + '</a></td>' +
                '<td>' + esc(s.page || '') + '</td>' +
                '<td>' + esc(s.installation || '') + '</td>' +
                '<td>' + esc(s.description || '') + '</td>' +
                '<td>' + esc(s.room || '') + '</td>' +
                (isAdmin ? '<td><button class="btn btn-sm btn-edit" onclick="editSystem(' + s.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystem(' + s.id + ')">🗑️</button></td>' : '') +
            '</tr>';
        }).join('');

        setupDragAndDrop(tbody);
        applyAllFilters();
    }

    function updateFilterIcons() {
        var table = document.getElementById('systemsTable');
        if (!table) return;
        ['cabinet_names', 'page', 'installation'].forEach(function(col) {
            var icon = table.querySelector('.filter-icon[data-col="' + col + '"]');
            if (icon) {
                var active = filterData[col] && filterData[col].length > 0;
                icon.textContent = active ? '⚙️' : '⚙';
            }
        });

        var badge = document.getElementById('filterBadge');
        var totalActive = (filterData.cabinet_names?.length || 0) + (filterData.page?.length || 0) + (filterData.installation?.length || 0);
        if (badge) {
            if (totalActive > 0) {
                badge.style.display = '';
                badge.textContent = 'Фильтров выбрано: ' + totalActive;
            } else {
                badge.style.display = 'none';
            }
        }
    }

    function applyAllFilters() {
        var tbody = document.getElementById('systemsBody');
        var thead = document.querySelector('#systemsTable thead tr');
        if (!tbody || !thead) return;

        var allTh = Array.from(thead.querySelectorAll('th'));
        var cabIdx = allTh.findIndex(function(th) { return th.dataset.sort === 'cabinet_names'; });
        var pageIdx = allTh.findIndex(function(th) { return th.dataset.sort === 'page'; });
        var instIdx = allTh.findIndex(function(th) { return th.dataset.sort === 'installation'; });

        tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
            var show = true;

            // 1. Фильтр по шкафам
            if (filterData.cabinet_names && filterData.cabinet_names.length > 0 && cabIdx >= 0) {
                var rowCabs = (tr.cells[cabIdx]?.textContent || '').split(', ').map(function(s){ return s.trim(); }).filter(Boolean);
                var matchCab = filterData.cabinet_names.some(function(fc) { return rowCabs.indexOf(fc) >= 0; });
                if (!matchCab) show = false;
            }

            // 2. Фильтр по странице
            if (show && filterData.page && filterData.page.length > 0 && pageIdx >= 0) {
                var rowPage = (tr.cells[pageIdx]?.textContent || '').trim() || '-';
                if (filterData.page.indexOf(rowPage) < 0) show = false;
            }

            // 3. Фильтр по установке
            if (show && filterData.installation && filterData.installation.length > 0 && instIdx >= 0) {
                var rowInst = (tr.cells[instIdx]?.textContent || '').trim() || '-';
                if (filterData.installation.indexOf(rowInst) < 0) show = false;
            }

            tr.style.display = show ? '' : 'none';
        });

        updateFilterIcons();
    }

    function initFilterIcons() {
        var table = document.getElementById('systemsTable');
        if (!table) return;

        table.querySelectorAll('.filter-icon').forEach(function(icon) {
            icon.onclick = function(e) {
                e.stopPropagation();
                var col = icon.dataset.col;
                var thead = table.querySelector('thead tr');
                var tbody = document.getElementById('systemsBody');
                var allTh = Array.from(thead.querySelectorAll('th'));
                var colIdx = allTh.findIndex(function(th) { return th.dataset.sort === col; });
                if (colIdx < 0) return;

                var values = {};
                tbody.querySelectorAll('tr[data-id]').forEach(function(tr) {
                    var rawVal = (tr.cells[colIdx]?.textContent || '').trim();
                    if (col === 'cabinet_names') {
                        var parts = rawVal.split(', ').map(function(s){ return s.trim(); }).filter(Boolean);
                        if (parts.length) {
                            parts.forEach(function(p){ values[p] = 1; });
                        } else {
                            values['-'] = 1;
                        }
                    } else {
                        values[rawVal || '-'] = 1;
                    }
                });

                var selectedValues = filterData[col] || [];

                var filterModal = document.createElement('div');
                filterModal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9999;display:flex;justify-content:center;align-items:center;';
                filterModal.innerHTML = '<div style="background:#fff;border-radius:8px;padding:20px;max-width:450px;width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.3);">' +
                    '<h3 style="margin-top:0;">Фильтр по ' + (icon.title || col) + '</h3>' +
                    '<div id="filterContentContainer" style="max-height:50vh;overflow-y:auto;margin-bottom:15px;border:1px solid #eee;padding:10px;border-radius:4px;"></div>' +
                    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">' +
                        '<button type="button" class="btn-sel-all btn btn-sm btn-secondary">Выбрать все</button>' +
                        '<button type="button" class="btn-desel-all btn btn-sm btn-secondary">Снять все</button>' +
                        '<button type="button" class="btn-close-f btn btn-sm btn-primary">Применить</button>' +
                    '</div>' +
                '</div>';
                document.body.appendChild(filterModal);

                var contentContainer = filterModal.querySelector('#filterContentContainer');
                var sortedKeys = Object.keys(values).sort(function(a,b){ return a.localeCompare(b, 'ru'); });

                contentContainer.innerHTML = sortedKeys.map(function(v) {
                    var ch = selectedValues.indexOf(v) >= 0 ? ' checked' : '';
                    return '<label style="display:block;font-size:13px;cursor:pointer;padding:3px 0;white-space:nowrap;"><input type="checkbox" class="f-cb" value="' + esc(v) + '"' + ch + '> ' + esc(v) + '</label>';
                }).join('');

                filterModal.querySelector('.btn-sel-all').onclick = function() {
                    contentContainer.querySelectorAll('.f-cb').forEach(function(cb) { cb.checked = true; });
                };
                filterModal.querySelector('.btn-desel-all').onclick = function() {
                    contentContainer.querySelectorAll('.f-cb').forEach(function(cb) { cb.checked = false; });
                };

                var closeHandler = function() {
                    var newSelected = [];
                    contentContainer.querySelectorAll('.f-cb:checked').forEach(function(cb) { newSelected.push(cb.value); });
                    filterData[col] = newSelected;

                    applyAllFilters();

                    fetch('/api/table-sort/systems', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filter_data: filterData })
                    }).catch(function(err) { console.error(err); });

                    filterModal.remove();
                };

                filterModal.querySelector('.btn-close-f').onclick = closeHandler;
                filterModal.onclick = function(ev) { if (ev.target === filterModal) closeHandler(); };
            };
        });
    }

    function applyHeaderSort(key, dir, saveToDb) {
        if (!window._systemsData || !key) return;
        sysSortKey = key;
        sysSortDir = dir;

        var table = document.getElementById('systemsTable');
        table.querySelectorAll('th[data-sort]').forEach(function(th) {
            th.classList.remove('sorted-asc', 'sorted-desc');
            if (th.dataset.sort === key) {
                th.classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted-desc');
            }
        });

        var data = (window._systemsData || []).slice();
        data.sort(function(a, b) {
            var va = (a[key] || '').toString().trim();
            var vb = (b[key] || '').toString().trim();
            var na = parseFloat(va);
            var nb = parseFloat(vb);
            if (!isNaN(na) && !isNaN(nb) && va == na.toString() && vb == nb.toString()) {
                return dir === 'asc' ? na - nb : nb - na;
            }
            return dir === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
        });

        renderSystems(data);

        if (saveToDb !== false) {
            var sortedIds = data.map(function(item){ return item.id; });
            localStorage.setItem('systems_sort', JSON.stringify({ key: key, dir: dir }));
            fetch('/api/table-sort/systems', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sort_order: sortedIds, sort_key: key, sort_dir: dir, filter_data: filterData })
            }).catch(function(e){ console.error(e); });
        }
    }

    function initSortableHeaders() {
        var table = document.getElementById('systemsTable');
        table.querySelectorAll('th[data-sort]').forEach(function(th) {
            th.style.cursor = 'pointer';
            th.onclick = function(e) {
                if (e.target.closest('.filter-icon')) return;
                e.stopPropagation();
                var key = this.dataset.sort;
                var newDir = (sysSortKey === key && sysSortDir === 'asc') ? 'desc' : 'asc';
                applyHeaderSort(key, newDir, true);
            };
        });
    }

    function loadSystems() {
        Promise.all([
            fetch('/api/systems?_=' + Date.now()).then(function(r) { return r.json(); }),
            fetch('/api/table-sort/systems?_=' + Date.now()).then(function(r) { return r.json(); }).catch(function(){ return {}; })
        ]).then(function(results) {
            var data = results[0];
            var saved = results[1] || {};
            if (!data || !data.length) { document.getElementById('systemsBody').innerHTML = '<tr><td colspan="9">Нет систем</td></tr>'; return; }
            
            var savedOrder = saved.sort_order || [];
            if (savedOrder.length > 0) {
                var dataMap = {};
                data.forEach(function(item) { dataMap[item.id] = item; });
                var ordered = [];
                savedOrder.forEach(function(id) { if (dataMap[id]) ordered.push(dataMap[id]); });
                data.forEach(function(item) { if (savedOrder.indexOf(item.id) < 0) ordered.push(item); });
                data = ordered;
            }

            window._systemsData = data;

            if (saved.filter_data) {
                filterData = {
                    cabinet_names: saved.filter_data.cabinet_names || saved.filter_data.cabinets || [],
                    page: saved.filter_data.page || [],
                    installation: saved.filter_data.installation || []
                };
            }

            initSortableHeaders();
            initFilterIcons();

            var savedKey = saved.sort_key || (JSON.parse(localStorage.getItem('systems_sort') || '{}').key);
            var savedDir = saved.sort_dir || (JSON.parse(localStorage.getItem('systems_sort') || '{}').dir) || 'asc';
            
            if (savedKey) {
                applyHeaderSort(savedKey, savedDir, false);
            } else {
                renderSystems(data);
            }
        });
    }

    document.getElementById('addSystemBtn').addEventListener('click', function() { openSystemForm(); });

    function openSystemForm(sys) {
        var isEdit = !!sys;
        var sysId = sys ? sys.id : null;

        var h = '<input type="hidden" id="sysId" value="' + (sys ? sys.id : '') + '">';
        h += '<div class="form-group"><label for="sysName">Название *</label><input type="text" id="sysName" class="form-control" value="' + esc(sys ? sys.name : '') + '" required></div>';
        h += '<div class="form-group"><label for="sysPage">Страница</label><input type="text" id="sysPage" class="form-control" value="' + esc(sys ? sys.page || '' : '') + '"></div>';
        h += '<div class="form-group"><label for="sysInstallation">Установка</label><textarea id="sysInstallation" class="form-control" rows="2">' + esc(sys ? sys.installation || '' : '') + '</textarea></div>';
        h += '<div class="form-group"><label for="sysDesc">Описание</label><textarea id="sysDesc" class="form-control" rows="2">' + esc(sys ? sys.description || '' : '') + '</textarea></div>';
        h += '<div class="form-group"><label for="sysRoom">Помещение</label><input type="text" id="sysRoom" class="form-control" value="' + esc(sys ? sys.room || '' : '') + '"></div>';
        h += '<div class="form-group"><label for="cabinetSelect">Привязанные шкафы</label>' +
             '<div style="display:flex;gap:5px;margin-bottom:5px;"><input type="text" id="newCabinetName" class="form-control" placeholder="Новый шкаф" style="flex:1;"><select id="newCabinetProject" class="form-control" style="width:140px;"><option value="">Проект</option></select><button type="button" id="addCabinetBtn" class="btn btn-sm btn-primary">+ Создать</button></div>' +
             '<select id="cabinetSelect" multiple class="form-control" style="width:100%;height:120px;"><option value="">Загрузка...</option></select></div>';
        
        modalTitle.textContent = isEdit ? 'Редактировать систему' : 'Добавить систему';
        modalForm.innerHTML = h + '<div class="form-actions" style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn btn-secondary cancel-sys-form-btn">Отмена</button><button type="submit" class="btn btn-primary">Сохранить</button></div>';
        
        modal.querySelector('.cancel-sys-form-btn').onclick = function() { modal.style.display = 'none'; };
        modal.style.display = 'flex';

        var reqs = [
            fetch('/api/projects').then(function(r){ return r.json(); }),
            fetch('/api/cabinets').then(function(r){ return r.json(); })
        ];
        if (isEdit && sysId) {
            reqs.push(fetch('/api/systems/' + sysId + '/cabinets').then(function(r){ return r.json(); }).catch(function(){ return []; }));
        }

        Promise.all(reqs).then(function(results) {
            var projects = results[0] || [];
            var cabs = results[1] || [];
            var linkedCabinetRows = (isEdit && results.length > 2) ? results[2] : [];
            
            var linkedIds = {};
            if (linkedCabinetRows && linkedCabinetRows.length) {
                linkedCabinetRows.forEach(function(row){ linkedIds[row.cabinet_id] = true; });
            } else if (sys && sys.cabinet_ids) {
                (sys.cabinet_ids + '').split(',').forEach(function(cid){ if(cid) linkedIds[parseInt(cid)] = true; });
            }

            var ps = modalForm.querySelector('#newCabinetProject');
            if (ps) {
                ps.innerHTML = '<option value="">Проект</option>';
                projects.forEach(function(p){ ps.innerHTML += '<option value="' + p.id + '">' + esc(p.name) + '</option>'; });
            }

            var sel = modalForm.querySelector('#cabinetSelect');
            if (sel) {
                sel.innerHTML = '';
                if (!cabs.length) {
                    sel.innerHTML = '<option value="0">-- Нет доступных шкафов --</option>';
                } else {
                    cabs.forEach(function(c) {
                        var isSelected = linkedIds[c.id] ? ' selected' : '';
                        sel.innerHTML += '<option value="' + c.id + '"' + isSelected + '>' + esc(c.name) + (c.project_name ? ' (' + esc(c.project_name) + ')' : '') + '</option>';
                    });
                }
            }

            var ab = modalForm.querySelector('#addCabinetBtn');
            if (ab) {
                ab.onclick = function() {
                    var n = modalForm.querySelector('#newCabinetName').value.trim();
                    var pVal = ps ? ps.value : '';
                    if (!n) { alert('Введите название шкафа'); return; }
                    if (!pVal) { alert('Выберите проект'); return; }
                    fetch('/api/cabinets', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: n, project_id: parseInt(pVal) })
                    })
                    .then(function(r){ return r.json(); })
                    .then(function(nc) {
                        if (nc.error || nc.message && !nc.id) { alert(nc.error || nc.message); return; }
                        var o = document.createElement('option');
                        o.value = nc.id;
                        o.textContent = nc.name;
                        o.selected = true;
                        sel.appendChild(o);
                        modalForm.querySelector('#newCabinetName').value = '';
                    }).catch(function(e){ alert(e.message); });
                };
            }
        });

        modalForm.onsubmit = function(e) {
            e.preventDefault();
            var name = modalForm.querySelector('#sysName').value.trim();
            if (!name) { alert('Введите название системы'); return; }

            var sc = [], sel = modalForm.querySelector('#cabinetSelect');
            if (sel) {
                for (var i = 0; i < sel.options.length; i++) {
                    var v = parseInt(sel.options[i].value);
                    if (sel.options[i].selected && v > 0) sc.push(v);
                }
            }

            var body = {
                name: name,
                page: modalForm.querySelector('#sysPage').value.trim() || null,
                installation: modalForm.querySelector('#sysInstallation').value.trim() || null,
                description: modalForm.querySelector('#sysDesc').value.trim() || null,
                room: modalForm.querySelector('#sysRoom').value.trim() || null,
                cabinet_ids: sc
            };

            var url = sys ? '/api/systems/' + sys.id : '/api/systems';
            fetch(url, {
                method: sys ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw new Error(d.message || 'Ошибка'); });
                modal.style.display = 'none';
                loadSystems();
            })
            .catch(function(e) { alert(e.message); });
        };
    }

    window.editSystem = function(id) {
        fetch('/api/systems/' + id).then(function(r) { return r.json(); }).then(function(s) { openSystemForm(s); });
    };

    window.openSystemModal = function(sysId) {
        var modal = document.createElement('div'); 
        modal.className = 'modal'; 
        modal.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:3000;';
        modal.innerHTML = '<div class="modal-content" style="max-width:900px;width:95vw;max-height:90vh;overflow-y:auto;position:relative;"><span class="modal-close" style="position:absolute;top:15px;right:20px;font-size:24px;cursor:pointer;">&times;</span><h3 id="sysModTitle" style="margin-top:0;display:flex;justify-content:space-between;align-items:center;padding-right:30px;"><span>Система</span></h3><div id="sysModBody">Загрузка...</div></div>';
        document.body.appendChild(modal);

        var closeModal = function() { modal.remove(); };
        modal.querySelector('.modal-close').onclick = closeModal;
        modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });

        function loadSysData() { 
            window._currentSysLoadFn = loadSysData;
            var bodyEl = modal.querySelector('#sysModBody');
            var titleEl = modal.querySelector('#sysModTitle');
            bodyEl.innerHTML = '<p style="color:#666;">Загрузка компонентов...</p>';

            fetch('/api/systems/' + sysId + '?_=' + Date.now()).then(function(r){ return r.json(); }).then(function(data){
                titleEl.innerHTML = '<span>Система: ' + esc(data.name || '') + '</span>' +
                    '<button class="btn btn-sm btn-delete" id="clearSysCompsBtn" style="font-size:12px;margin-left:15px;" title="Очистить все компоненты системы">🗑️ Очистить</button>';
                
                var clearBtn = titleEl.querySelector('#clearSysCompsBtn');
                if (clearBtn) {
                    clearBtn.onclick = function() {
                        if (!confirm('Удалить ВСЕ компоненты из этой системы? Это действие нельзя отменить.')) return;
                        fetch('/api/systems/' + sysId + '/components', { method: 'DELETE' })
                            .then(function(r){ return r.json(); })
                            .then(function(res){
                                alert('✅ ' + (res.message || 'Система очищена'));
                                loadSysData();
                                if (typeof loadSystems === 'function') loadSystems();
                            })
                            .catch(function(e){ alert('Ошибка: ' + e.message); });
                    };
                }

                var h = '';
                if (!data.components || !data.components.length) {
                    h += '<p style="color:#888;margin-bottom:15px;">К системе не привязано ни одного компонента.</p>';
                } else {
                    h += '<div class="table-container" style="margin-bottom:15px;"><table class="data-table"><thead><tr><th>ID</th><th>Компонент</th><th>Тип</th><th>Модуль</th><th>Кол-во</th><th>Действия</th></tr></thead><tbody>';
                    data.components.forEach(function(c){
                        h += '<tr>' +
                            '<td>' + c.id + '</td>' +
                            '<td><strong>' + esc(c.name) + '</strong></td>' +
                            '<td>' + esc(c.type_name || '-') + '</td>' +
                            '<td>' + esc(c.module_name || '-') + '</td>' +
                            '<td>' + (c.quantity || 1) + '</td>' +
                            '<td>' +
                                '<button class="btn btn-sm btn-edit" onclick="editSysCompInModal(' + c.id + ')">✏️</button> ' +
                                '<button class="btn btn-sm btn-delete" onclick="deleteCompFromSys(' + sysId + ',' + c.link_id + ')">🗑️</button>' +
                            '</td>' +
                        '</tr>';
                    });
                    h += '</tbody></table></div>';
                }

                h += '<div style="display:flex;gap:10px;justify-content:flex-start;">' +
                    '<button class="btn btn-primary btn-sm" id="attachCompToSysBtn">+ Привязать</button>' +
                    '<button class="btn btn-secondary btn-sm" id="addCompToSysBtn">+ Создать</button>' +
                '</div>';

                bodyEl.innerHTML = h;

                modal.querySelector('#attachCompToSysBtn').onclick = function(){ attachCompToSys(sysId, loadSysData); };
                modal.querySelector('#addCompToSysBtn').onclick = function(){ addCompToSys(sysId, loadSysData); };
            }).catch(function(err){
                bodyEl.innerHTML = '<p style="color:red;">Ошибка загрузки данных системы: ' + esc(err.message) + '</p>';
            });
        }

        loadSysData();
    };

    window.deleteCompFromSys = function(sysId, linkId) {
        if (!confirm('Удалить компонент из системы?')) return;
        fetch('/api/systems/link/' + linkId, { method: 'DELETE' })
        .then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
            if (window._currentSysLoadFn) window._currentSysLoadFn();
            if (typeof loadSystems === 'function') loadSystems();
        })
        .catch(function(e){ alert(e.message); });
    };

    window.editSysCompInModal = function(compId) {
        if (typeof SystemCompModal !== 'undefined') {
            SystemCompModal.open(compId, function(){
                if (window._currentSysLoadFn) window._currentSysLoadFn();
            });
        }
    };

    function attachCompToSys(sysId, refreshFn) {
        var m = document.createElement('div'); m.className = 'modal'; m.style.cssText = 'display:flex;justify-content:center;align-items:center;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:4000;';
        m.innerHTML = '<div class="modal-content" style="max-width:500px;width:90vw;"><span class="modal-close" style="position:absolute;top:10px;right:15px;font-size:20px;cursor:pointer;">&times;</span><h3>Привязать компонент</h3><select id="attSel" class="form-control" style="width:100%;"><option value="">-- выберите --</option></select><div style="margin-top:10px;"><label>Кол-во:</label><input type="number" id="attQty" class="form-control" value="1" min="1" style="width:100px;"></div><div style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;"><button type="button" class="btn btn-secondary cancel-att-btn">Отмена</button><button id="attOk" class="btn btn-primary">Привязать</button></div></div>';
        document.body.appendChild(m);
        
        var closeAttModal = function() { m.remove(); };
        m.querySelector('.modal-close').onclick = closeAttModal;
        m.querySelector('.cancel-att-btn').onclick = closeAttModal;
        m.addEventListener('click', function(e){ if(e.target===m) closeAttModal(); });

        fetch('/api/system-components').then(function(r){ return r.json(); }).then(function(comps){
            var sel = m.querySelector('#attSel');
            comps.forEach(function(c){ sel.innerHTML += '<option value="'+c.id+'">'+c.name+(c.type_name?' ('+c.type_name+')':'')+'</option>'; });
        });

        m.querySelector('#attOk').onclick = function(){
            var compId = m.querySelector('#attSel').value;
            var qty = parseInt(m.querySelector('#attQty').value) || 1;
            if (!compId) { alert('Выберите компонент'); return; }
            fetch('/api/systems/'+sysId+'/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({component_id:parseInt(compId),quantity:qty})})
            .then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); }); m.remove(); refreshFn(); })
            .catch(function(e){ alert(e.message); });
        };
    }

    function addCompToSys(sysId, refreshFn) {
        if (typeof SystemCompModal !== 'undefined') {
            SystemCompModal.open(null, function(compId){
                if (compId) {
                    var qty = prompt('Количество:', '1');
                    if (qty && !isNaN(qty) && parseInt(qty) > 0) {
                        fetch('/api/systems/'+sysId+'/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({component_id:compId,quantity:parseInt(qty)})})
                        .then(function(){ refreshFn(); })
                        .catch(function(e){ alert(e.message); });
                    }
                }
            }, false, null);
        }
    }

    window.deleteSystem = function(id) { if (!confirm('Удалить систему?')) return; fetch('/api/systems/' + id, { method: 'DELETE' }).then(loadSystems); };
    document.getElementById('exportBtn').addEventListener('click', async function() { var r = await fetch('/api/systems/export'); var b = await r.blob(); var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'systems.xlsx'; a.click(); });
    document.getElementById('importBtn').addEventListener('click', function() { document.getElementById('importFile').click(); });
    document.getElementById('importFile').addEventListener('change', async function() { var fd = new FormData(); fd.append('file', this.files[0]); await fetch('/api/systems/import', { method: 'POST', body: fd }); loadSystems(); this.value = ''; });

    loadSystems();
    window.pageInit = function() { loadSystems(); };
})();
</script>
