<div class="page-content">
    <div style="margin-bottom:10px;">
        <button id="addSystemBtn" class="btn btn-primary" style="display:none;">Добавить систему</button>
        <button id="exportBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
        <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
        <button id="importBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
    </div>
    <div class="table-container">
        <table class="data-table" id="systemsTable">
            <thead><tr><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="cabinet_names">Шкаф</th><th data-sort="description">Описание</th><th id="actionsCol" style="display:none;">Действия</th></tr></thead>
            <tbody id="systemsBody"><tr><td colspan="5" class="loading">Загрузка...</td></tr></tbody>
        </table>
    </div>
    <div id="modal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width:600px;">
            <span class="close-modal">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="modalForm"></form>
        </div>
    </div>
</div>
<script>
(function() {
    var user = JSON.parse(localStorage.getItem('user') || 'null');
    var isAdmin = user && user.role === 'admin';
    if (isAdmin) {
        document.getElementById('addSystemBtn').style.display = '';
        document.getElementById('exportBtn').style.display = '';
        document.getElementById('importBtn').style.display = '';
        document.getElementById('actionsCol').style.display = '';
    }
    function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
    var modal = document.getElementById('modal'), modalTitle = document.getElementById('modalTitle'), modalForm = document.getElementById('modalForm');
    document.querySelector('.close-modal').addEventListener('click', function() { modal.style.display = 'none'; });
    window.addEventListener('click', function(e) { if (e.target === modal) modal.style.display = 'none'; });

    var sysSortState = JSON.parse(localStorage.getItem('systems_sort') || '{}');
    var sysSortKey = sysSortState.key || null, sysSortDir = sysSortState.dir || 'asc';

    function renderSystems(data) {
        var tbody = document.getElementById('systemsBody');
        tbody.innerHTML = data.map(function(s) {
            return '<tr><td>' + s.id + '</td><td>' + esc(s.name) + '</td><td>' + esc(s.cabinet_names || '-') + '</td><td>' + esc(s.description || '') + '</td>' +
                (isAdmin ? '<td><button class="btn btn-sm btn-edit" onclick="editSystem(' + s.id + ')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystem(' + s.id + ')">🗑️</button></td>' : '') + '</tr>';
        }).join('');
    }

    function loadSystems() {
        fetch('/api/systems').then(function(r) { return r.json(); }).then(function(data) {
            if (!data.length) { document.getElementById('systemsBody').innerHTML = '<tr><td colspan="5">Нет систем</td></tr>'; return; }
            window._systemsData = data;
            if (sysSortKey) {
                data.sort(function(a, b) {
                    var va = (a[sysSortKey] || '').toString().toLowerCase();
                    var vb = (b[sysSortKey] || '').toString().toLowerCase();
                    if (sysSortKey === 'id') { va = parseInt(a.id) || 0; vb = parseInt(b.id) || 0; }
                    if (va < vb) return sysSortDir === 'asc' ? -1 : 1;
                    if (va > vb) return sysSortDir === 'asc' ? 1 : -1;
                    return 0;
                });
                var th = document.querySelector('th[data-sort="' + sysSortKey + '"]');
                if (th) th.classList.add(sysSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
            }
            renderSystems(data);
        });
    }

    // Сортировка
    var table = document.getElementById('systemsTable');
    table.querySelectorAll('th[data-sort]').forEach(function(th) {
        th.style.cursor = 'pointer';
        th.addEventListener('click', function() {
            var key = this.dataset.sort;
            if (sysSortKey === key) { sysSortDir = sysSortDir === 'asc' ? 'desc' : 'asc'; } else { sysSortKey = key; sysSortDir = 'asc'; }
            localStorage.setItem('systems_sort', JSON.stringify({key: sysSortKey, dir: sysSortDir}));

            var data = (window._systemsData || []).slice();
            data.sort(function(a, b) {
                var va = (a[key] || '').toString().toLowerCase();
                var vb = (b[key] || '').toString().toLowerCase();
                if (key === 'id') { va = parseInt(a.id) || 0; vb = parseInt(b.id) || 0; }
                if (va < vb) return sysSortDir === 'asc' ? -1 : 1;
                if (va > vb) return sysSortDir === 'asc' ? 1 : -1;
                return 0;
            });
            renderSystems(data);
            table.querySelectorAll('th').forEach(function(h) { h.classList.remove('sorted-asc', 'sorted-desc'); });
            th.classList.add(sysSortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
        });
    });

    document.getElementById('addSystemBtn').addEventListener('click', function() { openSystemForm(); });

    function openSystemForm(sys) {
        var isEdit = !!sys;
        var h = '<input type="hidden" id="sysId" value="' + (sys ? sys.id : '') + '">';
        h += '<div class="form-group"><label>Название *</label><input type="text" id="sysName" value="' + esc(sys ? sys.name : '') + '" required></div>';
        h += '<div class="form-group"><label>Описание</label><textarea id="sysDesc" rows="2">' + esc(sys ? sys.description || '' : '') + '</textarea></div>';
        modalTitle.textContent = isEdit ? 'Редактировать систему' : 'Добавить систему';
        modalForm.innerHTML = h + '<div class="form-actions"><button type="submit" class="btn btn-primary">Сохранить</button> <button type="button" class="btn btn-secondary" onclick="document.getElementById(\'modal\').style.display=\'none\'">Отмена</button></div>';
        modal.style.display = 'flex';
        modalForm.onsubmit = function(e) {
            e.preventDefault();
            var name = document.getElementById('sysName').value.trim();
            if (!name) { alert('Введите название'); return; }
            var body = { name: name, description: document.getElementById('sysDesc').value.trim() };
            var url = sys ? '/api/systems/' + sys.id : '/api/systems';
            fetch(url, { method: sys ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
                .then(function(r) { if (!r.ok) return r.json().then(function(d) { throw new Error(d.message); }); modal.style.display = 'none'; loadSystems(); })
                .catch(function(e) { alert(e.message); });
        };
    }

    window.editSystem = function(id) { fetch('/api/systems/' + id).then(function(r) { return r.json(); }).then(function(s) { openSystemForm(s); }); };
    window.deleteSystem = function(id) { if (!confirm('Удалить?')) return; fetch('/api/systems/' + id, { method: 'DELETE' }).then(loadSystems); };

    document.getElementById('exportBtn').addEventListener('click', async function() { var r = await fetch('/api/systems/export'); var b = await r.blob(); var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'systems.xlsx'; a.click(); });
    document.getElementById('importBtn').addEventListener('click', function() { document.getElementById('importFile').click(); });
    document.getElementById('importFile').addEventListener('change', async function() { var fd = new FormData(); fd.append('file', this.files[0]); await fetch('/api/systems/import', { method: 'POST', body: fd }); loadSystems(); this.value = ''; });

    window.pageInit = function() { loadSystems(); };
})();
</script>
