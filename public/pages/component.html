<h2>Компоненты</h2>
<div style="margin-bottom:10px;">
  <button id="addTemplateBtn">Добавить новый компонент</button>
  <button id="exportBtn">Экспорт Excel</button>
  <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
  <button id="importBtn">Импорт Excel</button>
</div>
<div id="templatesTable" style="margin-top:15px;"></div>

<script>
(function() {
  const token = localStorage.getItem('token');

  async function loadTemplatesList() {
    const container = document.getElementById('templatesTable');
    if (!container) return;
    try {
      const res = await fetch('/api/block-templates', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const templates = await res.json();
      let html = '<table><tr><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Цена, руб.</th><th>Трудозатраты, мин.</th><th>Параметры</th><th></th></tr>';
      if (templates.length === 0) {
        html = '<p>Нет компонентов.</p>';
      } else {
        templates.forEach(t => {
          const paramsStr = (t.parameters && t.parameters.length > 0) 
            ? t.parameters.map(p => `${p.param_name}=${p.param_value}`).join('; ')
            : '';
          html += `<tr>
            <td>${t.type_name || ''}</td>
            <td>${t.name}</td>
            <td>${t.manufacturer_name || ''}</td>
            <td>${t.article || ''}</td>
            <td>${t.price != null ? t.price : ''}</td>
            <td>${t.labor != null ? t.labor : ''}</td>
            <td>${paramsStr}</td>
            <td>
              <button class="small edit-template-btn" data-id="${t.id}">Редактировать</button>
              <button class="small danger delete-template-btn" data-id="${t.id}">Удалить</button>
            </td>
          </tr>`;
        });
      }
      html += '</table>';
      container.innerHTML = html;

      container.querySelectorAll('.edit-template-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          openTemplateModal(this.dataset.id);
        });
      });
      container.querySelectorAll('.delete-template-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
          if (!confirm('Удалить компонент?')) return;
          const id = this.dataset.id;
          try {
            await fetch('/api/block-templates/' + id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
            loadTemplatesList();
          } catch(e) { alert('Ошибка удаления'); }
        });
      });
    } catch(e) {
      container.innerHTML = '<p style="color:red;">Ошибка загрузки компонентов</p>';
    }
  }

  document.getElementById('addTemplateBtn').addEventListener('click', () => openTemplateModal());
  
  // Экспорт
  document.getElementById('exportBtn').addEventListener('click', async () => {
    try {
      const res = await fetch('/api/block-templates/export', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка экспорта'); return; }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'components.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch(e) { alert('Ошибка соединения'); }
  });

  // Импорт
  const fileInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch('/api/block-templates/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Ошибка импорта'); return; }
      alert(`Добавлено ${data.added} из ${data.total}`);
      loadTemplatesList();
      if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
    } catch(e) { alert('Ошибка соединения'); }
    fileInput.value = '';
  });

  loadTemplatesList();
})();
</script>
