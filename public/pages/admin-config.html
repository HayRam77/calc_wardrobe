<h2>Конфигурация</h2>

<div style="display:flex; gap:20px; margin-top:20px;">
  <div>
    <button id="exportBtn" class="small">📥 Экспорт базы данных</button>
    <span id="exportStatus" style="margin-left:10px;"></span>
  </div>
  <div>
    <input type="file" id="importFile" style="display:none" accept=".sql,.gz">
    <button id="importBtn" class="small">📤 Импорт базы данных</button>
    <span id="importStatus" style="margin-left:10px;"></span>
  </div>
</div>

<script>
(function() {
  const token = localStorage.getItem('token');

  // Экспорт
  document.getElementById('exportBtn').addEventListener('click', async () => {
    const status = document.getElementById('exportStatus');
    status.textContent = 'Выполняется экспорт...';
    try {
      const res = await fetch('/api/admin/database/export', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) {
        const err = await res.json();
        status.textContent = 'Ошибка: ' + (err.error || res.statusText);
        return;
      }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dump_' + new Date().toISOString().slice(0,10) + '.sql';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
      status.textContent = 'Экспорт завершён';
    } catch(e) {
      status.textContent = 'Ошибка соединения';
    }
  });

  // Импорт
  const fileInput = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const status = document.getElementById('importStatus');
    const file = fileInput.files[0];
    if (!file) return;
    if (!confirm('ВНИМАНИЕ! Импорт полностью заменит текущую базу данных. Продолжить?')) {
      fileInput.value = '';
      return;
    }
    status.textContent = 'Импорт выполняется...';
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch('/api/admin/database/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      if (!res.ok) {
        const err = await res.json();
        status.textContent = 'Ошибка: ' + (err.error || res.statusText);
        return;
      }
      status.textContent = 'Импорт успешно завершён. Рекомендуется перезагрузить страницу.';
    } catch(e) {
      status.textContent = 'Ошибка соединения';
    }
    fileInput.value = '';
  });
})();
</script>
