<div id="tab-types" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип компонентов шкафа</button>
    <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт</button>
    <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
    <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th style="width:1%"></th><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="category">Категория</th><th data-sort="description">Описание</th><th id="typesActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="typesBody"><tr><td colspan="6" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function() {
 var user = JSON.parse(localStorage.getItem("user") || "null");
 var isAdmin = user && user.role === "admin";
 applyPermissions();

 function applyPermissions(){
  ["addTypeBtn","exportTypesBtn","importTypesBtn"].forEach(function(id){ var el = document.getElementById(id); if(el) el.style.display = isAdmin ? "" : "none"; });
  var col = document.getElementById("typesActionsCol");
  if(col) col.style.display = isAdmin ? "" : "none";
 }

 function esc(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

 function ensureCabinetComponentTypeModal(cb) {
   if (typeof CabinetComponentTypeModal !== 'undefined') return cb();
   fetch('/components/cabinet-component-type-modal.html')
     .then(function(r) { return r.text(); })
     .then(function(html) {
       var div = document.createElement('div');
       div.innerHTML = html;
       Array.from(div.querySelectorAll('script')).forEach(function(s) {
         var newScript = document.createElement('script');
         newScript.textContent = s.textContent;
         document.body.appendChild(newScript);
       });
       cb();
     })
     .catch(function(err) {
       console.error(err);
       alert('Ошибка загрузки модального окна типа компонентов шкафа');
     });
 }

 function openCabinetTypeModal(typeId, callback) {
   ensureCabinetComponentTypeModal(function() {
     CabinetComponentTypeModal.open(typeId, callback);
   });
 }

 function setupDragAndDrop(tbody) {
   var dragInfo = null;
   function onMouseMove(e) {
     if (!dragInfo) return;
     var rows = Array.from(tbody.querySelectorAll("tr[data-id]"));
     var target = null;
     for (var i = 0; i < rows.length; i++) {
       var rect = rows[i].getBoundingClientRect();
       if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
     }
     if (target && target !== dragInfo.row) {
       var ti = rows.indexOf(target), ri = rows.indexOf(dragInfo.row);
       if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
       else tbody.insertBefore(dragInfo.row, target);
     }
   }
   function onMouseUp() {
     if (!dragInfo) return;
     dragInfo.row.style.opacity = "";
     document.removeEventListener("mousemove", onMouseMove);
     document.removeEventListener("mouseup", onMouseUp);

     var ids = Array.from(tbody.querySelectorAll("tr[data-id]")).map(function(tr) {
       return parseInt(tr.dataset.id);
     }).filter(Boolean);

     localStorage.setItem("component_types_order", JSON.stringify(ids));
     fetch("/api/table-sort/component-types", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({sort_order: ids}) }).catch(function(e){console.error(e);});
     fetch("/api/component-types/reorder", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ids: ids}) }).catch(function(e){console.error(e);});
     dragInfo = null;
   }

   tbody.addEventListener("mousedown", function(e) {
     var handle = e.target.closest(".drag-handle");
     if (!handle) return;
     e.preventDefault();
     var row = handle.closest("tr");
     if (!row) return;
     dragInfo = {row: row, startY: e.clientY};
     row.style.opacity = "0.5";
     document.addEventListener("mousemove", onMouseMove);
     document.addEventListener("mouseup", onMouseUp);
   });
 }

 function loadTypes(){
   var tbody = document.getElementById("typesBody");
   if(!tbody) return;
   fetch("/api/component-types?_="+Date.now())
   .then(function(r){ return r.json(); })
   .then(function(data){
     if(!data.length){ tbody.innerHTML = "<tr><td colspan=6>Нет типов компонентов шкафа</td></tr>"; return; }
     var html = "";
     for (var i = 0; i < data.length; i++) {
       var item = data[i];
       var nameHtml = item.has_bindings ? "<strong>" + esc(item.name) + "</strong>" : esc(item.name);
       html += "<tr draggable=\"false\" data-id=\""+item.id+"\"><td class=\"drag-handle\" style=\"cursor:grab;width:1%;\">\u282F</td><td>"+item.id+"</td><td>"+nameHtml+"</td><td>"+esc(item.category||"")+"</td><td>"+esc(item.description||"")+"</td>";
       if(isAdmin) html += "<td><button class=\"btn btn-sm btn-edit\" onclick=\"editType("+item.id+")\">\u270F\uFE0F</button> <button class=\"btn btn-sm btn-delete\" onclick=\"deleteType("+item.id+")\">\uD83D\uDDD1\uFE0F</button></td>";
       html += "</tr>";
     }
     tbody.innerHTML = html;
     setupDragAndDrop(tbody);
     initSortableHeaders();
     loadSortFromDB();
   }).catch(function(err){ console.error(err); tbody.innerHTML = "<tr><td colspan=6>Ошибка загрузки</td></tr>"; });
 }

 function initSortableHeaders(){
   var tbody = document.getElementById("typesBody");
   var thead = document.querySelector("#tab-types thead tr");
   if (!thead) return;
   thead.querySelectorAll("th[data-sort]").forEach(function(th) {
     th.style.cursor = "pointer";
     th.onclick = function() {
       var k = this.dataset.sort;
       var s = JSON.parse(localStorage.getItem("cab_types_sort") || "{}");
       s.dir = s.key === k ? (s.dir === "asc" ? "desc" : "asc") : "asc";
       s.key = k;
       localStorage.setItem("cab_types_sort", JSON.stringify(s));
       var rows = Array.from(tbody.querySelectorAll("tr[data-id]"));
       var colIdx = Array.from(thead.querySelectorAll("th")).findIndex(function(th) { return th.dataset.sort === k; });
       if (colIdx < 0) return;
       rows.sort(function(a, b) {
         var va = (a.cells[colIdx]?.textContent || "").trim();
         var vb = (b.cells[colIdx]?.textContent || "").trim();
         var na = parseFloat(va.replace(/,/g, ".")), nb = parseFloat(vb.replace(/,/g, "."));
         if (!isNaN(na) && !isNaN(nb)) return s.dir === "asc" ? na - nb : nb - na;
         return s.dir === "asc" ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
       });
       rows.forEach(function(row) { tbody.appendChild(row); });
       var ids = rows.map(function(r) { return parseInt(r.dataset.id); }).filter(Boolean);
       fetch("/api/table-sort/component-types", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({sort_order: ids, sort_key: k, sort_dir: s.dir}) }).catch(function(e){console.error(e);});
     };
   });
 }

 function loadSortFromDB(){
   var tbody = document.getElementById("typesBody");
   fetch("/api/table-sort/component-types").then(function(r){ return r.json(); }).then(function(saved){
     if (saved && saved.sort_order && saved.sort_order.length > 0) {
       saved.sort_order.forEach(function(id) {
         var row = tbody.querySelector("tr[data-id=\""+id+"\"]");
         if (row) tbody.appendChild(row);
       });
     }
   }).catch(function(e){ console.error(e); });
 }

 document.getElementById("addTypeBtn").addEventListener("click", function(){
   openCabinetTypeModal(null, function(){ loadTypes(); });
 });

 window.editType = function(id){
   openCabinetTypeModal(id, function(){ loadTypes(); });
 };

 window.deleteType = function(id){
   if(!confirm("Удалить?")) return;
   fetch("/api/component-types/"+id, { method:"DELETE" }).then(loadTypes);
 };

 document.getElementById("exportTypesBtn").addEventListener("click", async function(){
   var r = await fetch("/api/component-types/export"); var b = await r.blob();
   var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "component_types.xlsx"; a.click();
 });

 document.getElementById("importTypesBtn").addEventListener("click", function(){ document.getElementById("importTypesFile").click(); });
 document.getElementById("importTypesFile").addEventListener("change", async function(){
   var fd = new FormData(); fd.append("file", this.files[0]);
   await fetch("/api/component-types/import", { method:"POST", body:fd }); loadTypes(); this.value="";
 });

 loadTypes();
})();
</script>
