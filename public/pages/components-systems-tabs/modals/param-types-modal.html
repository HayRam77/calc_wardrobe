<form id="paramTypeForm">
  <div class="form-group">
    <label for="paramTypeName">Название <span style="color:red;">*</span></label>
    <input type="text" id="paramTypeName" class="form-control" required>
  </div>
  <div class="form-group">
    <label for="paramTypeValue">Значение</label>
    <input type="text" id="paramTypeValue" class="form-control">
  </div>
  <div class="form-actions" style="margin-top:15px;display:flex;gap:10px;justify-content:flex-end;">
    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modal').style.display='none'">Отмена</button>
    <button type="submit" class="btn btn-primary">Сохранить</button>
  </div>
</form>
