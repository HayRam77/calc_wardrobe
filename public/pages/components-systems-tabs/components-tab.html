<div id="tab-components" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addComponentBtn" class="btn btn-primary" style="display:none;">Добавить компонент систем</button>
    <button id="exportComponentsBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
    <input type="file" id="importComponentsFile" style="display:none" accept=".xlsx,.xls">
    <button id="importComponentsBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Тип</th><th>Название</th><th>Производитель</th><th>Артикул</th><th>Описание</th>
              <th>LN</th><th>TM</th><th>Параметры</th><th id="componentsActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="componentsBody"><tr><td colspan="10" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
  <div id="componentsEmpty" class="empty-state" style="display:none;"><p>Компонентов нет</p></div>
</div>
<script>
(function() {
 var currentUser=JSON.parse(localStorage.getItem('user') || 'null');
 var isAdmin=currentUser && currentUser.role==='admin';
 function applyPermissions(){
  var btns=['addComponentBtn','exportComponentsBtn','importComponentsBtn'];
  btns.forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isAdmin?'':'none'; });
  var col=document.getElementById('componentsActionsCol');
  if(col) col.style.display=isAdmin?'':'none';
 }
 function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
 function loadComponents(){
  var tbody=document.getElementById('componentsBody');
   window.loadComponents = loadComponents; // экспорт
  if(!tbody) return;
  fetch('/api/system-components')
  .then(function(res){ if(!res.ok) throw new Error('Ошибка'); return res.json(); })
  .then(function(data){
   var empty=document.getElementById('componentsEmpty');
   if(!data.length){
    if(empty) empty.style.display='';
    tbody.innerHTML='';
   }else{
    if(empty) empty.style.display='none';
    var html='';
    data.forEach(function(item){
     var paramsHtml='-';
     if(item.params && item.params.length){
      paramsHtml=item.params.map(function(p){
       return esc(p.name)+(p.type?' ('+esc(p.type)+')':'')+': '+esc(p.value);
      }).join('<br>');
     }
     html+='<tr><td>'+item.id+'</td><td>'+esc(item.type_name || '')+'</td><td>'+esc(item.name)+'</td><td>'+esc(item.manufacturer_name || '')+'</td><td>'+esc(item.article || '')+'</td><td>'+esc(item.description || '')+'</td><td>'+esc(item.ln || '')+'</td><td>'+esc(item.tm || '')+'</td><td>'+paramsHtml+'</td>';
     if(isAdmin){
      html+='<td><button class="btn btn-sm btn-edit" onclick="editSystemComponent('+item.id+')">✏️</button> <button class="btn btn-sm btn-duplicate" onclick="duplicateSystemComponent('+item.id+')">📋</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponent('+item.id+')">🗑️</button></td>';
     }
     html+='</tr>';
    });
    tbody.innerHTML=html;
   }
  }).catch(function(err){
   console.error(err);
   tbody.innerHTML='<tr><td colspan="10" class="error">Ошибка загрузки</td></tr>';
  });
 }
 document.getElementById('addComponentBtn').addEventListener('click', function(){
  if(typeof SystemCompModal !== 'undefined'){
   SystemCompModal.open(null, function(){ loadComponents(); });
  }else{
   setTimeout(function(){ document.getElementById('addComponentBtn').click(); }, 200);
  }
 });
 window.editSystemComponent=function(id){
  if(typeof SystemCompModal !== 'undefined'){
   SystemCompModal.open(id, function(){ loadComponents(); });
  }
 };
 window.deleteSystemComponent=function(id){
  if(!confirm('Удалить?')) return;
  fetch('/api/system-components/'+id, { method:'DELETE' })
  .then(loadComponents)
  .catch(function(e){ alert(e.message); });
 };
 document.getElementById('exportComponentsBtn').addEventListener('click', async function(){
  var r=await fetch('/api/system-components/export');
  var b=await r.blob();
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='system_components.xlsx';
  a.click();
 });
 document.getElementById('importComponentsBtn').addEventListener('click', function(){
  document.getElementById('importComponentsFile').click();
 });
 document.getElementById('importComponentsFile').addEventListener('change', async function(){
  var fd=new FormData();
  fd.append('file', this.files[0]);
  await fetch('/api/system-components/import', { method:'POST', body:fd });
  loadComponents();
  this.value='';
 });
 applyPermissions();
 loadComponents();
})();

window.duplicateSystemComponent = function(id) {
  if (!confirm('Создать копию этого компонента со всеми параметрами, блоками и материалами?')) return;
  fetch('/api/system-components/' + id + '/duplicate', { method: 'POST' })
    .then(function(r){
      if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
      return r.json();
    })
    .then(function(data){
      alert('✅ ' + data.message);
      if (typeof window.loadComponents === 'function') window.loadComponents();
    })
    .catch(function(e){ alert('Ошибка: ' + e.message); });
};


window.loadComponents = loadComponents;
</script>
