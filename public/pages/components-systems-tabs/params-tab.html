<div id="tab-params" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр</button>
    <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт</button>
    <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
    <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th style="width:1%"></th><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="description">Описание</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="paramsBody"><tr><td colspan="5" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
</div>
<script>
(function() {
 var user = JSON.parse(localStorage.getItem("user") || "null");
 var isAdmin = user && user.role === "admin";
 applyPermissions();
 function applyPermissions(){
  ["addParamBtn","exportParamsBtn","importParamsBtn"].forEach(function(id){ var el = document.getElementById(id); if(el) el.style.display = isAdmin ? "" : "none"; });
  var col = document.getElementById("paramsActionsCol");
  if(col) col.style.display = isAdmin ? "" : "none";
 }
 function esc(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }
 function updateStatusLine(ids) {
   var sl = document.getElementById("sortStatusLine");
   if (!sl) {
     sl = document.createElement("div"); sl.id = "sortStatusLine";
     sl.style.cssText = "margin-top:8px;font-size:12px;color:#555;";
     var btnDiv = document.querySelector("#tab-params > div:first-child");
     if (btnDiv) btnDiv.parentNode.insertBefore(sl, btnDiv.nextSibling);
   }
   sl.textContent = ids.length + ": " + ids.join(" - ");
 }
 function loadParams(){
   var tbody = document.getElementById("paramsBody");
   if(!tbody) return;
   fetch("/api/system-parameters?_="+Date.now())
   .then(function(r){ return r.json(); })
   .then(function(data){
     if(!data.length){ tbody.innerHTML = "<tr><td colspan=5>No params</td></tr>"; return; }
     var html = "";
     for (var i = 0; i < data.length; i++) {
       var item = data[i];
       html += "<tr draggable=\"false\" data-id=\""+item.id+"\"><td class=\"drag-handle\" style=\"cursor:grab;width:1%;\">\u282F</td><td>"+item.id+"</td><td>"+esc(item.name)+"</td><td>"+esc(item.description||"")+"</td>";
       if(isAdmin) html += "<td><button class=\"btn btn-sm btn-edit\" onclick=\"editParam("+item.id+")\">\u270F\uFE0F</button> <button class=\"btn btn-sm btn-delete\" onclick=\"deleteParam("+item.id+")\">\uD83D\uDDD1\uFE0F</button></td>";
       html += "</tr>";
     }
     tbody.innerHTML = html;
     initDragAndSort();
     initSortableHeaders();
     loadSortFromDB();
     updateStatusLine(data.map(function(x){return x.id;}));
   }).catch(function(err){ console.error(err); tbody.innerHTML = "<tr><td colspan=5>Error</td></tr>"; });
 }
 function initDragAndSort(){
   var tbody = document.getElementById("paramsBody");
   var table = tbody.closest("table");
   if (!table || table.dataset.dragInit) return;
   table.dataset.dragInit = "1";
   var dragInfo = null;
   tbody.addEventListener("mousedown", function(e) {
     var handle = e.target.closest(".drag-handle");
     if (!handle) return;
     e.preventDefault();
     var row = handle.closest("tr");
     if (!row) return;
     dragInfo = {row: row, startY: e.clientY};
     row.style.opacity = "0.5";
   });
   document.addEventListener("mousemove", function(e) {
     if (!dragInfo) return;
     var rows = Array.from(tbody.querySelectorAll("tr[data-id]"));
     var target = null;
     for (var i = 0; i < rows.length; i++) {
       var rect = rows[i].getBoundingClientRect();
       if (e.clientY > rect.top && e.clientY < rect.bottom) { target = rows[i]; break; }
     }
     if (target && target !== dragInfo.row) {
       var ti = rows.indexOf(target), ri = rows.indexOf(dragInfo.row);
       if (ri < ti) tbody.insertBefore(dragInfo.row, target.nextSibling);
       else tbody.insertBefore(dragInfo.row, target);
     }
   });
   document.addEventListener("mouseup", function() {
     if (!dragInfo) return;
     dragInfo.row.style.opacity = "";
     var ids = [];
     tbody.querySelectorAll("tr[data-id]").forEach(function(tr) { var id = parseInt(tr.dataset.id); if (id) ids.push(id); });
     localStorage.setItem("params_order", JSON.stringify(ids));
     updateStatusLine(ids);
     fetch("/api/table-sort/system-parameters", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({sort_order: ids}) }).catch(function(e){console.error(e);});
     fetch("/api/system-parameters/reorder", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ids: ids}) }).catch(function(e){console.error(e);});
     dragInfo = null;
   });
 }
 function initSortableHeaders(){
   var tbody = document.getElementById("paramsBody");
   var thead = document.querySelector("#tab-params thead tr");
   thead.querySelectorAll("th[data-sort]").forEach(function(th) {
     th.style.cursor = "pointer";
     th.onclick = function() {
       var k = this.dataset.sort;
       var s = JSON.parse(localStorage.getItem("params_sort") || "{}");
       s.dir = s.key === k ? (s.dir === "asc" ? "desc" : "asc") : "asc";
       s.key = k;
       localStorage.setItem("params_sort", JSON.stringify(s));
       var rows = Array.from(tbody.querySelectorAll("tr[data-id]"));
       var colIdx = Array.from(thead.querySelectorAll("th")).findIndex(function(th) { return th.dataset.sort === k; });
       if (colIdx < 0) return;
       rows.sort(function(a, b) {
         var va = (a.cells[colIdx]?.textContent || "").trim();
         var vb = (b.cells[colIdx]?.textContent || "").trim();
         var na = parseFloat(va.replace(/,/g, ".")), nb = parseFloat(vb.replace(/,/g, "."));
         if (!isNaN(na) && !isNaN(nb)) return s.dir === "asc" ? na - nb : nb - na;
         return s.dir === "asc" ? va.localeCompare(vb, "ru") : vb.localeCompare(va, "ru");
       });
       rows.forEach(function(row) { tbody.appendChild(row); });
       var ids = rows.map(function(r) { return parseInt(r.dataset.id); }).filter(Boolean);
       updateStatusLine(ids);
       fetch("/api/table-sort/system-parameters", { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({sort_order: ids, sort_key: k, sort_dir: s.dir}) }).catch(function(e){console.error(e);});
     };
   });
 }
 function loadSortFromDB(){
   var tbody = document.getElementById("paramsBody");
   fetch("/api/table-sort/system-parameters").then(function(r){ return r.json(); }).then(function(saved){
     if (saved && saved.sort_order && saved.sort_order.length > 0) {
       saved.sort_order.forEach(function(id) {
         var row = tbody.querySelector("tr[data-id=\""+id+"\"]");
         if (row) tbody.appendChild(row);
       });
       updateStatusLine(saved.sort_order);
     }
   });
 }
 document.getElementById("addParamBtn").addEventListener("click", function(){
   var name = prompt("Название:"); if (!name || !name.trim()) return;
   fetch("/api/system-parameters", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name: name.trim()}) }).then(loadParams);
 });
 window.editParam = function(id){
   var name = prompt("Новое название:"); if (!name || !name.trim()) return;
   fetch("/api/system-parameters/"+id, { method: "PUT", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name: name.trim()}) }).then(loadParams);
 };
 window.deleteParam = function(id){
   if(!confirm("Удалить?")) return;
   fetch("/api/system-parameters/"+id, { method:"DELETE" }).then(loadParams);
 };
 document.getElementById("exportParamsBtn").addEventListener("click", async function(){
   var r = await fetch("/api/system-parameters/export"); var b = await r.blob();
   var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "params.xlsx"; a.click();
 });
 document.getElementById("importParamsBtn").addEventListener("click", function(){ document.getElementById("importParamsFile").click(); });
 document.getElementById("importParamsFile").addEventListener("change", async function(){
   var fd = new FormData(); fd.append("file", this.files[0]);
   await fetch("/api/system-parameters/import", { method:"POST", body:fd }); loadParams(); this.value="";
 });
 loadParams();
})();
</script>
