<div id="tab-params" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addParamBtn" class="btn btn-primary" style="display:none;">Добавить параметр КОМПОНЕНТА СИСТЕМЫ</button>
    <button id="exportParamsBtn" class="btn btn-secondary" style="display:none;">Экспорт выгрузка</button>
    <input type="file" id="importParamsFile" style="display:none" accept=".xlsx,.xls">
    <button id="importParamsBtn" class="btn btn-secondary" style="display:none;">Импорт выгрузка</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="type">Тип</th><th data-sort="description">Описание</th>
              <th>LN</th><th>TM</th><th id="paramsActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="paramsBody"><tr><td colspan="7" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
  <div id="paramsEmpty" class="empty-state" style="display:none;"><p>Параметров нет</p></div>
</div>
<script>
(function() {
 var currentUser=JSON.parse(localStorage.getItem('user') || 'null');
 var isAdmin=currentUser && currentUser.role==='admin';

 function applyPermissions(){
  var btns=['addParamBtn','exportParamsBtn','importParamsBtn'];
  btns.forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isAdmin?'':'none'; });
  var col=document.getElementById('paramsActionsCol');
  if(col) col.style.display=isAdmin?'':'none';
 }

 function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

 function loadParams(){
  var tbody=document.getElementById('paramsBody');
  if(!tbody) return;
  fetch('/api/system-parameters?_='+Date.now()+'&sort='+(JSON.parse(localStorage.getItem('params_sort')||'{}').key||'name')+'&order='+(JSON.parse(localStorage.getItem('params_sort')||'{}').dir||'asc')).then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
  .then(function(data){
   var empty=document.getElementById('paramsEmpty');
   if(!data.length){
    if(empty) empty.style.display='';
    tbody.innerHTML='';
   }else{
    if(empty) empty.style.display='none';
    var html='';
    data.forEach(function(item){
     html+='<tr data-id="'+item.id+'"><td class="drag-handle" draggable="true">⠿</td><td>'+item.id+'</td><td>'+esc(item.name)+'</td><td>'+esc(item.type || '')+'</td><td>'+esc(item.description || '')+'</td><td>'+esc(item.ln)+'</td><td>'+esc(item.tm)+'</td>';
     if(isAdmin){
      html+='<td><button class="btn btn-sm btn-edit" onclick="editSystemParameter('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemParameter('+item.id+')">🗑️</button></td>';
     }
     html+='</tr>';
    });
    tbody.innerHTML=html;

  var t = tbody.closest('table');
  if (t) {
    var thd = t.querySelector('thead tr');
    var st = JSON.parse(localStorage.getItem('sp_sort') || '{}');
    var sk = st.key || null, sd = st.dir || 'asc';
    function srt(k, d) {
      if (!tbody || !k) return;
      var rs = Array.from(tbody.querySelectorAll('tr'));
      var ci = Array.from(thd.querySelectorAll('th')).findIndex(function(th) { return th.dataset.sort === k; });
      if (ci < 0) return;
      rs.sort(function(a, b) {
        var va = (a.cells[ci]?.textContent || '').trim();
        var vb = (b.cells[ci]?.textContent || '').trim();
        var na = parseFloat(va.replace(/,/g, '.')), nb = parseFloat(vb.replace(/,/g, '.'));
        if (!isNaN(na) && !isNaN(nb)) return d === 'asc' ? na - nb : nb - na;
        return d === 'asc' ? va.localeCompare(vb, 'ru') : vb.localeCompare(va, 'ru');
      });
      rs.forEach(function(r) { tbody.appendChild(r); });
      thd.querySelectorAll('th').forEach(function(th) { th.classList.remove('sorted-asc', 'sorted-desc'); if (th.dataset.sort === k) th.classList.add(d === 'asc' ? 'sorted-asc' : 'sorted-desc'); });
    }
    thd.querySelectorAll('th[data-sort]').forEach(function(th) {
      th.addEventListener('click', function() {
        var k = this.dataset.sort;
        if (sk === k) { sd = sd === 'asc' ? 'desc' : 'asc'; } else { sk = k; sd = 'asc'; }
        localStorage.setItem('sp_sort', JSON.stringify({key: sk, dir: sd}));
        srt(sk, sd);
      });
    });
    if (sk) setTimeout(function() { srt(sk, sd); }, 200);
    if (!t.dataset.dragInit) {
      t.dataset.dragInit = '1'; var dr = null;
      tbody.addEventListener('dragstart', function(e) { var h2 = e.target.closest('.drag-handle'); if (!h2) { e.preventDefault(); return; } dr = h2.closest('tr'); if (dr) dr.style.opacity = '0.5'; });
      tbody.addEventListener('dragend', function() { if (dr) dr.style.opacity = ''; dr = null; });
      tbody.addEventListener('dragover', function(e) { e.preventDefault(); });
      tbody.addEventListener('drop', function(e) {
        e.preventDefault(); var tg = e.target.closest('tr');
        if (!tg || !dr || tg === dr) return;
        var rs = Array.from(tbody.querySelectorAll('tr'));
        var from = rs.indexOf(dr), to = rs.indexOf(tg);
        if (from < 0 || to < 0) return;
        if (from < to) tbody.insertBefore(dr, tg.nextSibling); else tbody.insertBefore(dr, tg);
        var items = []; tbody.querySelectorAll('tr').forEach(function(tr, idx) { var id = tr.dataset.id; if (id) items.push({ id: parseInt(id), position: idx }); });
        fetch('/api/system-parameters/reorder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ items: items }) }).catch(function(e) { console.error(e); });
      });
    }
  }

   document.querySelectorAll('#tab-params th[data-sort]').forEach(function(th) {
     th.onclick = function() {
       var k = this.dataset.sort;
       var s = JSON.parse(localStorage.getItem('params_sort') || '{}');
       s.dir = s.key === k ? (s.dir === 'asc' ? 'desc' : 'asc') : 'asc';
       s.key = k;
       localStorage.setItem('params_sort', JSON.stringify(s));
       loadParams();
     };
   });
   }
  }).catch(function(err){
   console.error(err);
   tbody.innerHTML='<tr><td colspan="7" class="error">Ошибка загрузки</td></tr>';
  });
 }

 // ====== ИЗОЛИРОВАННОЕ МОДАЛЬНОЕ ОКНО ПАРАМЕТРА ======
 function openParamModal(id, callback) {
   var isEdit = !!id;
   var m = document.createElement('div');
   m.className = 'modal';
   m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:5000;';
   m.innerHTML = '<div class="modal-content" style="max-width:500px;max-height:90vh;overflow-y:auto;">' +
     '<span class="modal-close">&times;</span>' +
     '<h3>'+(isEdit?'Редактировать параметр':'Добавить параметр')+'</h3>' +
     '<form id="paramForm">' +
       '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="paramName" required></div>' +
       '<div class="form-group"><label>Тип:</label><input type="text" id="paramType"></div>' +
       '<div class="form-group"><label>Описание:</label><textarea id="paramDescription" rows="3"></textarea></div>' +
       '<div class="form-row" style="display:flex;gap:10px;">' +
         '<div class="form-group" style="flex:1;"><label>LN</label><input type="text" id="paramLn"></div>' +
         '<div class="form-group" style="flex:1;"><label>TM</label><input type="text" id="paramTm"></div>' +
       '</div>' +
       '<div class="form-actions">' +
         '<button type="submit" class="btn btn-primary">Сохранить</button>' +
         '<button type="button" class="btn btn-secondary cancel-param-btn">Отмена</button>' +
       '</div>' +
     '</form>' +
   '</div>';
   document.body.appendChild(m);

   function closeModal() { m.remove(); }
   m.querySelector('.modal-close').addEventListener('click', closeModal);
   m.querySelector('.cancel-param-btn').addEventListener('click', closeModal);
   m.addEventListener('click', function(e) { if(e.target === m) closeModal(); });

   var form = m.querySelector('#paramForm');
   if (isEdit) {
     fetch('/api/system-parameters/'+id).then(function(r){ return r.json(); }).then(function(p){
       form.paramName.value = p.name;
       form.paramType.value = p.type || '';
       form.paramDescription.value = p.description || '';
       form.paramLn.value = p.ln || '';
       form.paramTm.value = p.tm || '';
     }).catch(function(e){ alert('Ошибка загрузки данных'); closeModal(); });
   }

   form.addEventListener('submit', function(e){
     e.preventDefault();
     var name = form.paramName.value.trim();
     if (!name) { alert('Введите название'); return; }
     var body = {
       name: name,
       type: form.paramType.value.trim(),
       description: form.paramDescription.value.trim(),
       ln: form.paramLn.value.trim() || null,
       tm: form.paramTm.value.trim() || null
     };
     var url = isEdit ? '/api/system-parameters/'+id : '/api/system-parameters';
     var method = isEdit ? 'PUT' : 'POST';
     fetch(url, {
       method: method,
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify(body)
     }).then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); }); })
     .then(function(){
       closeModal();
       loadParams();
       if (callback) callback();
     }).catch(function(e){ alert(e.message); });
   });
 }

 document.getElementById('addParamBtn').addEventListener('click', function(){
   openParamModal(null);
 });

 window.editSystemParameter = function(id){
   openParamModal(id);
 };

 window.deleteSystemParameter = function(id){
  if(!confirm('Удалить?')) return;
  fetch('/api/system-parameters/'+id, { method:'DELETE' })
  .then(loadParams)
  .catch(function(e){ alert(e.message); });
 };

 document.getElementById('exportParamsBtn').addEventListener('click', async function(){
  var r=await fetch('/api/system-parameters/export');
  var b=await r.blob();
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='system_parameters.xlsx';
  a.click();
 });

 document.getElementById('importParamsBtn').addEventListener('click', function(){
  document.getElementById('importParamsFile').click();
 });

 document.getElementById('importParamsFile').addEventListener('change', async function(){
  var fd=new FormData();
  fd.append('file', this.files[0]);
  await fetch('/api/system-parameters/import', { method:'POST', body:fd });
  loadParams();
  this.value='';
 });

 applyPermissions();
 loadParams();
})();
</script>
