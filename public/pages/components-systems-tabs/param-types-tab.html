<div id="tab-param-types" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addParamTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип параметров</button>
    <button id="exportParamTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт Excel</button>
    <input type="file" id="importParamTypesFile" style="display:none" accept=".xlsx,.xls">
    <button id="importParamTypesBtn" class="btn btn-secondary" style="display:none;">Импорт Excel</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th style="width:1%"></th><th data-sort="id">ID</th><th data-sort="name">Название</th><th data-sort="value">Значение</th><th id="paramTypesActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="paramTypesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
  <div id="paramTypesEmpty" class="empty-state" style="display:none;"><p>Типов параметров нет</p></div>
</div>
<script>
(function() {
 var currentUser=JSON.parse(localStorage.getItem('user') || 'null');
 var isAdmin=currentUser && currentUser.role==='admin';

 function applyPermissions(){
  var btns=['addParamTypeBtn','exportParamTypesBtn','importParamTypesBtn'];
  btns.forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isAdmin?'':'none'; });
  var col=document.getElementById('paramTypesActionsCol');
  if(col) col.style.display=isAdmin?'':'none';
 }

 function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

 function loadParamTypes(){
  var tbody=document.getElementById('paramTypesBody');
  if(!tbody) return;
  fetch('/api/system-parameter-types?_='+Date.now()+'&sort='+(JSON.parse(localStorage.getItem('param_types_sort')||'{}').key||'name')+'&order='+(JSON.parse(localStorage.getItem('param_types_sort')||'{}').dir||'asc')).then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
  .then(function(data){
   var empty=document.getElementById('paramTypesEmpty');
   if(!data.length){
    if(empty) empty.style.display='';
    tbody.innerHTML='';
   }else{
    if(empty) empty.style.display='none';
    var html='';
    data.forEach(function(item){
     html+='<tr data-id="'+item.id+'"><td class="drag-handle" draggable="true">⠿</td><td>'+item.id+'</td><td>'+esc(item.name)+'</td><td>'+esc(item.value || '')+'</td>';
     if(isAdmin){
      html+='<td><button class="btn btn-sm btn-edit" onclick="editParamType('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteParamType('+item.id+')">🗑️</button></td>';
     }
     html+='</tr>';
    });
    tbody.innerHTML=html;
  setTimeout(function(){ initDragAndSort(tbody.closest('table'), 'spt_sort', '/api/system-parameter-types/reorder'); }, 100);
   document.querySelectorAll('#tab-param-types th[data-sort]').forEach(function(th) {
     th.onclick = function() {
       var k = this.dataset.sort;
       var s = JSON.parse(localStorage.getItem('param_types_sort') || '{}');
       s.dir = s.key === k ? (s.dir === 'asc' ? 'desc' : 'asc') : 'asc';
       s.key = k;
       localStorage.setItem('param_types_sort', JSON.stringify(s));
       loadParamTypes();
     };
   });
   }
  }).catch(function(err){
   console.error(err);
   tbody.innerHTML='<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';
  });
 }

 // ====== Изолированное модальное окно ======
 function openParamTypeModal(id, callback) {
   var isEdit = !!id;
   var m = document.createElement('div');
   m.className = 'modal';
   m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:5000;';
   m.innerHTML = '<div class="modal-content" style="max-width:500px;">' +
     '<span class="modal-close">&times;</span>' +
     '<h3>'+(isEdit?'Редактировать тип параметра':'Добавить тип параметра')+'</h3>' +
     '<form id="paramTypeForm">' +
       '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="paramTypeName" required></div>' +
       '<div class="form-group"><label>Значение:</label><input type="text" id="paramTypeValue"></div>' +
       '<div class="form-actions">' +
         '<button type="submit" class="btn btn-primary">Сохранить</button>' +
         '<button type="button" class="btn btn-secondary cancel-btn">Отмена</button>' +
       '</div>' +
     '</form>' +
   '</div>';
   document.body.appendChild(m);

   function closeModal() { m.remove(); }
   m.querySelector('.modal-close').addEventListener('click', closeModal);
   m.querySelector('.cancel-btn').addEventListener('click', closeModal);
   m.addEventListener('click', function(e) { if(e.target === m) closeModal(); });

   var form = m.querySelector('#paramTypeForm');
   if (isEdit) {
     fetch('/api/system-parameter-types/'+id).then(function(r){ return r.json(); }).then(function(t){
       form.paramTypeName.value = t.name;
       form.paramTypeValue.value = t.value || '';
     }).catch(function(e){ alert('Ошибка загрузки данных'); closeModal(); });
   }

   form.addEventListener('submit', function(e){
     e.preventDefault();
     var name = form.paramTypeName.value.trim();
     if (!name) { alert('Введите название'); return; }
     var body = { name: name, value: form.paramTypeValue.value.trim() };
     var url = isEdit ? '/api/system-parameter-types/'+id : '/api/system-parameter-types';
     var method = isEdit ? 'PUT' : 'POST';
     fetch(url, {
       method: method,
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify(body)
     }).then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); }); })
     .then(function(){
       closeModal();
       loadParamTypes();
       if (callback) callback();
     }).catch(function(e){ alert(e.message); });
   });
 }

 document.getElementById('addParamTypeBtn').addEventListener('click', function(){ openParamTypeModal(null); });
 window.editParamType = function(id){ openParamTypeModal(id); };
 window.deleteParamType = function(id){
  if(!confirm('Удалить?')) return;
  fetch('/api/system-parameter-types/'+id, { method:'DELETE' })
  .then(loadParamTypes)
  .catch(function(e){ alert(e.message); });
 };

 // Экспорт/импорт
 document.getElementById('exportParamTypesBtn').addEventListener('click', async function(){
  var r=await fetch('/api/system-parameter-types/export');
  var b=await r.blob();
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='system_parameter_types.xlsx';
  a.click();
 });
 document.getElementById('importParamTypesBtn').addEventListener('click', function(){
  document.getElementById('importParamTypesFile').click();
 });
 document.getElementById('importParamTypesFile').addEventListener('change', async function(){
  var fd=new FormData();
  fd.append('file', this.files[0]);
  await fetch('/api/system-parameter-types/import', { method:'POST', body:fd });
  loadParamTypes();
  this.value='';
 });

 applyPermissions();
 loadParamTypes();
})();
</script>
