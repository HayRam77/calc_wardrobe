<div id="tab-types" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип КОМПОНЕНТА СИСТЕМЫ</button>
    <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт выгрузка</button>
    <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
    <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт выгрузка</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Название</th><th>Описание</th>
              <th id="typesActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
  <div id="typesEmpty" class="empty-state" style="display:none;"><p>Типов нет</p></div>
</div>
<script>
(function() {
 var currentUser=JSON.parse(localStorage.getItem('user') || 'null');
 var isAdmin=currentUser && currentUser.role==='admin';

 function applyPermissions(){
  var btns=['addTypeBtn','exportTypesBtn','importTypesBtn'];
  btns.forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isAdmin?'':'none'; });
  var col=document.getElementById('typesActionsCol');
  if(col) col.style.display=isAdmin?'':'none';
 }

 function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

 function loadTypes(){
  var tbody=document.getElementById('typesBody');
  if(!tbody) return;
  fetch('/api/system-component-types?_='+Date.now()).then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
  .then(function(data){
   var empty=document.getElementById('typesEmpty');
   if(!data.length){
    if(empty) empty.style.display='';
    tbody.innerHTML='';
   }else{
    if(empty) empty.style.display='none';
    var html='';
    data.forEach(function(item){
     html+='<tr><td>'+item.id+'</td><td>'+esc(item.name)+'</td><td>'+esc(item.description || '')+'</td>';
     if(isAdmin){
      html+='<td><button class="btn btn-sm btn-edit" onclick="editSystemComponentType('+item.id+')">✏️</button> <button class="btn btn-sm btn-duplicate" onclick="copyTypeComposition('+item.id+')">📋</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponentType('+item.id+')">🗑️</button></td>';
     }
     html+='</tr>';
    });
    tbody.innerHTML=html;
   }
  }).catch(function(err){
   console.error(err);
   tbody.innerHTML='<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';
  });
 }

 // ====== ИЗОЛИРОВАННОЕ МОДАЛЬНОЕ ОКНО ТИПА ======
 function openTypeModal(id, callback) {
   var isEdit = !!id;
   var m = document.createElement('div');
   m.className = 'modal';
   m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:5000;';
   m.innerHTML = '<div class="modal-content" style="max-width:600px;max-height:90vh;overflow-y:auto;">' +
     '<span class="modal-close">&times;</span>' +
     '<h3>'+(isEdit?'Редактировать тип':'Добавить тип')+'</h3>' +
     '<form id="typeForm">' +
       '<div class="form-group"><label>Название: <span style="color:red;">*</span></label><input type="text" id="typeName" required></div>' +
       '<div class="form-group"><label>Описание:</label><textarea id="typeDescription" rows="3"></textarea></div>' +
       '<div class="form-group"><label>Материалы типа</label><div id="typeMaterialsList" style="margin-bottom:5px;"></div><button type="button" class="btn btn-sm btn-primary" id="addTypeMaterialBtn">+ Добавить материал</button></div>' +
       '<div class="form-group"><label>Компоненты шкафа типа</label><div id="typeBlocksList" style="margin-bottom:5px;"></div><button type="button" class="btn btn-sm btn-primary" id="addTypeBlockBtn">+ Добавить компонент шкафа</button></div>' +
       '<div class="form-actions">' +
         '<button type="submit" class="btn btn-primary">Сохранить</button>' +
         '<button type="button" class="btn btn-secondary cancel-type-btn">Отмена</button>' +
       '</div>' +
     '</form>' +
   '</div>';
   document.body.appendChild(m);

   function closeModal() { m.remove(); }
   m.querySelector('.modal-close').addEventListener('click', closeModal);
   m.querySelector('.cancel-type-btn').addEventListener('click', closeModal);
   m.addEventListener('click', function(e) { if(e.target === m) closeModal(); });

   var form = m.querySelector('#typeForm');
   if (isEdit) {
     fetch('/api/system-component-types/'+id).then(function(r){ return r.json(); }).then(function(t){
       form.typeName.value = t.name;
       form.typeDescription.value = t.description || '';
       loadTypeMaterials();
       loadTypeBlocks();
     }).catch(function(e){ alert('Ошибка загрузки данных'); closeModal(); });
   } else {
     var ml = m.querySelector('#typeMaterialsList');
     if (ml) ml.innerHTML = '';
     var bl = m.querySelector('#typeBlocksList');
     if (bl) bl.innerHTML = '';
   }

   function loadTypeMaterials() {
     var ml = m.querySelector('#typeMaterialsList');
     if (!ml) return;
     ml.innerHTML = 'Загрузка...';
     fetch('/api/system-component-types/'+id+'/materials')
       .then(function(r){ return r.json(); })
       .then(function(materials){
         if (!materials.length) {
           ml.innerHTML = '<p>Нет материалов</p>';
           return;
         }
         var html = '<table class="data-table"><tr><th>Название</th><th>Кол-во</th><th></th></tr>';
         materials.forEach(function(mat){
           html += '<tr><td>'+esc(mat.name)+'</td><td>'+mat.quantity+'</td><td><button class="btn btn-sm btn-delete" onclick="deleteTypeMaterial('+mat.material_id+')">🗑️</button></td></tr>';
         });
         html += '</table>';
         ml.innerHTML = html;
       });
   }

   function loadTypeBlocks() {
     var bl = m.querySelector('#typeBlocksList');
     if (!bl) return;
     bl.innerHTML = 'Загрузка...';
     fetch('/api/system-component-types/'+id+'/blocks')
       .then(function(r){ return r.json(); })
       .then(function(blocks){
         if (!blocks.length) {
           bl.innerHTML = '<p>Нет компонентов шкафа</p>';
           return;
         }
         var html = '<table class="data-table"><tr><th>Название</th><th>Артикул</th><th>Кол-во</th><th></th></tr>';
         blocks.forEach(function(b){
           html += '<tr><td>'+esc(b.name)+'</td><td>'+esc(b.article || '')+'</td><td>'+b.quantity+'</td><td><button class="btn btn-sm btn-delete" onclick="deleteTypeBlock('+b.block_template_id+')">🗑️</button></td></tr>';
         });
         html += '</table>';
         bl.innerHTML = html;
       });
   }

   window.deleteTypeMaterial = function(materialId) {
     if (!confirm('Удалить материал из типа?')) return;
     fetch('/api/system-component-types/'+id+'/materials/'+materialId, { method: 'DELETE' })
       .then(function(){ loadTypeMaterials(); });
   };

   window.deleteTypeBlock = function(blockTemplateId) {
     if (!confirm('Удалить компонент шкафа из типа?')) return;
     fetch('/api/system-component-types/'+id+'/blocks/'+blockTemplateId, { method: 'DELETE' })
       .then(function(){ loadTypeBlocks(); });
   };

   var addMaterialBtn = m.querySelector('#addTypeMaterialBtn');
   if (addMaterialBtn) addMaterialBtn.addEventListener('click', function(){
     if (typeof MaterialModal !== 'undefined') {
       MaterialModal.open(function(materialId){
         if (materialId) {
           var qty = prompt('Количество:', '1');
           if (qty && !isNaN(qty) && parseInt(qty) > 0) {
             fetch('/api/system-component-types/'+id+'/materials', {
               method: 'POST',
               headers: {'Content-Type': 'application/json'},
               body: JSON.stringify({ material_id: materialId, quantity: parseInt(qty) })
             }).then(function(){ loadTypeMaterials(); });
           }
         }
       });
     } else {
       alert('Модальное окно материалов не загружено');
     }
   });

   var addBlockBtn = m.querySelector('#addTypeBlockBtn');
   if (addBlockBtn) addBlockBtn.addEventListener('click', function(){
     if (typeof BlockTemplateModal !== 'undefined') {
       BlockTemplateModal.open(function(blockId){
         if (blockId) {
           var qty = prompt('Количество:', '1');
           if (qty && !isNaN(qty) && parseInt(qty) > 0) {
             fetch('/api/system-component-types/'+id+'/blocks', {
               method: 'POST',
               headers: {'Content-Type': 'application/json'},
               body: JSON.stringify({ block_template_id: blockId, quantity: parseInt(qty) })
             }).then(function(){ loadTypeBlocks(); });
           }
         }
       });
     } else {
       alert('Модальное окно компонентов шкафа не загружено');
     }
   });

   form.addEventListener('submit', function(e){
     e.preventDefault();
     var name = form.typeName.value.trim();
     if (!name) { alert('Введите название'); return; }
     var body = {
       name: name,
       description: form.typeDescription.value.trim()
     };
     var url = isEdit ? '/api/system-component-types/'+id : '/api/system-component-types';
     var method = isEdit ? 'PUT' : 'POST';
     fetch(url, {
       method: method,
       headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify(body)
     }).then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message); }); })
     .then(function(){
       closeModal();
       loadTypes();
       if (callback) callback();
     }).catch(function(e){ alert(e.message); });
   });
 }

 document.getElementById('addTypeBtn').addEventListener('click', function(){
   openTypeModal(null);
 });

 window.editSystemComponentType = function(id){
   openTypeModal(id);
 };

 window.deleteSystemComponentType = function(id){
  if(!confirm('Удалить?')) return;
  fetch('/api/system-component-types/'+id, { method:'DELETE' })
  .then(loadTypes)
  .catch(function(e){ alert(e.message); });
 };

window.copyTypeComposition = function(sourceId) {
  // Загружаем все типы и показываем модальное окно выбора
  fetch('/api/system-component-types')
    .then(function(r){ return r.json(); })
    .then(function(types){
      var m = document.createElement('div');
      m.className = 'modal';
      m.style.cssText = 'display:flex; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:5000;';
      m.innerHTML = '<div class="modal-content" style="max-width:400px;">' +
        '<span class="modal-close">&times;</span>' +
        '<h3>Копировать состав типа</h3>' +
        '<form id="copyTypeForm">' +
          '<div class="form-group"><label>Выберите целевой тип</label><select id="targetTypeSelect" required><option value="">-- выберите --</option></select></div>' +
          '<div class="form-actions"><button type="submit" class="btn btn-primary">Копировать</button> <button type="button" class="btn btn-secondary cancel-btn">Отмена</button></div>' +
        '</form>' +
      '</div>';
      document.body.appendChild(m);
      var sel = m.querySelector('#targetTypeSelect');
      types.forEach(function(t){
        if (t.id != sourceId) sel.innerHTML += '<option value="'+t.id+'">'+esc(t.name)+'</option>';
      });
      function closeModal() { m.remove(); }
      m.querySelector('.modal-close').addEventListener('click', closeModal);
      m.querySelector('.cancel-btn').addEventListener('click', closeModal);
      m.addEventListener('click', function(e){ if(e.target === m) closeModal(); });
      m.querySelector('#copyTypeForm').addEventListener('submit', function(e){
        e.preventDefault();
        var targetId = sel.value;
        if (!targetId) { alert('Выберите целевой тип'); return; }
        fetch('/api/system-component-types/' + sourceId + '/copy-to/' + targetId, { method: 'POST' })
          .then(function(r){
            if (!r.ok) return r.json().then(function(d){ throw new Error(d.message); });
            return r.json();
          })
          .then(function(data){
            alert('✅ ' + data.message);
            closeModal();
            loadTypes();
          })
          .catch(function(e){ alert('Ошибка: ' + e.message); });
      });
    });
};

 document.getElementById('exportTypesBtn').addEventListener('click', async function(){
  var r=await fetch('/api/system-component-types/export');
  var b=await r.blob();
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='system_component_types.xlsx';
  a.click();
 });

 document.getElementById('importTypesBtn').addEventListener('click', function(){
  document.getElementById('importTypesFile').click();
 });

 document.getElementById('importTypesFile').addEventListener('change', async function(){
  var fd=new FormData();
  fd.append('file', this.files[0]);
  await fetch('/api/system-component-types/import', { method:'POST', body:fd });
  loadTypes();
  this.value='';
 });

 applyPermissions();
 loadTypes();
})();
</script>
