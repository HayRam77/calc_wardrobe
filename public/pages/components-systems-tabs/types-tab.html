<div id="tab-types" class="tab-content">
  <div style="margin-bottom:10px;">
    <button id="addTypeBtn" class="btn btn-primary" style="display:none;">Добавить тип КОМПОНЕНТА СИСТЕМЫ</button>
    <button id="exportTypesBtn" class="btn btn-secondary" style="display:none;">Экспорт выгрузка</button>
    <input type="file" id="importTypesFile" style="display:none" accept=".xlsx,.xls">
    <button id="importTypesBtn" class="btn btn-secondary" style="display:none;">Импорт выгрузка</button>
  </div>
  <div class="table-container">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Название</th><th>Описание</th>
              <th id="typesActionsCol" style="display:none;">Действия</th></tr></thead>
      <tbody id="typesBody"><tr><td colspan="4" class="loading">Загрузка...</td></tr></tbody>
    </table>
  </div>
  <div id="typesEmpty" class="empty-state" style="display:none;"><p>Типов нет</p></div>
</div>
<script>
(function() {
 var currentUser=JSON.parse(localStorage.getItem('user') || 'null');
 var isAdmin=currentUser && currentUser.role==='admin';
 function applyPermissions(){
  var btns=['addTypeBtn','exportTypesBtn','importTypesBtn'];
  btns.forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display=isAdmin?'':'none'; });
  var col=document.getElementById('typesActionsCol');
  if(col) col.style.display=isAdmin?'':'none';
 }
 function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
 function loadTypes(){
  var tbody=document.getElementById('typesBody');
  if(!tbody) return;
  fetch('/api/system-component-types').then(function(r){ if(!r.ok) throw new Error('Ошибка'); return r.json(); })
  .then(function(data){
   var empty=document.getElementById('typesEmpty');
   if(!data.length){
    if(empty) empty.style.display='';
    tbody.innerHTML='';
   }else{
    if(empty) empty.style.display='none';
    var html='';
    data.forEach(function(item){
     html+='<tr><td>'+item.id+'</td><td>'+esc(item.name)+'</td><td>'+esc(item.description || '')+'</td>';
     if(isAdmin){
      html+='<td><button class="btn btn-sm btn-edit" onclick="editSystemComponentType('+item.id+')">✏️</button> <button class="btn btn-sm btn-delete" onclick="deleteSystemComponentType('+item.id+')">🗑️</button></td>';
     }
     html+='</tr>';
    });
    tbody.innerHTML=html;
   }
  }).catch(function(err){
   console.error(err);
   tbody.innerHTML='<tr><td colspan="4" class="error">Ошибка загрузки</td></tr>';
  });
 }
 document.getElementById('addTypeBtn').addEventListener('click', function(){
  var modal=document.getElementById('modal');
  if(modal) modal.style.display='flex';
  var title=document.getElementById('modalTitle');
  if(title) title.textContent='Добавить тип КОМПОНЕНТА СИСТЕМЫ';
  fetch('/pages/components-systems-tabs/modals/types-modal.html')
   .then(function(r){ return r.text(); })
   .then(function(html){
    var form=document.getElementById('modalForm');
    if(form) form.innerHTML=html;
    var formEl=document.getElementById('typeForm');
    if(formEl){
     formEl.onsubmit=function(e){
      e.preventDefault();
      var name=document.getElementById('typeName').value.trim();
      var desc=document.getElementById('typeDescription').value.trim();
      if(!name){ alert('Введите название'); return; }
      fetch('/api/system-component-types', {
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body:JSON.stringify({name:name,description:desc})
      }).then(function(r){ if(!r.ok) return r.json().then(function(d){ throw new Error(d.message || 'Ошибка'); }); })
      .then(function(){
       var modal=document.getElementById('modal');
       if(modal) modal.style.display='none';
       loadTypes();
      }).catch(function(e){ alert(e.message); });
     };
    }
   });
 });
 window.editSystemComponentType=function(id){
  fetch('/api/system-component-types/'+id).then(function(r){ return r.json(); })
  .then(function(t){
   var modal=document.getElementById('modal');
   if(modal) modal.style.display='flex';
   var title=document.getElementById('modalTitle');
   if(title) title.textContent='Редактировать тип';
   fetch('/pages/components-systems-tabs/modals/types-modal.html')
    .then(function(r){ return r.text(); })
    .then(function(html){
     var form=document.getElementById('modalForm');
     if(form) form.innerHTML=html;
     document.getElementById('typeName').value=t.name;
     document.getElementById('typeDescription').value=t.description || '';
     var formEl=document.getElementById('typeForm');
     if(formEl){
      formEl.onsubmit=function(e){
       e.preventDefault();
       fetch('/api/system-component-types/'+id, {
         method:'PUT',
         headers:{'Content-Type':'application/json'},
         body:JSON.stringify({
           name:document.getElementById('typeName').value.trim(),
           description:document.getElementById('typeDescription').value.trim()
         })
       }).then(function(){
         var modal=document.getElementById('modal');
         if(modal) modal.style.display='none';
         loadTypes();
       }).catch(function(e){ alert(e.message); });
      };
     }
    });
  });
 };
 window.deleteSystemComponentType=function(id){
  if(!confirm('Удалить?')) return;
  fetch('/api/system-component-types/'+id, { method:'DELETE' })
  .then(loadTypes)
  .catch(function(e){ alert(e.message); });
 };
 document.getElementById('exportTypesBtn').addEventListener('click', async function(){
  var r=await fetch('/api/system-component-types/export');
  var b=await r.blob();
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='system_component_types.xlsx';
  a.click();
 });
 document.getElementById('importTypesBtn').addEventListener('click', function(){
  document.getElementById('importTypesFile').click();
 });
 document.getElementById('importTypesFile').addEventListener('change', async function(){
  var fd=new FormData();
  fd.append('file', this.files[0]);
  await fetch('/api/system-component-types/import', { method:'POST', body:fd });
  loadTypes();
  this.value='';
 });
 applyPermissions();
 loadTypes();
})();
</script>
