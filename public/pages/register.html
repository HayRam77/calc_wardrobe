<!-- public/pages/register.html -->
<div class="auth-form">
  <h2>Регистрация</h2>
  <form id="registerForm">
    <div class="form-group">
      <label for="regUsername">Имя пользователя</label>
      <input type="text" id="regUsername" placeholder="Имя" required>
    </div>
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="Email" required>
    </div>
    <div class="form-group">
      <label for="regPassword">Пароль</label>
      <input type="password" id="regPassword" placeholder="Минимум 6 символов" required>
    </div>
    <div id="regError" class="error-message" style="display:none;"></div>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
  <p style="margin-top: 10px;">
    Уже есть аккаунт? <a href="#/login">Войти</a>
  </p>
</div>

<script>
(function() {
  const form = document.getElementById('registerForm');
  const errorDiv = document.getElementById('regError');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('regUsername').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    if (!username || !email || !password) {
      errorDiv.textContent = 'Заполните все поля';
      errorDiv.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Пароль должен содержать минимум 6 символов';
      errorDiv.style.display = 'block';
      return;
    }

    try {
      if (typeof Auth === 'undefined') throw new Error('Модуль авторизации не загружен');
      await Auth.register(username, email, password);
      window.location.hash = '#/home';
    } catch (err) {
      errorDiv.textContent = err.message;
      errorDiv.style.display = 'block';
    }
  });
})();
</script>
