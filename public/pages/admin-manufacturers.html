<h2>Производители</h2>
<div style="margin-bottom:10px;">
  <input type="text" id="newManufName" placeholder="Название производителя">
  <button id="addManufBtn">Добавить</button>
  <button id="exportManufBtn">Экспорт Excel</button>
  <input type="file" id="importFile" style="display:none" accept=".xlsx,.xls">
  <button id="importManufBtn">Импорт Excel</button>
</div>
<div id="manufTable"></div>
<script>
(function() {
  const token = localStorage.getItem('token');
  const container = document.getElementById('manufTable');

  async function loadManufacturers() {
    try {
      const res = await fetch('/api/manufacturers', { headers: { 'Authorization': 'Bearer ' + token } });
      if (!res.ok) throw new Error('Ошибка загрузки');
      const list = await res.json();
      let html = '<table><tr><th>Название</th><th></th></tr>';
      if (list.length === 0) html = '<p>Нет производителей</p>';
      else list.forEach(m => { html += `<tr><td>${m.name}</td><td><button class="small danger delete-manuf-btn" data-id="${m.id}">Удалить</button></td></tr>`; });
      html += '</table>';
      container.innerHTML = html;
      container.querySelectorAll('.delete-manuf-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          if (!confirm('Удалить?')) return;
          await fetch('/api/manufacturers/' + e.target.dataset.id, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
          if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
          loadManufacturers();
        });
      });
    } catch(e) { container.innerHTML = '<p style="color:red;">Ошибка</p>'; }
  }

  document.getElementById('addManufBtn').addEventListener('click', async () => {
    const name = document.getElementById('newManufName').value.trim();
    if (!name) return alert('Введите название');
    const res = await fetch('/api/manufacturers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ name })
    });
    if (!res.ok) { const err = await res.json(); alert(err.error || 'Ошибка'); return; }
    document.getElementById('newManufName').value = '';
    if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
    loadManufacturers();
  });

  // Экспорт через fetch и скачивание файла
  document.getElementById('exportManufBtn').addEventListener('click', async () => {
    try {
      const res = await fetch('/api/manufacturers/export', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) {
        const err = await res.json();
        alert(err.error || 'Ошибка экспорта');
        return;
      }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'manufacturers.xlsx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    } catch(e) { alert('Ошибка соединения'); }
  });

  // Импорт
  const fileInput = document.getElementById('importFile');
  document.getElementById('importManufBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    const formData = new FormData();
    formData.append('file', file);
    try {
      const res = await fetch('/api/manufacturers/import', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || 'Ошибка'); return; }
      alert(`Добавлено ${data.added} из ${data.total}`);
      if (typeof loadTemplatesGlobal === 'function') loadTemplatesGlobal();
      loadManufacturers();
    } catch(e) { alert('Ошибка импорта'); }
    fileInput.value = '';
  });

  loadManufacturers();
})();
</script>
